  });

  return { products: products, sales: sales, pointCreated: pointCreated };
}

/* ---------- История продаж за прошлые дни (сводно, без склада) ---------- */

var MONTH_WORDS_RU = {
  январ: 1, феврал: 2, март: 3, апрел: 4, май: 5, ма: 5, июн: 6, июл: 7, август: 8, сентябр: 9, октябр: 10, ноябр: 11, декабр: 12
};

function monthFromWord(word) {
  var w = String(word || '').toLowerCase();
  var keys = Object.keys(MONTH_WORDS_RU);
  for (var i = 0; i < keys.length; i++) {
    if (w.indexOf(keys[i]) === 0) return MONTH_WORDS_RU[keys[i]];
  }
  return null;
}

/** Вытаскивает суммы из строки: «125 000», «125,000», «125000 ₸» */
function historyNumbers(text) {
  var out = [];
  var re = /\d{1,3}(?:[ \u00A0]\d{3})+(?:[.,]\d{1,2})?|\d+(?:[.,]\d{1,2})?/g;
  var m;
  while ((m = re.exec(text)) !== null) {
    var raw = m[0].replace(/[ \u00A0]/g, '').replace(',', '.');
    var value = Number(raw);
    if (isFinite(value)) out.push({ value: value, raw: m[0], index: m.index });
  }
  return out;
}

/**
 * Разбор текста с историей: по строке на день.
 * 01.10.2026  125000            → выручка (всё наличными)
 * 01.10.2026  125000  34        → выручка и число чеков
 * 01.10.2026  125000  80000  45000       → выручка, наличные, Kaspi QR
 * 01.10.2026  125000  80000  45000  34   → + число чеков
 * Поддерживаются «1 октября 2026», «2026-10-01», заголовки «Октябрь 2026».
 */
function parseHistoryText(text, opts) {
  opts = opts || {};
  var avgCheck = Math.max(1, Number(opts.avgCheck) || 3000);
  var lines = String(text || '').split(/\r?\n/);
  var days = [], errors = [];
  var ctxMonth = null, ctxYear = new Date().getFullYear();
  var seen = {};

  lines.forEach(function (line, idx) {
    var raw = String(line || '').trim();
    if (!raw) return;
    if (/^[#/]/.test(raw)) return;

    // заголовок месяца: «Октябрь 2026», «Октябрь»
    var monthWord = raw.match(/^([А-Яа-яЁё]+)\s*(\d{4})?$/);
    if (monthWord) {
      var mm = monthFromWord(monthWord[1]);
      if (mm) {
        ctxMonth = mm;
        if (monthWord[2]) ctxYear = Number(monthWord[2]);
        return;
      }
    }
    var numericMonth = raw.match(/^(\d{1,2})[.\/](\d{4})$/);
    if (numericMonth) {
      ctxMonth = Number(numericMonth[1]);
      ctxYear = Number(numericMonth[2]);
      return;
    }

    var dateInfo = null;
    var rest = raw;

    // 1) dd.mm.yyyy | dd/mm/yy | dd-mm-yyyy
    var m1 = raw.match(/(\d{1,2})[.\/\-](\d{1,2})[.\/\-](\d{2,4})/);
    // 2) yyyy-mm-dd
    var m2 = raw.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
    // 3) «1 октября 2026»
    var m3 = raw.match(/(\d{1,2})\s+([А-Яа-яЁё]+)\s*(\d{4})?/);
    // 4) dd.mm без года
    var m4 = raw.match(/(\d{1,2})[.\/](\d{1,2})(?![\d.\/\-])/);

    if (m2) {
      dateInfo = { d: Number(m2[3]), m: Number(m2[2]), y: Number(m2[1]), match: m2[0] };
    } else if (m1) {
      var yy = Number(m1[3]);
      if (yy < 100) yy += 2000;
      dateInfo = { d: Number(m1[1]), m: Number(m1[2]), y: yy, match: m1[0] };
    } else if (m3 && monthFromWord(m3[2])) {
      dateInfo = { d: Number(m3[1]), m: monthFromWord(m3[2]), y: m3[3] ? Number(m3[3]) : ctxYear, match: m3[0] };
    } else if (m4 && ctxMonth) {
      dateInfo = { d: Number(m4[1]), m: Number(m4[2]), y: ctxYear, match: m4[0] };
    }

    if (!dateInfo) {
      if (historyNumbers(raw).length) errors.push('Строка ' + (idx + 1) + ': не понял дату — ' + raw.slice(0, 40));
      return;
    }

    rest = raw.replace(dateInfo.match, ' ');

    if (!dateInfo.m && ctxMonth) dateInfo.m = ctxMonth;
    if (!dateInfo.y && ctxYear) dateInfo.y = ctxYear;
    if (!dateInfo.m) {
      errors.push('Строка ' + (idx + 1) + ': не указан месяц');
      return;
    }

    var date = new Date(dateInfo.y, dateInfo.m - 1, dateInfo.d);
    if (isNaN(date.getTime()) || date.getDate() !== dateInfo.d) {
      errors.push('Строка ' + (idx + 1) + ': некорректная дата');
      return;
    }
    var key = dayKey(date);
    var numbers = historyNumbers(rest).map(function (x) { return Math.round(x.value); }).filter(function (v) { return v >= 0; });
    if (!numbers.length) {
      errors.push('Строка ' + (idx + 1) + ': нет сумм для ' + fmtDate(date));
      return;
    }

    var revenue = numbers[0] || 0;
    var cash = 0, qr = 0, count = 0;

    if (numbers.length === 1) {
      cash = revenue;
    } else if (numbers.length === 2) {
      if (numbers[1] <= 1000 || numbers[1] * 50 < revenue) {           // похоже на число чеков
        count = numbers[1];
        cash = revenue;
      } else {
        cash = numbers[1];
        qr = Math.max(0, revenue - cash);
      }
    } else if (numbers.length === 3) {
      cash = numbers[1];
      qr = numbers[2];
      if (cash + qr !== revenue) {
        // возможно, третье число — количество чеков
        if (numbers[2] <= 1000) {
          qr = Math.max(0, revenue - cash);
          count = numbers[2];
        } else {
          errors.push('Строка ' + (idx + 1) + ': наличные ' + fmtMoney(cash) + ' + QR ' + fmtMoney(qr) + ' ≠ выручка ' + fmtMoney(revenue));
          return;
        }
      }
    } else {
      cash = numbers[1];
      qr = numbers[2];
      count = numbers[3];
      if (cash + qr !== revenue) {
        errors.push('Строка ' + (idx + 1) + ': наличные ' + fmtMoney(cash) + ' + QR ' + fmtMoney(qr) + ' ≠ выручка ' + fmtMoney(revenue));
        return;
      }
    }

    if (cash + qr === 0) { cash = revenue; }
    revenue = cash + qr;
    if (!count) count = Math.max(1, Math.round(revenue / avgCheck));

    if (seen[key]) {
      errors.push('Строка ' + (idx + 1) + ': ' + fmtDate(date) + ' уже указана выше');
      return;
    }
    seen[key] = true;

    days.push({
      key: key,
      date: date.getTime(),
      revenue: revenue,
      cash: cash,
      qr: qr,
      count: count,
      line: idx + 1
    });
  });

  days.sort(function (a, b) { return a.date - b.date; });
  return {
    days: days,
    errors: errors,
    revenue: days.reduce(function (sum, d) { return sum + d.revenue; }, 0),
    receipts: days.reduce(function (sum, d) { return sum + d.count; }, 0)
  };
}

/* ---------- Разбор списка транзакций из старой системы ---------- */

function matchPaymentWord(text) {
  var t = String(text || '').toLowerCase();
  if (/каспи|kaspi|qr/.test(t)) return 'qr';
  if (/смеш|mixed/.test(t)) return 'mixed';
  return 'cash';
}

/** Ищет точку по названию внутри «Услуга/Точка: Гипс. My kids» */
function matchPointFromText(text, points) {
  var t = String(text || '').toLowerCase().replace(/\s+/g, '');
  var found = null;
  (points || []).forEach(function (p) {
    var name = String(p.name || '').toLowerCase().replace(/\s+/g, '');
    if (name && t.indexOf(name) !== -1) {
      if (!found || name.length > String(found.name).length) found = p;
    }
  });
  return found;
}

/** «Аквагримм 1500 × 1 шт, Пряди × 2 шт» → [{name, price, qty}] */
function parseItemsText(text, total) {
  var clean = String(text || '').replace(/\s*шт\.?\s*$/i, '');
  var parts = clean.split(/\s*,\s*/).filter(Boolean);
  var items = [];
  parts.forEach(function (part) {
    var m = part.match(/^(.*?)\s*[×x]\s*(\d+)/i);
    var namePart = m ? m[1] : part;
    var qty = m ? Number(m[2]) : 1;
    var priceMatch = namePart.match(/^(.*?)\s*(\d[\d\s ]*)(?:[.,]\d{1,2})?\s*$/);
    var name = namePart.trim();
    var price = 0;
    if (priceMatch) {
      name = priceMatch[1].trim();
      price = Math.round(Number(String(priceMatch[2]).replace(/\s/g, '').replace(',', '.')) || 0);
    }
    if (!name) return;
    items.push({ name: name, price: price, qty: Math.max(1, Math.round(qty)) });
  });

  // добиваем сумму, чтобы состав совпал с чеком
  if (items.length && total > 0) {
    var known = items.reduce(function (sum, it) { return sum + it.price * it.qty; }, 0);
    var diff = total - known;
    if (diff !== 0) {
      // сначала отдаём остаток позициям без цены («Пряди × 2 шт»), потом остальным
      var zeros = items.filter(function (it) { return !it.price; });
      var withPrice = items.filter(function (it) { return it.price > 0; });
      var target = zeros.length ? zeros : withPrice;
      if (target.length) {
        var perUnit = diff / target.reduce(function (n, it) { return n + it.qty; }, 0);
        target.forEach(function (it) { it.price = Math.max(0, Math.round(it.price + perUnit)); });
      } else {
        var free = items[0];
        free.price = Math.max(0, Math.round(total / free.qty));
      }
      // последняя корректировка до точной суммы
      var sum2 = items.reduce(function (sum, it) { return sum + it.price * it.qty; }, 0);
      if (sum2 !== total) {
        var it0 = items[0];
        it0.price = Math.max(0, it0.price + (total - sum2));
      }
    }
  }
  return items;
}

/**
 * Разбор вставленного списка транзакций:
 * 13:27 — Арина Турланова
 * Услуга/Точка: Аквагримм. Керуен
 * Оплата: Каспи QR
 * Товары: Аквагримм 1500 × 1 шт
 * Сумма: 1 500.00 ₸
 */
function parseTransactionsText(text, opts) {
  opts = opts || {};
  var lines = String(text || '').split(/\r?\n/);
  var transactions = [], errors = [];
  var current = null;
  var dateStr = opts.date || dayKey(new Date());

  function flush() {
    if (!current) return;
    if (!current.total) {
      errors.push('Строка ' + (current.line + 1) + ': не указана сумма — запись «' + current.seller + '» пропущена');
      current = null;
      return;
    }
    var parts = String(dateStr).split('-');
    var ts = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]), current.hh, current.mm, 0, 0);
    if (isNaN(ts.getTime())) {
      errors.push('Некорректная дата для записи «' + current.seller + '»');
      current = null;
      return;
    }
    var point = matchPointFromText(current.pointRaw, DB.points);
    transactions.push({
      at: ts.getTime(),
      seller: current.seller,
      pointRaw: current.pointRaw,
      pointId: point ? point.id : null,
      pointName: point ? point.name : (current.pointRaw || ''),
      payment: current.payment,
      items: parseItemsText(current.itemsRaw, current.total),
      total: Math.round(current.total),
      cashAmount: current.payment === 'cash' ? Math.round(current.total) : 0,
      qrAmount: current.payment === 'qr' ? Math.round(current.total) : 0,
      line: current.line
    });
    current = null;
  }

  lines.forEach(function (line, idx) {
    var raw = String(line || '').trim();
    if (!raw) return;

    var timeMatch = raw.match(/^(\d{1,2}):(\d{2})\s*[—–-]\s*(.+)$/);
    if (timeMatch) {
      flush();
      current = {
        hh: Math.min(23, Number(timeMatch[1])),
        mm: Math.min(59, Number(timeMatch[2])),
        seller: timeMatch[3].trim(),
        pointRaw: '', payment: 'cash', itemsRaw: '', total: 0, line: idx
      };
      return;
    }
    if (!current) return;

    var m;
    if ((m = raw.match(/^(?:услуга\s*\/?\s*точка|точка|услуга)\s*:\s*(.+)$/i))) { current.pointRaw = m[1].trim(); return; }
    if ((m = raw.match(/^оплата\s*:\s*(.+)$/i))) { current.payment = matchPaymentWord(m[1]); return; }
    if ((m = raw.match(/^товары\s*:\s*(.+)$/i))) { current.itemsRaw = m[1].trim(); return; }
    if ((m = raw.match(/^сумма\s*:\s*([\d\s ]+(?:[.,]\d{1,2})?)\s*(?:₸|тг|tenge)?$/i))) {
      current.total = Math.round(Number(String(m[1]).replace(/\s/g, '').replace(',', '.')) || 0);
      return;
    }
  });
  flush();

  return {
    transactions: transactions,
    errors: errors,
    revenue: transactions.reduce(function (sum, t) { return sum + t.total; }, 0),
    receipts: transactions.length
  };
}

/** Заносит разобранные транзакции как продажи (склад не трогает) */
function importTransactions(list, opts) {
  opts = opts || {};
  var actor = opts.actor || currentUser();
  if (!actor || (actor.role !== 'admin' && actor.role !== 'dev')) {
    return { error: 'Вносить историю может администратор или разработчик' };
  }
  if (!Array.isArray(list) || !list.length) return { error: 'Нет транзакций для импорта' };

  var todayStart = startOfDay(new Date());
  var replace = opts.replace !== false;
  var daysToClear = {};

  list.forEach(function (t) { if (t.at < todayStart) daysToClear[dayKey(new Date(t.at))] = true; });

  // сводные «заглушки» этих дней убираем всегда — иначе они сложатся с транзакциями
  var removed = DB.sales.filter(function (s) {
    return isHistoryStub(s) && daysToClear[dayKey(s.createdAt)];
  }).length;
  if (removed) {
    DB.sales = DB.sales.filter(function (s) { return !(isHistoryStub(s) && daysToClear[dayKey(s.createdAt)]); });
  }
  if (replace && Object.keys(daysToClear).length) {
    var beforeReplace = DB.sales.length;
    DB.sales = DB.sales.filter(function (s) {
      if (!s.historyImport) return true;
      return !daysToClear[dayKey(s.createdAt)];
    });
    removed += beforeReplace - DB.sales.length;
  }

  var created = 0, skipped = 0, revenue = 0;
  if (!DB.settings.historyImports || typeof DB.settings.historyImports !== 'object') DB.settings.historyImports = {};

  list.forEach(function (t) {
    if (!(t.at < todayStart) || !(t.total > 0)) { skipped++; return; }

    var seller = null;
    var needle = String(t.seller || '').trim().toLowerCase();
    if (needle) {
      seller = DB.users.find(function (u) { return String(u.fullName || '').trim().toLowerCase() === needle; }) || null;
      if (!seller) {
        var short = needle.split(' ')[0];
        var byFirst = DB.users.filter(function (u) { return String(u.fullName || '').toLowerCase().indexOf(short) === 0; });
        if (byFirst.length === 1) seller = byFirst[0];
      }
    }

    var items = (t.items || []).map(function (it) {
      var product = DB.products.find(function (p) { return String(p.name).trim().toLowerCase() === String(it.name).trim().toLowerCase(); });
      return { productId: product ? product.id : null, name: it.name, price: it.price, qty: it.qty };
    });

    DB.sales.push({
      id: uid(),
      code: shortId(),
      userId: seller ? seller.id : actor.id,
      userName: seller ? seller.fullName : (t.seller || actor.fullName),
      pointId: t.pointId || null,
      pointName: t.pointName || '',
      items: items,
      total: Math.round(t.total),
      payment: t.payment === 'qr' ? 'qr' : (t.payment === 'mixed' ? 'mixed' : 'cash'),
      cashAmount: t.cashAmount || 0,
      qrAmount: t.qrAmount || 0,
      receipt: null,
      imported: true,
      historyImport: true,
      note: 'История до внедрения',
      createdAt: t.at,
      updatedAt: Date.now()
    });
    created++;
    revenue += Math.round(t.total);
  });

  rebuildHistoryImports();
  DB.settings.updatedAt = Date.now();
  saveDB();
  return { created: created, removed: removed, skipped: skipped, revenue: revenue };
}

/** Проверяет, похож ли текст на список транзакций */
function looksLikeTransactions(text) {
  return /^\s*\d{1,2}:\d{2}\s*[—–-]/m.test(String(text || '')) && /оплата\s*:/i.test(String(text || ''));
}

/**
 * Заносит историю продаж: каждая строка — день со сводными суммами.
 * Склад не трогается, товары не списываются: это только выручка прошлых дней.
 */
function importHistoryDays(days, opts) {
  opts = opts || {};
  var actor = opts.actor || currentUser();
  if (!actor || (actor.role !== 'admin' && actor.role !== 'dev')) {
    return { error: 'Вносить историю может администратор или разработчик' };
  }
  if (!Array.isArray(days) || !days.length) return { error: 'Нет строк для импорта' };

  var replace = opts.replace !== false;
  var pointId = opts.pointId || null;
  var point = pointId ? getPoint(pointId) : null;
  var todayStart = startOfDay(new Date());
  var created = 0, removed = 0, skipped = 0, revenue = 0, receipts = 0;

  if (!DB.settings.historyImports || typeof DB.settings.historyImports !== 'object') DB.settings.historyImports = {};

  days.forEach(function (day) {
    var key = day.key || dayKey(new Date(day.date));
    var at = startOfDay(new Date(day.date));
    if (at >= todayStart) { skipped++; return; }
    if (!(day.revenue > 0)) { skipped++; return; }

    var had = DB.sales.some(function (s) { return s.historyImport && dayKey(s.createdAt) === key; });
    if (had && !replace) { skipped++; return; }
    if (had) {
      var before = DB.sales.length;
      DB.sales = DB.sales.filter(function (s) { return !(s.historyImport && dayKey(s.createdAt) === key); });
      removed += before - DB.sales.length;
    }

    var count = Math.max(1, Math.min(400, Math.round(day.count || 1)));
    var cash = Math.round(day.cash || 0);
    var qr = Math.round(day.qr || 0);
    var total = cash + qr;
    if (!total) { cash = total = Math.round(day.revenue); }

    var nCash = total ? Math.round(count * cash / total) : count;
    var nQr = count - nCash;
    if (nQr < 0) { nCash = count; nQr = 0; }
    if (!qr) { nCash = count; nQr = 0; }
    if (!cash) { nCash = 0; nQr = count; }

    function spread(totalSum, n) {
      var list = [], base = Math.floor(totalSum / Math.max(1, n));
      for (var i = 0; i < n; i++) list.push(base);
      var rest = totalSum - base * n;
      if (list.length) list[list.length - 1] += rest;
      return list;
    }

    var cashParts = spread(cash, nCash);
    var qrParts = spread(qr, nQr);
    var all = cashParts.map(function (v) { return { total: v, payment: 'cash' }; })
      .concat(qrParts.map(function (v) { return { total: v, payment: 'qr' }; }))
      .filter(function (r) { return r.total > 0; });

    all.forEach(function (rec, i) {
      var ts = new Date(at);
      var step = Math.floor(10 * 60 / Math.max(1, all.length));
      ts.setHours(9 + Math.floor((i * 11 * 60 / Math.max(1, all.length)) / 60), (i * 7) % 60, 0, 0);
      DB.sales.push({
        id: uid(),
        code: shortId(),
        userId: actor.id,
        userName: actor.fullName,
        pointId: pointId,
        pointName: point ? point.name : 'Сводно',
        items: [],
        total: rec.total,
        payment: rec.payment,
        cashAmount: rec.payment === 'cash' ? rec.total : 0,
        qrAmount: rec.payment === 'qr' ? rec.total : 0,
        receipt: null,
        imported: true,
        historyImport: true,
        note: 'История до внедрения',
        createdAt: ts.getTime(),
        updatedAt: Date.now()
      });
      created++;
    });

    revenue += total;
    receipts += count;
    DB.settings.historyImports[key] = { revenue: total, cash: cash, qr: qr, count: count, at: Date.now() };
  });

  rebuildHistoryImports();
  DB.settings.updatedAt = Date.now();
  saveDB();
  return { created: created, removed: removed, skipped: skipped, revenue: revenue, receipts: receipts };
}

/* ---------- Корректировка показателей и удаление продаж (разработчик) ---------- */

/** Править можно только дни строго до этой даты */
var ADJUST_LIMIT_KEY = '2026-10-22';

function canAdjustDay(key) {
  var k = String(key || '');
  if (!parseDayKey(k)) return false;
  return k < ADJUST_LIMIT_KEY;
}

function dayAdjustments() {
  if (!DB.settings.dayAdjustments || typeof DB.settings.dayAdjustments !== 'object') DB.settings.dayAdjustments = {};
  return DB.settings.dayAdjustments;
}

function getDayAdjustment(key) {
  return dayAdjustments()[String(key)] || null;
}

function dayAdjustmentsInRange(from, to) {
  var map = dayAdjustments();
  var out = [];
  Object.keys(map).forEach(function (k) {
    var d = parseDayKey(k);
    if (!d) return;
    var t = startOfDay(d);
    if (t < startOfDay(new Date(from)) || t > endOfDay(new Date(to))) return;
    out.push({ key: k, data: map[k] });
  });
  return out;
}

/** Что за день сейчас: сколько записей, сколько из них история и заглушки */
function dayEditSummary(key) {
  var d = parseDayKey(key);
  if (!d) return null;
  var from = startOfDay(d), to = endOfDay(d);
  var sales = DB.sales.filter(function (s) { return s.createdAt >= from && s.createdAt <= to && !s.cancelled; });
  var history = sales.filter(function (s) { return s.historyImport; });
  var stubs = sales.filter(isHistoryStub);
  var stats = summarize(from, to);
  return {
    key: key,
    canEdit: canAdjustDay(key),
    sales: sales.length,
    history: history.length,
    stubs: stubs.length,
    own: sales.length - history.length,
    revenue: stats.revenue,
    expenses: stats.expenses,
    profit: stats.profit,
    avgCheck: stats.avgCheck,
    cash: stats.cashTotal,
    qr: stats.qrTotal,
    mixed: stats.mixedTotal,
    count: stats.salesCount,
    adjustment: getDayAdjustment(key)
  };
}

/** Сохраняет корректировку показателей за день (только дни до 22.10.2026) */
function setDayAdjustment(actor, key, patch, opts) {
  opts = opts || {};
  if (!actor || actor.role !== 'dev') return { error: 'Менять показатели может только разработчик' };
  if (!canAdjustDay(key)) return { error: 'Можно править только дни до 22.10.2026' };
  var d = parseDayKey(key);
  if (!d) return { error: 'Некорректная дата' };

  var clean = {};
  ['revenue', 'expenses', 'profit', 'avgCheck', 'cash', 'qr', 'mixed'].forEach(function (f) {
    if (patch && patch[f] !== undefined && patch[f] !== null && patch[f] !== '') {
      var v = Math.round(Number(patch[f]));
      if (!isFinite(v)) return;
      clean[f] = v;
    }
  });
  if (!Object.keys(clean).length && !opts.replace) return { error: 'Нечего сохранять — заполните хотя бы одно поле' };

  var map = dayAdjustments();
  var prev = opts.replace ? {} : (map[key] || {});
  var next = {};
  Object.keys(prev).forEach(function (k) { if (k !== 'at' && k !== 'by') next[k] = prev[k]; });
  Object.keys(clean).forEach(function (k) { next[k] = clean[k]; });
  if (!Object.keys(next).length) {
    if (map[key]) delete map[key];
    DB.settings.updatedAt = Date.now();
    saveDB();
    return { ok: true, key: key, adjustment: null };
  }
  next.at = Date.now();
  next.by = actor.fullName || actor.username || 'dev';
  map[key] = next;

  DB.settings.updatedAt = Date.now();
  saveDB();
  return { ok: true, key: key, adjustment: next };
}

function resetDayAdjustment(actor, key) {
  if (!actor || actor.role !== 'dev') return { error: 'Менять показатели может только разработчик' };
  if (!canAdjustDay(key)) return { error: 'Можно править только дни до 22.10.2026' };
  var map = dayAdjustments();
  if (!map[key]) return { removed: 0 };
  delete map[key];
  DB.settings.updatedAt = Date.now();
  saveDB();
  return { removed: 1 };
}

/**
 * Удаляет продажи за день. Склад не трогает — это прошлые данные.
 * opts.onlyHistory — только записи истории (транзакции + заглушки)
 * opts.onlyStubs   — только сводные заглушки
 */
function deleteDaySales(actor, key, opts) {
  opts = opts || {};
  if (!actor || actor.role !== 'dev') return { error: 'Удалять продажи может только разработчик' };
  if (!canAdjustDay(key)) return { error: 'Можно править только дни до 22.10.2026' };
  var d = parseDayKey(key);
  if (!d) return { error: 'Некорректная дата' };
  var from = startOfDay(d), to = endOfDay(d);

  var target = DB.sales.filter(function (s) {
    if (s.createdAt < from || s.createdAt > to) return false;
    if (opts.onlyStubs) return isHistoryStub(s);
    if (opts.onlyHistory) return !!s.historyImport;
    return true;
  });
  if (!target.length) return { removed: 0, revenue: 0 };

  var ids = {};
  target.forEach(function (s) { ids[s.id] = true; });
  var revenue = target.reduce(function (sum, s) { return sum + (s.total || 0); }, 0);
  DB.sales = DB.sales.filter(function (s) { return !ids[s.id]; });

  if (typeof rebuildHistoryImports === 'function') rebuildHistoryImports();
  DB.settings.updatedAt = Date.now();
  saveDB();
  return { removed: target.length, revenue: revenue };
}

/** Сводная запись без состава — «заглушка» из режима «цифры по дням» */
function isHistoryStub(sale) {
  if (!sale) return false;
  if (!sale.historyImport && !sale.imported) return false;
  return !sale.items || !sale.items.length;
}

/** Сколько заглушек и на какую сумму */
function historyStubSummary() {
  var stubs = DB.sales.filter(isHistoryStub);
  var days = {};
  stubs.forEach(function (s) { days[dayKey(s.createdAt)] = true; });
  return {
    count: stubs.length,
    days: Object.keys(days).length,
    revenue: stubs.reduce(function (sum, s) { return sum + (s.total || 0); }, 0)
  };
}

/** Пересобирает индекс внесённой истории по фактическим записям */
function rebuildHistoryImports() {
  var map = {};
  DB.sales.forEach(function (s) {
    if (!s.historyImport) return;
    var key = dayKey(s.createdAt);
    var rec = map[key] || (map[key] = { revenue: 0, cash: 0, qr: 0, count: 0, at: Date.now() });
    rec.revenue += s.total || 0;
    rec.cash += s.cashAmount || 0;
    rec.qr += s.qrAmount || 0;
    rec.count += 1;
  });
  DB.settings.historyImports = map;
  return map;
}

        for (var i = 0; i < list.length; i++) {
          var len = JSON.stringify(list[i]).length;
          if (len > bestLen) { bestLen = len; bestCol = col; bestIndex = i; }
        }
      });
      if (!bestCol || bestLen < 4000 || changes[bestCol].length <= 1) break;
      changes[bestCol].splice(bestIndex, 1);
      if (!changes[bestCol].length) delete changes[bestCol];
      trimmed = true;
      payloadSize = JSON.stringify({ changes: changes, deletions: deletions }).length;
    }
    return trimmed;
  }

  /* ---------- слияние данных с сервером ---------- */

  function mergeCollections(changes, deletions) {
    var state = ensureSyncState();
    var applied = 0;

    Object.keys(changes || {}).forEach(function (collection) {
      if (SYNC_COLLECTIONS.indexOf(collection) === -1) return;

      if (collection === 'settings') {
        var incomingSettings = (changes[collection] || [])[0];
        if (!incomingSettings) return;
        var localStamp = DB.settings.updatedAt || 0;
        if ((incomingSettings.updatedAt || 0) >= localStamp) {
          var copy = Object.assign({}, incomingSettings);
          delete copy.id;
          DB.settings = Object.assign({}, DB.settings, copy);
          applied++;
        }
        if (!state.versions.settings) state.versions.settings = {};
        state.versions.settings.app = incomingSettings.updatedAt || 0;
        return;
      }

      if (!Array.isArray(DB[collection])) DB[collection] = [];
      var localById = {};
      DB[collection].forEach(function (row, index) {
        if (row && row.id) localById[row.id] = { row: row, index: index };
      });

      (changes[collection] || []).forEach(function (incoming) {
        if (!incoming || !incoming.id) return;
        var stamp = incoming.updatedAt || incoming.createdAt || 0;
        var existing = localById[incoming.id];

        if (!existing) {
          var fresh = Object.assign({}, incoming);
          if (collection === 'users' && !fresh.pass) fresh.pass = null;
          DB[collection].push(fresh);
          applied++;
        } else {
          var localStamp = existing.row.updatedAt || existing.row.createdAt || 0;
          if (stamp > localStamp) {
            var merged = Object.assign({}, existing.row, incoming);
            if (collection === 'users' && existing.row.pass) merged.pass = existing.row.pass;
            DB[collection][existing.index] = merged;
            applied++;
          }
        }
        if (!state.versions[collection]) state.versions[collection] = {};
        state.versions[collection][incoming.id] = Math.max(state.versions[collection][incoming.id] || 0, stamp);
      });
    });

    Object.keys(deletions || {}).forEach(function (collection) {
      if (SYNC_COLLECTIONS.indexOf(collection) === -1) return;
      var ids = deletions[collection] || [];
      if (!ids.length) return;

      if (collection === 'settings') return;

      DB[collection] = (DB[collection] || []).filter(function (row) {
        return ids.indexOf(row.id) === -1;
      });
      applied += ids.length;
      if (DB.session && collection === 'users' && ids.indexOf(DB.session.userId) !== -1) {
        DB.session = null;
      }
    });

    if (applied) saveDB();
    return applied;
  }

  function pruneDeletions(sent) {
    var state = ensureSyncState();
    Object.keys(sent || {}).forEach(function (collection) {
      var ids = sent[collection] || [];
      if (!state.deleted[collection]) return;
      state.deleted[collection] = state.deleted[collection].filter(function (item) {
        return ids.indexOf(item.id) === -1;
      });
      if (!state.deleted[collection].length) delete state.deleted[collection];
    });
  }

  /* ---------- синхронизация ---------- */

  async function syncNow(options) {
    options = options || {};
    if (!isServerConfigured()) {
      if (!options.silent) toast('Сначала подключите сервер в настройках', 'warn');
      return { skipped: true };
    }
    if (!isOnline()) {
      lastError = 'Нет интернета';
      if (!options.silent) toast('Нет интернета — данные сохранятся и отправятся позже', 'warn');
      return { skipped: true, offline: true };
    }
    if (syncInFlight) {
      // уже идёт синхронизация — дожидаемся её и повторяем запрос
      if (options.queued) return { skipped: true, busy: true };
      return new Promise(function (resolve) {
        var tries = 0;
        var wait = setInterval(function () {
          tries++;
          if (!syncInFlight) {
            clearInterval(wait);
            syncNow(Object.assign({}, options, { queued: true, silent: options.silent })).then(resolve);
          } else if (tries > 50) {
            clearInterval(wait);
            resolve({ skipped: true, busy: true });
          }
        }, 100);
      });
    }

    syncInFlight = true;
    try {
      ensureSyncState();
      var cfg = serverConfig();
      var changes = collectChanges();
      var deletions = collectDeletions();
      var trimmed = trimChanges(changes, deletions, 500000);

      var payload = {
        since: cfg.lastSync || 0,
        changes: changes,
        deletions: deletions,
        deviceId: cfg.deviceId
      };

      var result = await apiRequest('/api/sync', { method: 'POST', body: payload });

      // сервер принял — фиксируем версии
      Object.keys(result.accepted || {}).forEach(function (collection) {
        var acceptedIds = result.accepted[collection] || [];
        if (collection === 'settings') return;
        var acceptedRecords = (changes[collection] || []).filter(function (r) {
          return acceptedIds.indexOf(r.id) !== -1;
        });
        markVersions(collection, acceptedRecords);
      });
      pruneDeletions(deletions);

      // отклонённые сервером записи (нет прав) не повторяем каждый раз
      var denied = 0;
      Object.keys(result.rejected || {}).forEach(function (collection) {
        var ids = result.rejected[collection] || [];
        if (!ids.length) return;
        denied += ids.length;
        var rejectedRecords = (changes[collection] || []).filter(function (r) {
          return ids.indexOf(r.id) !== -1;
        });
        markVersions(collection, rejectedRecords);
      });

      var applied = mergeCollections(result.changes, result.deletions);

      saveServerConfig({
        lastSync: result.cursor || Date.now(),
        user: result.user || cfg.user
      });
      ensureSyncState().lastSyncAt = Date.now();
      lastError = null;
      saveDB();

      var summary = {
        pushed: result.written || 0,
        pulled: applied,
        rejected: result.rejected || {},
        denied: denied,
        hasMore: !!result.hasMore
      };

      if (!options.silent) {
        if (denied) toast('Сервер отклонил ' + denied + ' ' + (denied === 1 ? 'запись' : 'записей') + ': недостаточно прав', 'warn', 5200);
        else if (summary.pushed || summary.pulled) toast('Синхронизировано: отправлено ' + summary.pushed + ', получено ' + summary.pulled, 'success');
        else toast('Данные актуальны', 'info');
      }
      window.dispatchEvent(new CustomEvent('pos:sync', { detail: summary }));

      if (result.hasMore) setTimeout(function () { syncNow({ silent: true }); }, 400);
      if (trimmed) setTimeout(function () { syncNow({ silent: true }); }, 1200);
      return summary;
    } catch (err) {
      lastError = err.message;
      if (err.status === 401) {
        saveServerConfig({ token: '' });
        lastError = 'Сессия сервера истекла — войдите заново';
      }
      window.dispatchEvent(new CustomEvent('pos:sync-error', { detail: { message: lastError } }));
      if (!options.silent) toast(lastError, 'error', 4600);
      return { error: lastError };
    } finally {
      syncInFlight = false;
    }
  }

  function scheduleSync(delay) {
    if (!isServerConfigured() || !serverConfig().autoSync) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(function () { syncNow({ silent: true }); }, delay || 2500);
  }

  function startAutoSync() {
    if (autoTimer) clearInterval(autoTimer);
    autoTimer = setInterval(function () {
      if (document.visibilityState === 'visible' && isServerConfigured() && isOnline()) {
        syncNow({ silent: true });
      }
    }, 60000);

    window.addEventListener('online', function () {
      if (isServerConfigured()) {
        toast('Интернет появился — синхронизируем данные', 'info');
        syncNow({ silent: true });
      }
    });
    window.addEventListener('offline', function () {
      if (isServerConfigured()) toast('Нет интернета — работаем офлайн', 'warn');
    });
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && isServerConfigured()) syncNow({ silent: true });
    });
  }

  /* ---------- вход и регистрация через сервер ---------- */

  async function localUserFromServer(serverUser, password) {
    var local = DB.users.find(function (u) { return u.id === serverUser.id; }) ||
      findUserByUsername(serverUser.username);
    var localPass = password ? await hashPassword(password) : null;

    if (local) {
      local.fullName = serverUser.fullName || local.fullName;
      local.username = serverUser.username || local.username;
      local.role = serverUser.role || local.role;
      if (serverUser.pointIds !== undefined) local.pointIds = serverUser.pointIds || [];
      local.pointId = serverUser.pointId !== undefined ? serverUser.pointId : local.pointId;
      if ((!local.pointIds || !local.pointIds.length) && local.pointId) local.pointIds = [local.pointId];
      local.workStart = serverUser.workStart !== undefined ? serverUser.workStart : local.workStart;
      local.workEnd = serverUser.workEnd !== undefined ? serverUser.workEnd : local.workEnd;
      local.id = serverUser.id;
      local.updatedAt = serverUser.updatedAt || Date.now();
      if (localPass) local.pass = localPass;
      return local;
    }

    var created = {
      id: serverUser.id,
      fullName: serverUser.fullName,
      username: serverUser.username,
      pass: localPass,
      role: serverUser.role || 'seller',
      pointIds: Array.isArray(serverUser.pointIds) ? serverUser.pointIds : (serverUser.pointId ? [serverUser.pointId] : []),
      pointId: serverUser.pointId || null,
      workStart: serverUser.workStart || '',
      workEnd: serverUser.workEnd || '',
      createdAt: serverUser.createdAt || Date.now(),
      updatedAt: serverUser.updatedAt || Date.now()
    };
    DB.users.push(created);
    return created;
  }

  async function serverLogin(username, password) {
    var result = await apiRequest('/api/login', {
      method: 'POST',
      auth: false,
      body: { username: username, password: password }
    });
    saveServerConfig({
      token: result.token,
      user: result.user,
      connectedAt: Date.now()
    });

    var local = await localUserFromServer(result.user, password);
    setSession(local.id);
    markVersions('users', [local]);
    saveDB();

    await syncNow({ silent: true });
    return local;
  }

  async function serverRegister(data) {
    var result = await apiRequest('/api/register', {
      method: 'POST',
      auth: false,
      body: { fullName: data.fullName, username: data.username, password: data.password }
    });
    saveServerConfig({
      token: result.token,
      user: result.user,
      connectedAt: Date.now()
    });

    var local = await localUserFromServer(result.user, data.password);
    setSession(local.id);
    markVersions('users', [local]);
    saveDB();

    await syncNow({ silent: true });
    return local;
  }

  function serverLogout() {
    saveServerConfig({ token: '', user: null });
  }

  async function changeServerPassword(currentPassword, newPassword) {
    if (!isServerConfigured()) return { skipped: true };
    return apiRequest('/api/password', {
      method: 'POST',
      body: { currentPassword: currentPassword, newPassword: newPassword }
    });
  }

  async function createServerUser(data) {
    if (!isServerConfigured()) return { skipped: true };
    return apiRequest('/api/users', {
      method: 'POST',
      body: {
        fullName: data.fullName,
        username: data.username,
        password: data.password,
        role: data.role || 'seller',
        pointIds: Array.isArray(data.pointIds) ? data.pointIds : (data.pointId ? [data.pointId] : []),
        pointId: data.pointId || null,
        workStart: data.workStart || '',
        workEnd: data.workEnd || ''
      }
    });
  }

  async function updateServerUser(data) {
    if (!isServerConfigured()) return { skipped: true };
    return apiRequest('/api/users/update', {
      method: 'POST',
      body: {
        userId: data.userId,
        fullName: data.fullName,
        username: data.username,
        role: data.role,
        pointIds: Array.isArray(data.pointIds) ? data.pointIds : (data.pointId ? [data.pointId] : []),
        pointId: data.pointId || null,
        workStart: data.workStart || '',
        workEnd: data.workEnd || '',
        password: data.password || ''
      }
    });
  }

  async function resetUserPassword(userId, newPassword) {
    if (!isServerConfigured()) return { skipped: true };
    return apiRequest('/api/users/password', {
      method: 'POST',
      body: { userId: userId, newPassword: newPassword }
    });
  }

  function syncStatus() {
    var cfg = serverConfig();
    return {
      configured: !!(cfg.url && cfg.token),
      url: cfg.url,
      hasToken: !!cfg.token,
      lastSync: cfg.lastSync || 0,
      lastSyncAt: (DB._sync && DB._sync.lastSyncAt) || 0,
      pending: isServerConfigured() ? pendingCount() : 0,
      online: isOnline(),
      autoSync: cfg.autoSync !== false,
      error: lastError
    };
  }

  /* ---------- глобальные хуки ---------- */

  window.POS_API = {
    serverConfig: serverConfig,
    saveServerConfig: saveServerConfig,
    isServerConfigured: isServerConfigured,
    serverUrl: serverUrl,
    testServer: testServer,
    apiRequest: apiRequest,
    syncNow: syncNow,
    scheduleSync: scheduleSync,
    startAutoSync: startAutoSync,
    syncStatus: syncStatus,
    pendingCount: pendingCount,
    pendingDetails: pendingDetails,
    markVersions: markVersions,
    markDeleted: markDeleted,
    mergeCollections: mergeCollections,
    serverLogin: serverLogin,
    serverRegister: serverRegister,
    serverLogout: serverLogout,
    changeServerPassword: changeServerPassword,
    resetUserPassword: resetUserPassword,
    createServerUser: createServerUser,
    updateServerUser: updateServerUser,
    isOnline: isOnline
  };

  // автосинхронизация после любых изменений данных
  var originalSaveDB = window.saveDB;
  window.saveDB = function () {
    var result = originalSaveDB.apply(this, arguments);
    if (isServerConfigured() && serverConfig().autoSync) scheduleSync(2500);
    return result;
  };

  window.addEventListener('pos:storage-error', function () { /* уже обрабатывается в ui.js */ });
})();

function icon(name, size, className) {
  var p = ICON_PATHS[name] || ICON_PATHS.info;
  var s = size || 18;
  return '<svg class="icon ' + (className || '') + '" width="' + s + '" height="' + s +
    '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' + p + '</svg>';

/* ---------- Тосты ---------- */
function toast(message, type, duration) {
  var wrap = document.querySelector('.toast-wrap');
  if (!wrap) {
    wrap = document.createElement('div');
    wrap.className = 'toast-wrap';
    document.body.appendChild(wrap);
  }
  var typeName = type || 'success';
  var iconName = typeName === 'error' ? 'alert' : (typeName === 'warn' ? 'alert' : (typeName === 'info' ? 'info' : 'checkCircle'));
  var el = document.createElement('div');
  el.className = 'toast ' + typeName;
  el.setAttribute('role', 'status');
  el.innerHTML = icon(iconName, 17) + '<span>' + esc(message) + '</span>';
  while (wrap.children.length >= 4) wrap.removeChild(wrap.firstChild);
  wrap.appendChild(el);
  setTimeout(function () {
    el.classList.add('out');
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 240);
  }, duration || (typeName === 'error' ? 4200 : 3000));
}

/* ---------- Модальные окна ---------- */
var MODAL_STACK = [];

function openModal(opts) {
  opts = opts || {};
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  var sizeClass = opts.size === 'lg' ? 'modal-lg' : (opts.size === 'sm' ? 'modal-sm' : '');
  overlay.innerHTML =
    '<div class="modal ' + sizeClass + '" role="dialog" aria-modal="true">' +
      '<div class="modal-head">' +
        '<div style="min-width:0">' +
          '<h2>' + esc(opts.title || '') + '</h2>' +
          (opts.subtitle ? '<div class="sub">' + esc(opts.subtitle) + '</div>' : '') +
        '</div>' +
        '<button type="button" class="icon-btn" data-close aria-label="Закрыть">' + icon('x', 18) + '</button>' +
      '</div>' +
      '<div class="modal-body">' + (opts.body || '') + '</div>' +
      (opts.footer ? '<div class="modal-foot">' + opts.footer + '</div>' : '<div style="height:20px"></div>') +
    '</div>';
  document.body.appendChild(overlay);
  document.body.classList.add('no-scroll');

  var closed = false;
  function close() {
    if (closed) return;
    closed = true;
    overlay.remove();
    var idx = MODAL_STACK.indexOf(handle);
    if (idx !== -1) MODAL_STACK.splice(idx, 1);
    if (!MODAL_STACK.length) document.body.classList.remove('no-scroll');
    if (typeof opts.onClose === 'function') opts.onClose();
  }
  var handle = { el: overlay, modal: overlay.querySelector('.modal'), close: close };

  overlay.querySelector('[data-close]').addEventListener('click', close);
  overlay.addEventListener('mousedown', function (e) {
    if (e.target === overlay && opts.closeOnBackdrop !== false) close();
  });
  MODAL_STACK.push(handle);
  if (typeof opts.onMount === 'function') opts.onMount(handle.modal, close);
  var autofocus = overlay.querySelector('[autofocus]');
  if (autofocus) setTimeout(function () { autofocus.focus(); }, 60);
  return handle;
}

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && MODAL_STACK.length) {
    MODAL_STACK[MODAL_STACK.length - 1].close();
  }
});

function confirmDialog(opts) {
  opts = opts || {};
  return new Promise(function (resolve) {
    var done = false;
    function finish(value) {
      if (done) return;
      done = true;
      resolve(value);
      modal.close();
    }
    var modal = openModal({
      title: opts.title || 'Подтверждение',
      size: 'sm',
      closeOnBackdrop: true,
      body: '<div style="display:flex;gap:12px;align-items:flex-start">' +
        '<div style="width:40px;height:40px;border-radius:11px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:' +
        (opts.danger ? 'var(--danger-soft);color:var(--danger)' : 'var(--primary-soft);color:var(--primary)') + '">' +
        icon(opts.danger ? 'alert' : 'info', 19) + '</div>' +
        '<div style="font-size:13.5px;line-height:1.55;color:var(--ink-2);padding-top:2px">' + (opts.message || '') + '</div>' +
        '</div>',
      footer: '<button type="button" class="btn btn-secondary" data-cancel>' + esc(opts.cancelText || 'Отмена') + '</button>' +
        '<button type="button" class="btn ' + (opts.danger ? 'btn-danger' : 'btn-primary') + '" data-ok>' + esc(opts.confirmText || 'Подтвердить') + '</button>',
      onClose: function () { if (!done) { done = true; resolve(false); } },
      onMount: function (el) {
        el.querySelector('[data-cancel]').addEventListener('click', function () { finish(false); });
        el.querySelector('[data-ok]').addEventListener('click', function () { finish(true); });
      }
    });
  });
}

function promptDialog(opts) {
  opts = opts || {};
  return new Promise(function (resolve) {
    var done = false;
    function finish(value) {
      if (done) return;
      done = true;
      resolve(value);
      modal.close();
    }
    var modal = openModal({
      title: opts.title || 'Введите значение',
      size: 'sm',
      body: '<div class="field">' +
        (opts.label ? '<label>' + esc(opts.label) + '</label>' : '') +
        (opts.multiline
          ? '<textarea class="input" data-input placeholder="' + esc(opts.placeholder || '') + '">' + esc(opts.value || '') + '</textarea>'
          : '<input class="input" data-input type="' + (opts.type || 'text') + '" value="' + esc(opts.value || '') + '" placeholder="' + esc(opts.placeholder || '') + '" autofocus>') +
        (opts.hint ? '<div class="hint">' + esc(opts.hint) + '</div>' : '') +
        '</div>',
      footer: '<button type="button" class="btn btn-secondary" data-cancel>Отмена</button>' +
        '<button type="button" class="btn btn-primary" data-ok>' + esc(opts.confirmText || 'Сохранить') + '</button>',
      onClose: function () { if (!done) { done = true; resolve(null); } },
      onMount: function (el) {
        var input = el.querySelector('[data-input]');
        el.querySelector('[data-cancel]').addEventListener('click', function () { finish(null); });
        el.querySelector('[data-ok]').addEventListener('click', function () { finish(input.value); });
        input.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' && !opts.multiline) finish(input.value);
        });
      }
    });
  });
}

function openImageViewer(src, title, subtitle) {

/* ---------- Графики ---------- */
function hexToRgba(color, alpha) {
  var value = String(color || '').trim();
  if (value.charAt(0) !== '#') return value;
  var hex = value.slice(1);
  if (hex.length === 3) hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2];
  var int = parseInt(hex, 16);
  return 'rgba(' + ((int >> 16) & 255) + ',' + ((int >> 8) & 255) + ',' + (int & 255) + ',' + alpha + ')';
}

function cssVar(name, fallback) {
  try {
    var value = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    return value || fallback;
  } catch (e) {
    return fallback;
  }
}

var CHART_COLORS = {
  get revenue() { return cssVar('--primary', '#4f46e5'); },
  get expenses() { return cssVar('--danger', '#f04438'); },
  get grid() { return cssVar('--chart-grid', '#eef0f4'); },
  get axis() { return cssVar('--chart-axis', '#98a2b3'); },
  get text() { return cssVar('--chart-text', '#667085'); },
  get strong() { return cssVar('--chart-strong', '#101828'); }
};

function setupCanvas(canvas) {
  var dpr = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  var width = Math.max(200, rect.width || canvas.parentElement.clientWidth || 600);
  var height = Math.max(140, rect.height || 220);
  canvas.width = Math.round(width * dpr);
  canvas.height = Math.round(height * dpr);
  var ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx: ctx, width: width, height: height };
}

function niceMax(value) {
  if (value <= 0) return 1000;
  var exp = Math.floor(Math.log10(value));
  var base = Math.pow(10, exp);
  var normalized = value / base;
  var nice = normalized <= 1 ? 1 : normalized <= 2 ? 2 : normalized <= 2.5 ? 2.5 : normalized <= 5 ? 5 : 10;
  return nice * base;
}

function drawLineChart(canvas, data, opts) {
  if (!canvas) return;
  opts = opts || {};
  function draw(hoverIndex) {
    var s = setupCanvas(canvas);
    var ctx = s.ctx, W = s.width, H = s.height;
    var padL = 54, padR = 14, padT = 16, padB = 30;
    var innerW = W - padL - padR;
    var innerH = H - padT - padB;

    ctx.clearRect(0, 0, W, H);
    if (!data || !data.length) return;

    var maxValue = 0;
    data.forEach(function (d) { maxValue = Math.max(maxValue, d.revenue || 0, d.expenses || 0); });
    var top = niceMax(maxValue || 1000);

    ctx.font = '11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
    ctx.textBaseline = 'middle';

    for (var i = 0; i <= 4; i++) {
      var y = padT + (innerH / 4) * i;
      var value = top - (top / 4) * i;
      ctx.strokeStyle = CHART_COLORS.grid;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(padL, Math.round(y) + 0.5);
      ctx.lineTo(W - padR, Math.round(y) + 0.5);
      ctx.stroke();
      ctx.fillStyle = CHART_COLORS.axis;
      ctx.textAlign = 'right';
      ctx.fillText(fmtCompact(value), padL - 10, y);
    }

    var stepX = data.length > 1 ? innerW / (data.length - 1) : innerW;
    function xAt(i) { return padL + (data.length === 1 ? innerW / 2 : stepX * i); }
    function yAt(v) { return padT + innerH - (innerH * ((v || 0) / top)); }

    ctx.textAlign = 'center';
    data.forEach(function (d, i) {
      if (!d.label) return;
      ctx.fillStyle = CHART_COLORS.axis;
      ctx.fillText(d.label, xAt(i), H - padB / 2 + 2);
    });

    function drawSeries(key, color, fill) {
      var pts = data.map(function (d, i) { return { x: xAt(i), y: yAt(d[key]) }; });
      if (fill) {
        var grad = ctx.createLinearGradient(0, padT, 0, padT + innerH);
        grad.addColorStop(0, hexToRgba(CHART_COLORS.revenue, .20));
        grad.addColorStop(1, hexToRgba(CHART_COLORS.revenue, 0));
        ctx.beginPath();
        ctx.moveTo(pts[0].x, padT + innerH);
        pts.forEach(function (p) { ctx.lineTo(p.x, p.y); });
        ctx.lineTo(pts[pts.length - 1].x, padT + innerH);
        ctx.closePath();
        ctx.fillStyle = grad;
        ctx.fill();
      }
      ctx.beginPath();
      pts.forEach(function (p, i) {
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      });
      ctx.strokeStyle = color;
      ctx.lineWidth = 2.2;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.stroke();
    }

    drawSeries('expenses', CHART_COLORS.expenses, false);
    drawSeries('revenue', CHART_COLORS.revenue, true);

    if (typeof hoverIndex === 'number' && hoverIndex >= 0 && hoverIndex < data.length) {
      var hx = xAt(hoverIndex);
      ctx.strokeStyle = hexToRgba(CHART_COLORS.revenue, .38);
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(hx, padT);
      ctx.lineTo(hx, padT + innerH);
      ctx.stroke();
      ctx.setLineDash([]);
      [{ key: 'revenue', color: CHART_COLORS.revenue }, { key: 'expenses', color: CHART_COLORS.expenses }].forEach(function (serie) {
        var v = data[hoverIndex][serie.key] || 0;
        var py = yAt(v);
        ctx.beginPath();
        ctx.arc(hx, py, 4.2, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.fill();
        ctx.strokeStyle = serie.color;
        ctx.lineWidth = 2.4;
        ctx.stroke();
      });
    }
  }

  canvas.__redraw = function () { draw(canvas.__hoverIndex); };
  draw(-1);

  if (!canvas.__tooltipBound) {
    canvas.__tooltipBound = true;
    var tooltip = document.createElement('div');
    tooltip.style.cssText = 'position:absolute;pointer-events:none;background:#101828;color:#fff;font-size:11.5px;' +
      'padding:7px 10px;border-radius:9px;box-shadow:0 8px 20px rgba(16,24,40,.25);opacity:0;transition:opacity .1s;' +
      'z-index:5;white-space:nowrap;line-height:1.45;transform:translate(-50%,-100%)';
    var wrap = canvas.parentElement;
    if (getComputedStyle(wrap).position === 'static') wrap.style.position = 'relative';
    wrap.appendChild(tooltip);

    canvas.addEventListener('mousemove', function (e) {
      if (!data || !data.length) return;
      var rect = canvas.getBoundingClientRect();
      var padL = 54, padR = 14;
      var innerW = rect.width - padL - padR;
      var x = e.clientX - rect.left;
      var ratio = Math.min(1, Math.max(0, (x - padL) / innerW));
      var idx = data.length === 1 ? 0 : Math.round(ratio * (data.length - 1));
      if (canvas.__hoverIndex === idx) {
        tooltip.style.left = Math.min(rect.width - 60, Math.max(60, e.clientX - rect.left)) + 'px';
        tooltip.style.top = '10px';
        return;
      }
      canvas.__hoverIndex = idx;
      canvas.__redraw();
      var d = data[idx];
      tooltip.innerHTML = '<b>' + esc(d.full || d.label || '') + '</b><br>' +
        '<span style="color:#a5b4fc">●</span> Выручка: ' + fmtMoney(d.revenue) + '<br>' +
        '<span style="color:#fda29b">●</span> Расходы: ' + fmtMoney(d.expenses);
      tooltip.style.left = Math.min(rect.width - 70, Math.max(70, x)) + 'px';
      tooltip.style.top = '8px';
      tooltip.style.opacity = '1';
    });
    canvas.addEventListener('mouseleave', function () {
      tooltip.style.opacity = '0';
      canvas.__hoverIndex = -1;
      canvas.__redraw();
    });
  }
}

function drawDonut(canvas, segments, centerLabel, centerValue) {
  if (!canvas) return;
  var rect = canvas.getBoundingClientRect();
  var side = Math.max(120, Math.round(rect.width || canvas.width || 132));
  var dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(side * dpr);
  canvas.height = Math.round(side * dpr);
  if (!canvas.style.height) canvas.style.height = side + 'px';
  var ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  var W = side, H = side;
  ctx.clearRect(0, 0, W, H);
  var size = Math.min(W, H);
  var cx = W / 2, cy = H / 2;
  var outer = size / 2 - 6;
  var inner = outer * 0.68;
  var total = segments.reduce(function (sum, x) { return sum + (x.value || 0); }, 0);

  if (total <= 0) {
    ctx.beginPath();
    ctx.arc(cx, cy, (outer + inner) / 2, 0, Math.PI * 2);
    ctx.lineWidth = outer - inner;
    ctx.strokeStyle = CHART_COLORS.grid;
    ctx.stroke();
  } else {
    var angle = -Math.PI / 2;
    segments.forEach(function (seg) {
      if (!seg.value) return;
      var sweep = (seg.value / total) * Math.PI * 2;
      ctx.beginPath();
      ctx.arc(cx, cy, (outer + inner) / 2, angle + 0.02, angle + sweep - 0.02);
      ctx.lineWidth = outer - inner;
      ctx.strokeStyle = seg.color;
      ctx.lineCap = 'round';
      ctx.stroke();
      angle += sweep;
    });
  }

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = CHART_COLORS.text;
  ctx.font = '11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  ctx.fillText(centerLabel || 'Всего', cx, cy - 11);

function periodToolbarHtml(sel) {
  var s = normalizePeriodSel(sel);
  var today = todayKey();
  var html = '<div class="date-bar" id="periodDateBar">';

  if (s.period === 'today' || s.period === 'week') {
    var monthStart = s.date.slice(0, 8) + '01';
    html += '<div class="date-nav">' +
      '<button type="button" class="icon-btn" data-step="-1" title="Предыдущий день">' + icon('chevronLeft', 15) + '</button>' +
      '<label class="date-field"><span>Дата</span><input class="input" type="date" data-date-input value="' + s.date + '" max="' + today + '"></label>' +
      '<button type="button" class="icon-btn" data-step="1" title="Следующий день"' + (s.date >= today ? ' disabled' : '') + '>' + icon('chevronRight', 15) + '</button>' +
      '</div>' +
      '<div class="date-quick">' +
        '<button type="button" class="chip' + (s.date === today ? ' active' : '') + '" data-quick="today">' + (s.period === 'week' ? 'До сегодня' : 'Сегодня') + '</button>' +
        '<button type="button" class="chip" data-quick="yesterday">' + (s.period === 'week' ? 'До вчера' : 'Вчера') + '</button>' +
        (s.period === 'week' ? '<span class="muted tiny">7 дней по выбранную дату</span>' : '') +
      '</div>' +
      '<span class="date-result">' + esc(rangeSubLabel(s, startOfDay(parseDayKey(s.date) || new Date()), endOfDay(parseDayKey(s.date) || new Date()))) + '</span>';
  } else if (s.period === 'month') {
    html += '<div class="date-nav">' +
      '<button type="button" class="icon-btn" data-month-step="-1" title="Предыдущий месяц">' + icon('chevronLeft', 15) + '</button>' +
      '<label class="date-field"><span>Месяц</span><input class="input" type="month" data-month-input value="' + s.month + '" max="' + today.slice(0, 7) + '"></label>' +
      '<button type="button" class="icon-btn" data-month-step="1" title="Следующий месяц">' + icon('chevronRight', 15) + '</button>' +
      '</div>' +
      '<div class="date-quick">' +
        '<button type="button" class="chip' + (s.month === today.slice(0, 7) ? ' active' : '') + '" data-month-quick="current">Этот месяц</button>' +
      '</div>' +
      '<span class="date-result">' + esc(rangeSubLabel(s, resolveRange(s).from, resolveRange(s).to)) + '</span>';
  } else {
    html += '<label class="date-field"><span>С</span><input class="input" type="date" data-from-input value="' + s.from + '" max="' + today + '"></label>' +
      '<label class="date-field"><span>По</span><input class="input" type="date" data-to-input value="' + s.to + '" max="' + today + '"></label>' +
      '<div class="date-quick">' +
        '<button type="button" class="chip" data-range-quick="month">Этот месяц</button>' +
        '<button type="button" class="chip" data-range-quick="prev-month">Прошлый месяц</button>' +
        '<button type="button" class="chip" data-range-quick="week">7 дней</button>' +
      '</div>' +
      '<span class="date-result">' + esc(rangeSubLabel(s, resolveRange(s).from, resolveRange(s).to)) + '</span>';
  }

  html += '</div>';
  return html;
}

function bindPeriodToolbar(root, state, onChange) {
  var bar = root.querySelector('#periodDateBar');
  if (!bar) return;
  var today = todayKey();

  function commit() {
    var s = normalizePeriodSel(state);
    state.period = s.period; state.date = s.date; state.month = s.month; state.from = s.from; state.to = s.to;
    onChange();
  }

  bar.querySelectorAll('[data-step]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var d = addDays(parseDayKey(state.date) || new Date(), Number(btn.getAttribute('data-step')));
      if (startOfDay(d) > startOfDay(new Date())) return;
      state.date = dayKey(d);
      commit();
    });
  });
  var dateInput = bar.querySelector('[data-date-input]');
  if (dateInput) dateInput.addEventListener('change', function () {
    if (!dateInput.value) return;
    state.date = dateInput.value < today ? dateInput.value : today;
    commit();
  });

  bar.querySelectorAll('[data-quick]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var q = btn.getAttribute('data-quick');
      state.date = q === 'yesterday' ? dayKey(addDays(new Date(), -1)) : today;
      commit();
    });
  });

  var monthInput = bar.querySelector('[data-month-input]');
  if (monthInput) monthInput.addEventListener('change', function () {
    if (!monthInput.value) return;
    state.month = monthInput.value > today.slice(0, 7) ? today.slice(0, 7) : monthInput.value;
    commit();
  });
  bar.querySelectorAll('[data-month-step]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var mk = parseMonthKey(state.month) || { year: new Date().getFullYear(), month: new Date().getMonth() + 1 };
      var total = mk.year * 12 + (mk.month - 1) + Number(btn.getAttribute('data-month-step'));
      var next = { year: Math.floor(total / 12), month: (total % 12) + 1 };
      var key = next.year + '-' + pad2(next.month);
      if (key > today.slice(0, 7)) return;
      state.month = key;
      commit();
    });
  });
  bar.querySelectorAll('[data-month-quick]').forEach(function (btn) {
    btn.addEventListener('click', function () { state.month = today.slice(0, 7); commit(); });
  });

  var fromInput = bar.querySelector('[data-from-input]');
  var toInput = bar.querySelector('[data-to-input]');
  if (fromInput) fromInput.addEventListener('change', function () {
    if (!fromInput.value) return;
    state.from = fromInput.value;
    if (state.from > state.to) state.to = state.from;
    commit();
  });
  if (toInput) toInput.addEventListener('change', function () {
    if (!toInput.value) return;
    state.to = toInput.value;
    if (state.to < state.from) state.from = state.to;
    commit();
  });
  bar.querySelectorAll('[data-range-quick]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var q = btn.getAttribute('data-range-quick');
      var now = new Date();
      if (q === 'month') {
        state.from = dayKey(new Date(now.getFullYear(), now.getMonth(), 1));
        state.to = today;
      } else if (q === 'prev-month') {
        state.from = dayKey(new Date(now.getFullYear(), now.getMonth() - 1, 1));
        state.to = dayKey(new Date(now.getFullYear(), now.getMonth(), 0));
      } else {
        state.from = dayKey(addDays(now, -6));
        state.to = today;
      }
      commit();
    });
  });
}

                '<div class="field">' +
                  '<label for="regPass2">Подтверждение пароля</label>' +
                  '<div class="pw-wrap">' +
                    '<input class="input" id="regPass2" name="password2" type="password" autocomplete="new-password" placeholder="Повторите пароль">' +
                    '<button type="button" class="pw-toggle" data-pw-toggle="regPass2" aria-label="Показать пароль">' + icon('eye', 18) + '</button>' +
                  '</div>' +
                  '<div class="hint" id="matchHint"></div>' +
                  '<div class="field-error hide" data-error-for="password2">' + icon('alert', 13) + '<span></span></div>' +
                '</div>' +
                '<label class="check">' +
                  '<input type="checkbox" id="regTerms" name="terms">' +
                  '<span>Я принимаю <button type="button" class="link-btn" id="termsLink">условия использования</button> и политику обработки данных</span>' +
                '</label>' +
                '<button type="submit" class="btn btn-primary btn-lg btn-block" id="regBtn">Создать аккаунт ' + icon('chevronRight', 17) + '</button>' +
              '</form>' +
              '<div class="auth-switch">Уже есть аккаунт? <button type="button" id="goLogin">Войти</button></div>' +
              serverStripHtml() +
              '<div class="auth-foot">POS Контроль v' + APP_CONFIG.version + ' · Офлайн-режим и облако</div>' +
              (!STORAGE_AVAILABLE
                ? '<div class="form-note warn" style="margin-top:12px">' + icon('alert', 15) + '<span><b>Режим предпросмотра:</b> локальное хранилище недоступно, данные не сохранятся.</span></div>'
                : '') +
            '</div>' +
          '</main>' +
        '</div>';

      bindPasswordToggle(root);

      var authThemeBtn2 = root.querySelector('#authTheme');
      if (authThemeBtn2) authThemeBtn2.addEventListener('click', function () {
        var theme = toggleTheme();
        authThemeBtn2.innerHTML = icon(theme === 'dark' ? 'sun' : 'moon', 17);
      });

      var form = root.querySelector('#regForm');
      var errorBox = root.querySelector('#regError');
      var btn = root.querySelector('#regBtn');
      var userInput = root.querySelector('#regUser');
      var statusEl = root.querySelector('#userStatus');
      var passInput = root.querySelector('#regPass');
      var passHint = root.querySelector('#passHint');
      var pass2Input = root.querySelector('#regPass2');
      var matchHint = root.querySelector('#matchHint');
      var checkTimer = null;

      bindServerStrip(root, ctx, function () { ctx.rerender(); });
      root.querySelector('#goLogin').addEventListener('click', function () { ctx.navigate('login'); });

      root.querySelector('#termsLink').addEventListener('click', function () {
        openModal({
          title: 'Условия использования',
          body: '<div style="font-size:13px;line-height:1.65;color:var(--ink-2);display:flex;flex-direction:column;gap:10px">' +
            '<p>1. Приложение предназначено для внутреннего учёта продаж, расходов, остатков и рабочего времени сотрудников.</p>' +
            '<p>2. Пользователь обязуется не передавать свои учётные данные третьим лицам. Все действия под аккаунтом считаются совершёнными владельцем аккаунта.</p>' +
            '<p>3. Данные текущей версии хранятся локально на устройстве пользователя. Резервное копирование — ответственность владельца бизнеса.</p>' +
            '<p>4. Фотографии чеков и детальные данные расходов автоматически удаляются через 7 дней, статистика сохраняется.</p>' +
            '<p>5. Администратор вправе удалять пользователей и данные; транзакции при удалении пользователя сохраняются.</p>' +
            '</div>',
          footer: '<button type="button" class="btn btn-primary" data-ok>Понятно</button>',
          onMount: function (el, close) { el.querySelector('[data-ok]').addEventListener('click', close); }
        });
      });

      function showError(message) {
        errorBox.classList.remove('hide');
        errorBox.querySelector('span').textContent = message;
        errorBox.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
      function hideError() { errorBox.classList.add('hide'); }

      function fieldError(name, message) {
        var box = root.querySelector('[data-error-for="' + name + '"]');
        if (!box) return;
        if (!message) { box.classList.add('hide'); return; }
        box.classList.remove('hide');
        box.querySelector('span').textContent = message;
      }

      function validateUsername(value) {
        if (!value) return 'Укажите имя пользователя';
        if (!/^[A-Za-zА-Яа-яЁё0-9_\-\.]{2,32}$/.test(value)) return '2–32 символа: буквы, цифры, _ - .';
        if (findUserByUsername(value)) return 'Это имя уже занято';
        return '';
      }

      function refreshUserStatus() {
        var value = userInput.value.trim();
        if (!value) { statusEl.style.display = 'none'; fieldError('username', ''); return; }
        var err = validateUsername(value);
        statusEl.style.display = 'inline-flex';
        if (err) {
          statusEl.innerHTML = icon('x', 15);
          statusEl.style.color = 'var(--danger)';
          fieldError('username', err);
          userInput.classList.add('invalid');
        } else {
          statusEl.innerHTML = icon('check', 15);
          statusEl.style.color = 'var(--success)';
          fieldError('username', '');
          userInput.classList.remove('invalid');
        }
      }

      userInput.addEventListener('input', function () {
        hideError();
        clearTimeout(checkTimer);
        statusEl.style.display = 'none';
        fieldError('username', '');
        userInput.classList.remove('invalid');
        checkTimer = setTimeout(refreshUserStatus, 280);
      });

      passInput.addEventListener('input', function () {
        hideError();
        var value = passInput.value;
        if (!value) {
          passHint.textContent = 'Минимум 6 символов';
          passHint.style.color = '';
        } else if (value.length < 6) {
          passHint.textContent = 'Слишком короткий пароль — нужно ещё ' + (6 - value.length) + ' ' + plural(6 - value.length, 'символ', 'символа', 'символов');
          passHint.style.color = 'var(--muted)';
        } else {
          passHint.textContent = 'Пароль достаточно надёжный';
          passHint.style.color = 'var(--success)';
        }
        updateMatch();
      });

      function updateMatch() {
        if (!pass2Input.value) { matchHint.textContent = ''; fieldError('password2', ''); return; }
        if (pass2Input.value === passInput.value) {
          matchHint.textContent = '';
          fieldError('password2', '');
        } else {
          matchHint.textContent = '';
          fieldError('password2', 'Пароли не совпадают');
        }
      }
      pass2Input.addEventListener('input', function () { hideError(); updateMatch(); });
      root.querySelector('#regName').addEventListener('input', hideError);
      root.querySelector('#regTerms').addEventListener('change', hideError);

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        hideError();
        var fullName = form.fullName.value.trim();
        var username = form.username.value.trim();
        var password = form.password.value;
        var password2 = form.password2.value;
        var terms = form.terms.checked;

        if (!fullName) { fieldError('fullName', 'Укажите полное имя'); form.fullName.focus(); return; }
        fieldError('fullName', '');
        var userErr = validateUsername(username);
        if (userErr) { fieldError('username', userErr); userInput.focus(); return; }
        if (password.length < 6) {
          showError('Пароль должен содержать минимум 6 символов');
          passInput.focus();
          return;
        }
        if (password !== password2) {
          fieldError('password2', 'Пароли не совпадают');
          pass2Input.focus();
          return;
        }
        if (!terms) { showError('Необходимо принять условия использования'); return; }

        setButtonBusy(btn, true, 'Создаём аккаунт…');
        var api = window.POS_API;
        var serverUrl = api ? api.serverConfig().url : '';

        if (serverUrl) {
          try {
            var serverUser = await api.serverRegister({ fullName: fullName, username: username, password: password });
            toast('Аккаунт создан на сервере. Ваша роль: ' + roleLabel(serverUser.role), 'success', 4600);
            ctx.navigate(canAccess(serverUser, 'dashboard') ? 'dashboard' : 'cash');
            return;
          } catch (serverErr) {
            if (!serverErr.status) {
              // сервер недоступен — работаем локально
              try {
                var localOnly = await createUser({ fullName: fullName, username: username, password: password }, { autoRole: true });
                setSession(localOnly.id);
                toast('Сервер недоступен — аккаунт создан локально, данные отправятся позже', 'warn', 5200);
                ctx.navigate(canAccess(localOnly, 'dashboard') ? 'dashboard' : 'cash');
                return;
              } catch (localErr) {
                showError(localErr.message);
                setButtonBusy(btn, false);
                return;
              }
            }
            showError(serverErr.message);
            setButtonBusy(btn, false);
            return;
          }
        }

        try {
          var user = await createUser({ fullName: fullName, username: username, password: password }, { autoRole: true });
          setSession(user.id);
          toast('Аккаунт создан. Ваша роль: ' + roleLabel(user.role), 'success', 4200);
          ctx.navigate(canAccess(user, 'dashboard') ? 'dashboard' : 'cash');
        } catch (err) {
          showError(err.message);
          setButtonBusy(btn, false);
        }
      });
    }
  };
})();

</script>
  <script>
/* ============================================================
   POS Контроль — панель управления (дашборд)
