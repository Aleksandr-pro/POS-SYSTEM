      /* ---------- администратор / разработчик ---------- */
      var points = DB.points;
      if (state.pointId !== 'all' && !getPoint(state.pointId)) state.pointId = 'all';
      var entries = DB.time.filter(function (t) { return t.date === state.date; });
      var filteredUsers = DB.users.filter(function (u) {
        if (state.pointId === 'all') return true;
        return userPointIds(u).indexOf(state.pointId) !== -1;
      }).sort(function (a, b) {
        var order = { seller: 0, dev: 1, admin: 2 };
        return (order[a.role] - order[b.role]) || (a.fullName || '').localeCompare(b.fullName || '', 'ru');
      });

      var isToday = state.date === today;
      var working = entries.filter(function (t) { return t.arriveAt && !t.leaveAt && isToday; }).length;
      var arrived = entries.filter(function (t) { return t.arriveAt; }).length;
      var completed = entries.filter(function (t) { return t.arriveAt && t.leaveAt; });
      var avg = completed.length ? completed.reduce(function (s, t) { return s + (t.leaveAt - t.arriveAt); }, 0) / completed.length : 0;
      var maxDuration = completed.reduce(function (m, t) { return Math.max(m, t.leaveAt - t.arriveAt); }, 0);

      root.innerHTML =
        '<div class="page">' +
          '<div class="page-head">' +
            '<div><h1>Рабочее время</h1><div class="sub">Табель сотрудников · ' + (isToday ? 'сегодня' : fmtDateHuman(new Date(state.date + 'T12:00:00').getTime())) + '</div></div>' +
            '<div class="page-actions">' +
              '<input type="date" class="input" id="teamDate" max="' + today + '" value="' + state.date + '" style="width:auto;height:40px">' +
              (points.length > 1
                ? '<select class="select" id="teamPoint" style="width:auto;height:40px;min-width:150px"><option value="all">Все точки</option>' +
                    points.map(function (p) { return '<option value="' + p.id + '"' + (state.pointId === p.id ? ' selected' : '') + '>' + esc(p.name) + '</option>'; }).join('') +
                  '</select>'
                : '') +
            '</div>' +
          '</div>' +

          '<div class="grid-4">' +
            '<div class="card stat-card"><div class="stat-top"><div class="stat-icon green">' + icon('arrive', 20) + '</div></div>' +
              '<div><div class="stat-label">' + (isToday ? 'На работе сейчас' : 'Открытые смены') + '</div><div class="stat-value">' + working + '</div></div>' +
              '<div class="stat-foot">' + (isToday ? 'сотрудников в смене' : 'без отметки ухода') + '</div></div>' +
            '<div class="card stat-card"><div class="stat-top"><div class="stat-icon indigo">' + icon('users', 20) + '</div></div>' +
              '<div><div class="stat-label">Пришли за день</div><div class="stat-value">' + arrived + '</div></div>' +
              '<div class="stat-foot">из ' + filteredUsers.length + ' сотрудников</div></div>' +
            '<div class="card stat-card"><div class="stat-top"><div class="stat-icon blue">' + icon('clock', 20) + '</div></div>' +
              '<div><div class="stat-label">Среднее время</div><div class="stat-value" style="font-size:21px">' + (avg ? fmtDuration(avg) : '—') + '</div></div>' +
              '<div class="stat-foot">по закрытым сменам</div></div>' +
            '<div class="card stat-card"><div class="stat-top"><div class="stat-icon amber">' + icon('history', 20) + '</div></div>' +
              '<div><div class="stat-label">Максимальная смена</div><div class="stat-value" style="font-size:21px">' + (maxDuration ? fmtDuration(maxDuration) : '—') + '</div></div>' +
              '<div class="stat-foot">лучший результат дня</div></div>' +
          '</div>' +

          '<div class="card section-gap" style="min-width:0">' +
            '<div class="card-head"><div><h3>Табель за ' + (isToday ? 'сегодня' : fmtDate(state.date + 'T12:00:00')) + '</h3>' +
              '<div class="sub">Геометки прихода и ухода сохраняются автоматически</div></div>' +
              '<button type="button" class="btn btn-sm btn-secondary" id="timeRefresh">' + icon('refresh', 14) + ' Обновить</button></div>' +
            '<div class="card-body" style="padding-top:10px">' +
              '<div class="table-wrap"><table class="tbl"><thead><tr>' +
                '<th>Сотрудник</th><th>Точка</th><th>Приход</th><th>Уход</th><th>Длительность</th><th>Сверка склада</th><th>Статус</th>' +
              '</tr></thead><tbody>' +
                (filteredUsers.length
                  ? filteredUsers.map(function (u) {
                      var t = entries.find(function (x) { return x.userId === u.id; });
                      var st = statusInfo(t, state.date);
                      var dur = t && t.arriveAt ? ((t.leaveAt || Date.now()) - t.arriveAt) : 0;
                      var chk = worstStockCheck(u.id, state.date);
                      var chkHtml = chk
                        ? '<button type="button" class="btn btn-sm ' + (chk.result === 'match' ? 'btn-secondary' : 'btn-danger-soft') + '" data-check-view="' + chk.id + '">' +
                            (chk.result === 'match' ? '✓ Сходятся' : '⚠ Не сходятся') + '</button>'
                        : '<span class="muted small">—</span>';
                      return '<tr>' +
                        '<td><div class="user-cell">' + avatarHtml(u.fullName, 'avatar-sm') +
                          '<div style="min-width:0"><div class="nm truncate">' + esc(u.fullName) + '</div><div class="un">' + roleLabel(u.role) + '</div></div></div></td>' +
                        '<td><span class="small">' + (userPointIds(u).length ? userPointIds(u).map(function (id) { return esc(pointName(id, 'Удалена')); }).join(' · ') : '<span class="muted">—</span>') + '</span></td>' +
                        '<td><div class="cell-main">' + (t && t.arriveAt ? fmtTime(t.arriveAt) : '—') + '</div><div class="cell-sub">' + (t && t.arriveAt ? geoInline(t.arriveGeo) : '') + '</div></td>' +
                        '<td><div class="cell-main">' + (t && t.leaveAt ? fmtTime(t.leaveAt) : '—') + '</div><div class="cell-sub">' + (t && t.leaveAt
                          ? (t.autoClosed ? '<span class="tiny muted">закрыто автоматически</span>' : geoInline(t.leaveGeo))
                          : '') + '</div></td>' +
                        '<td>' + (dur ? '<span class="badge badge-admin">' + fmtDuration(dur) + '</span>' : '<span class="muted">—</span>') + '</td>' +
                        '<td>' + chkHtml + '</td>' +
                        '<td>' + badge(st.label, st.cls, !!st.dot) + '</td>' +
                      '</tr>';
                    }).join('')
                  : '<tr><td colspan="7" class="tbl-empty">Нет сотрудников по выбранному фильтру</td></tr>') +
              '</tbody></table></div>' +
              '<div class="form-note info" style="margin-top:14px">' + icon('pin', 15) +
                '<span>Геометки отображаются у сотрудников, разрешивших доступ к геолокации. Нажмите «геометка», чтобы открыть точку на карте. Если уход не отмечен, смена закрывается автоматически в 02:00.</span></div>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<button type="button" class="fab" id="timeTeamExport">' + icon('download', 17) + ' Экспорт<span class="kbd">XLSX</span></button>';

      root.querySelectorAll('[data-check-view]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var chk = stockChecksList().find(function (c) { return c.id === btn.getAttribute('data-check-view'); });
          if (chk) openStockCheckDetail(chk);
        });
      });

      var dateInput = root.querySelector('#teamDate');
      dateInput.addEventListener('change', function () {
        state.date = dateInput.value || today;
        ctx.rerender();
      });
      var pointSelect = root.querySelector('#teamPoint');
      if (pointSelect) pointSelect.addEventListener('change', function () { state.pointId = pointSelect.value; ctx.rerender(); });
      root.querySelector('#timeRefresh').addEventListener('click', function () { ctx.rerender(); });

      root.querySelector('#timeTeamExport').addEventListener('click', function () {
        var rows = [['Дата', 'Сотрудник', 'Роль', 'Точка', 'Приход', 'Широта', 'Долгота', 'Уход', 'Широта', 'Долгота', 'Отработано', 'Сверка склада', 'Статус']];
        var from = startOfDay(addDays(Date.now(), -29));
        DB.time.filter(function (t) { return t.arriveAt >= from; }).sort(function (a, b) { return (b.arriveAt || 0) - (a.arriveAt || 0); }).forEach(function (t) {
          var u = getUser(t.userId);
          if (state.pointId !== 'all' && (!u || userPointIds(u).indexOf(state.pointId) === -1)) return;
          var st = statusInfo(t, t.date);
          rows.push([
            fmtDate(t.arriveAt), u ? u.fullName : 'Удалённый пользователь', u ? roleLabel(u.role) : '',
            u && userPointIds(u).length ? userPointIds(u).map(function (id) { return pointName(id); }).join(', ') : '—',
            fmtTime(t.arriveAt), t.arriveGeo ? t.arriveGeo.lat : '', t.arriveGeo ? t.arriveGeo.lng : '',
            t.leaveAt ? fmtTime(t.leaveAt) : '', t.leaveGeo ? t.leaveGeo.lat : '', t.leaveGeo ? t.leaveGeo.lng : '',
            t.leaveAt ? fmtDuration(t.leaveAt - t.arriveAt) : '—',
            (function () {
              var chk = worstStockCheck(t.userId, t.date);
              return chk ? (chk.result === 'match' ? 'Данные сходятся' : 'Данные не сходятся') : 'нет сверки';
            })(),
            st.label
          ]);
        });
        var summary = [['Показатель', 'Значение'], ['Дата', fmtDate(state.date)], ['Пришли', arrived], ['Закрыли смену', completed.length], ['Среднее время', avg ? fmtDuration(avg) : '—']];
        PosXlsx.downloadXlsx('tabel_' + dayKey(Date.now()) + '.xlsx', [
          { name: 'Сводка', rows: summary },
          { name: 'Табель 30 дней', rows: rows }
        ]);
        toast('Табель выгружен в Excel', 'success');
      });
    }
  };
})();

</script>
  <script>
/* ============================================================
   POS Контроль — аналитика: KPI, графики, топы, отчёты
   ============================================================ */
(function () {
  'use strict';
  var PAGES = window.PAGES = window.PAGES || {};
  var state = { period: 'week', pointId: 'all', date: null, month: null, from: null, to: null };

  function barRows(list, valueKey, nameKey, colorClass) {
    if (!list.length) return '<div class="muted small">Нет данных за период</div>';
    var max = Math.max.apply(null, list.map(function (x) { return x[valueKey] || 0; }));
    return '<div class="bar-list">' + list.map(function (x) {
      var pct = max ? Math.max(2, Math.round((x[valueKey] / max) * 100)) : 0;
      return '<div class="bar-row"><div class="line"><span class="nm" title="' + esc(x[nameKey]) + '">' + esc(x[nameKey]) + '</span>' +
        '<span class="val">' + fmtMoney(x[valueKey]) + '</span></div>' +
        '<div class="bar-track"><div class="bar-fill ' + (colorClass || '') + '" style="width:' + pct + '%"></div></div></div>';
    }).join('') + '</div>';
  }

  function groupExpenses(list) {
    var map = {};
    list.forEach(function (e) {
      var key = e.pruned ? 'Прочее (детали удалены)' : (e.reason || 'Без указания');
      if (!map[key]) map[key] = { name: key, amount: 0, count: 0 };
      map[key].amount += e.amount || 0;
      map[key].count++;
    });
    var arr = Object.keys(map).map(function (k) { return map[k]; });
    arr.sort(function (a, b) { return b.amount - a.amount; });
    return arr;
  }

  function qtyBarRows(list, nameKey, valueKey) {
    if (!list.length) return '<div class="muted small">Поставок за период нет</div>';
    var max = Math.max.apply(null, list.map(function (x) { return x[valueKey] || 0; }));
    return '<div class="bar-list">' + list.map(function (x) {
      var pct = max ? Math.max(2, Math.round((x[valueKey] / max) * 100)) : 0;
      return '<div class="bar-row"><div class="line"><span class="nm" title="' + esc(x[nameKey]) + '">' + esc(x[nameKey]) + '</span>' +
        '<span class="val">' + fmtNumber(x[valueKey]) + ' шт' + (x.cost ? ' · ' + fmtCompact(x.cost) : '') + '</span></div>' +
        '<div class="bar-track"><div class="bar-fill indigo" style="width:' + pct + '%"></div></div></div>';
    }).join('') + '</div>';
  }

  function sellerStats(sales) {
    var map = {};
    sales.forEach(function (s) {
      if (!map[s.userId]) map[s.userId] = { name: s.userName || userName(s.userId), count: 0, total: 0, items: 0 };
      map[s.userId].count++;
      map[s.userId].total += s.total || 0;
      map[s.userId].items += (s.items || []).reduce(function (n, it) { return n + it.qty; }, 0);
    });
    return Object.keys(map).map(function (k) { return map[k]; }).sort(function (a, b) { return b.total - a.total; });
  }

  PAGES.analytics = {
    render: function (root, ctx) {
      var user = ctx.user;
      var isSeller = user.role === 'seller';
      var allowedPoints = isSeller ? userPoints(user) : DB.points;
      if (isSeller) {
        var active = activePointId(user);
        var allowedIds = allowedPoints.map(function (p) { return p.id; });
        if (allowedIds.length && (state.pointId === 'all' || allowedIds.indexOf(state.pointId) === -1)) {
          state.pointId = active || allowedIds[0];
        }
      } else if (state.pointId !== 'all' && !getPoint(state.pointId)) {
        state.pointId = 'all';
      }
      var sel = normalizePeriodSel(state);
      state.date = sel.date; state.month = sel.month; state.from = sel.from; state.to = sel.to;
      var range = resolveRange(sel);
      var opts = { pointId: state.pointId !== 'all' ? state.pointId : null };
      var stats = summarize(range.from, range.to, opts);
      var supplies = suppliesBetween(range.from, range.to, opts);
      var supplySum = supplyTotals(supplies);
      var suppliedTop = topSuppliedProducts(supplies, 8);
      var prev = summarize(range.prevFrom, range.prevTo, opts);
      var margin = stats.revenue ? (stats.profit / stats.revenue) * 100 : 0;
      var points = allowedPoints;
      var top = topProducts(stats.sales);
      var byPoint = salesByPointList(stats.sales);
      var bySeller = sellerStats(stats.sales);
      var expGroups = groupExpenses(stats.expenseList);
      var daysWithSales = {};

      stats.sales.forEach(function (s) { daysWithSales[dayKey(s.createdAt)] = true; });

      function deltaBadge(cur, prevVal, invert) {
        var pct = deltaPct(cur, prevVal);
        if (!isFinite(pct) || Math.abs(pct) < 0.05) return '<span class="delta flat">0%</span>';
        var good = invert ? pct < 0 : pct > 0;
        return '<span class="delta ' + (good ? 'up' : 'down') + '">' + (pct > 0 ? icon('arrowUp', 12) : icon('arrowDown', 12)) +
          Math.abs(pct).toFixed(Math.abs(pct) >= 100 ? 0 : 1) + '%</span>';
      }

      root.innerHTML =
        '<div class="page">' +
          '<div class="page-head">' +
            '<div><h1>Аналитика и отчёты</h1><div class="sub">' + range.sub + ' · ' + (state.pointId === 'all' ? 'все точки' : esc(pointName(state.pointId))) + '</div></div>' +
            '<div class="page-actions">' +
              '<div class="segmented" id="anPeriod">' +
                '<button type="button" data-period="today" class="' + (state.period === 'today' ? 'active' : '') + '">Сегодня</button>' +
                '<button type="button" data-period="week" class="' + (state.period === 'week' ? 'active' : '') + '">Неделя</button>' +
                '<button type="button" data-period="month" class="' + (state.period === 'month' ? 'active' : '') + '">Месяц</button>' +
                '<button type="button" data-period="period" class="' + (state.period === 'period' ? 'active' : '') + '">Период</button>' +
              '</div>' +
              (points.length > 1
                ? '<select class="select" id="anPoint" style="width:auto;height:38px;min-width:150px">' +
                    (isSeller ? '' : '<option value="all">Все точки</option>') +
                    points.map(function (p) { return '<option value="' + p.id + '"' + (state.pointId === p.id ? ' selected' : '') + '>' + esc(p.name) + '</option>'; }).join('') +
                  '</select>'
                : '') +
            '</div>' +
          '</div>' +

          periodToolbarHtml(state) +

          '<div class="grid-4">' +
            '<div class="card stat-card"><div class="stat-top"><div class="stat-icon indigo">' + icon('cash', 20) + '</div>' + deltaBadge(stats.revenue, prev.revenue) + '</div>' +
              '<div><div class="stat-label">Выручка</div><div class="stat-value">' + fmtMoney(stats.revenue) + '</div></div>' +
              '<div class="stat-foot">' + stats.salesCount + ' продаж · ' + fmtNumber(stats.itemsSold) + ' товаров</div></div>' +
            '<div class="card stat-card"><div class="stat-top"><div class="stat-icon red">' + icon('wallet', 20) + '</div>' + deltaBadge(stats.expenses, prev.expenses, true) + '</div>' +
              '<div><div class="stat-label">Расходы</div><div class="stat-value">' + fmtMoney(stats.expenses) + '</div></div>' +
              '<div class="stat-foot">' + expGroups.length + ' ' + plural(expGroups.length, 'статья', 'статьи', 'статей') + ' расходов</div></div>' +
            '<div class="card stat-card"><div class="stat-top"><div class="stat-icon green">' + icon('chart', 20) + '</div>' + deltaBadge(stats.profit, prev.profit) + '</div>' +
              '<div><div class="stat-label">Прибыль</div><div class="stat-value">' + fmtMoney(stats.profit) + '</div></div>' +
              '<div class="stat-foot">маржа ' + Math.round(margin) + '%</div></div>' +
            '<div class="card stat-card"><div class="stat-top"><div class="stat-icon amber">' + icon('receipt', 20) + '</div>' + deltaBadge(stats.avgCheck, prev.avgCheck) + '</div>' +
              '<div><div class="stat-label">Средний чек</div><div class="stat-value">' + fmtMoney(Math.round(stats.avgCheck)) + '</div></div>' +
              '<div class="stat-foot">' + Object.keys(daysWithSales).length + ' ' + plural(Object.keys(daysWithSales).length, 'день', 'дня', 'дней') + ' с продажами</div></div>' +
          '</div>' +

          '<div class="report-grid section-gap">' +
            '<div class="card" style="min-width:0">' +
              '<div class="card-head"><div><h3>Выручка и расходы</h3><div class="sub">' + range.sub + '</div></div>' +
                '<div class="legend"><span><i style="background:' + CHART_COLORS.revenue + '"></i>Выручка</span><span><i style="background:' + CHART_COLORS.expenses + '"></i>Расходы</span></div>' +
              '</div>' +
              '<div class="card-body"><div class="chart-wrap"><canvas id="anChart" class="chart-canvas tall"></canvas></div></div>' +
            '</div>' +
            '<div class="card">' +
              '<div class="card-head"><h3>Структура оплат</h3></div>' +
              '<div class="card-body">' +
                '<div class="donut-wrap" style="flex-direction:column;align-items:center;gap:16px">' +
                  '<canvas id="anDonut" width="176" height="176" style="width:176px;height:176px"></canvas>' +
                  '<div class="donut-legend" style="width:100%">' +
                    '<div class="row"><i style="background:#12b76a"></i><span class="nm">Наличные</span><span class="val">' + fmtMoney(stats.byMethod.cash) + '</span></div>' +
                    '<div class="row"><i style="background:#4f46e5"></i><span class="nm">Kaspi QR</span><span class="val">' + fmtMoney(stats.byMethod.qr) + '</span></div>' +
                    '<div class="row"><i style="background:#ee46bc"></i><span class="nm">Смешанный</span><span class="val">' + fmtMoney(stats.byMethod.mixed) + '</span></div>' +
                    (stats.mixedTotal
                      ? '<div class="row sub"><span class="nm" style="padding-left:16px">· наличными</span><span class="val">' + fmtMoney(stats.mixedCash) + '</span></div>' +
                        '<div class="row sub"><span class="nm" style="padding-left:16px">· Kaspi QR</span><span class="val">' + fmtMoney(stats.mixedQr) + '</span></div>' +
                        '<div class="row sub tiny muted"><span class="nm" style="padding-left:16px">смешанных продаж</span><span class="val">' + stats.mixedCount + '</span></div>'
                      : '') +
                  '</div>' +
                  '<div class="pay-total-box">' +
                    '<div class="row"><span class="nm">Итого наличными</span><span class="val">' + fmtMoney(stats.cashTotal) + '</span></div>' +
                    '<div class="row"><span class="nm">Итого Kaspi QR</span><span class="val">' + fmtMoney(stats.qrTotal) + '</span></div>' +
                    '<div class="row total"><span class="nm">Всего выручка</span><span class="val">' + fmtMoney(stats.revenue) + '</span></div>' +
                  '</div>' +
                '</div>' +
                '<div class="divider"></div>' +
                '<div class="kpi-inline">' +
                  '<div class="kpi-mini"><div class="l">Маржинальность</div><div class="v">' + Math.round(margin) + '%</div></div>' +
                  '<div class="kpi-mini"><div class="l">Прибыль в день</div><div class="v">' + fmtCompact(stats.profit / (range.days || 1)) + '</div></div>' +
                '</div>' +
              '</div>' +
            '</div>' +
          '</div>' +

          '<div class="report-grid section-gap">' +
            '<div class="card" style="min-width:0">' +
              '<div class="card-head"><div><h3>Топ товаров</h3><div class="sub">По выручке за период</div></div><span class="badge neutral">' + top.length + ' позиций</span></div>' +
              '<div class="card-body" style="padding-top:10px">' +
                (top.length
                  ? '<div class="table-wrap"><table class="tbl"><thead><tr><th style="width:34px">#</th><th>Товар</th><th>Кол-во</th><th>Выручка</th><th class="hide-sm" style="width:120px">Доля</th></tr></thead><tbody>' +
                      top.slice(0, 10).map(function (p, i) {
                        var share = stats.revenue ? (p.revenue / stats.revenue) * 100 : 0;
                        return '<tr><td><span class="idx badge neutral">' + (i + 1) + '</span></td>' +
                          '<td><div class="cell-main truncate" style="max-width:260px">' + esc(p.name) + '</div></td>' +
                          '<td><span class="badge neutral">' + p.qty + ' шт</span></td>' +
                          '<td><b class="money">' + fmtMoney(p.revenue) + '</b></td>' +
                          '<td class="hide-sm"><div class="flex gap-8"><div class="bar-track grow"><div class="bar-fill" style="width:' + Math.max(2, Math.round(share)) + '%"></div></div><span class="tiny muted">' + Math.round(share) + '%</span></div></td></tr>';
                      }).join('') + '</tbody></table></div>'
                  : '<div class="tbl-empty">Продаж за период пока нет</div>') +
              '</div>' +
            '</div>' +
            '<div class="card">' +
              '<div class="card-head"><h3>Продажи по точкам</h3></div>' +
              '<div class="card-body">' + barRows(byPoint, 'revenue', 'name', 'green') + '</div>' +
            '</div>' +
          '</div>' +

          '<div class="report-grid section-gap">' +
            '<div class="card">' +
              '<div class="card-head"><div><h3>Расходы по статьям</h3><div class="sub">Всего ' + fmtMoney(stats.expenses) + '</div></div></div>' +
              '<div class="card-body">' + barRows(expGroups, 'amount', 'name', 'red') + '</div>' +
            '</div>' +
            '<div class="card" style="min-width:0">' +
              '<div class="card-head"><h3>Сотрудники</h3></div>' +
              '<div class="card-body" style="padding-top:10px">' +
                (bySeller.length
                  ? '<div class="table-wrap"><table class="tbl"><thead><tr><th>Продавец</th><th>Продаж</th><th>Выручка</th><th class="text-right">Ср. чек</th></tr></thead><tbody>' +
                    bySeller.map(function (s) {
                      return '<tr><td><div class="user-cell">' + avatarHtml(s.name, 'avatar-sm') + '<span class="nm truncate">' + esc(s.name) + '</span></div></td>' +
                        '<td><span class="badge neutral">' + s.count + '</span></td>' +
                        '<td><b class="money">' + fmtMoney(s.total) + '</b></td>' +
                        '<td class="text-right money">' + fmtMoney(Math.round(s.total / s.count)) + '</td></tr>';
                    }).join('') + '</tbody></table></div>'
                  : '<div class="tbl-empty">Нет данных</div>') +
              '</div>' +
            '</div>' +
          '</div>' +

          '<div class="report-grid section-gap">' +
            '<div class="card">' +
              '<div class="card-head"><div><h3>Поступления на склад</h3><div class="sub">' + range.sub + '</div></div>' +
                '<span class="badge neutral">' + supplySum.count + ' ' + plural(supplySum.count, 'поставка', 'поставки', 'поставок') + '</span></div>' +
              '<div class="card-body">' +
                '<div class="kpi-inline" style="margin-bottom:16px">' +
                  '<div class="kpi-mini"><div class="l">Поступило единиц</div><div class="v">' + fmtNumber(supplySum.qty) + ' шт</div></div>' +
                  '<div class="kpi-mini"><div class="l">Позиций в поставках</div><div class="v">' + fmtNumber(supplySum.positions || 0) + '</div></div>' +
                '</div>' +
                qtyBarRows(suppliedTop, 'name', 'qty') +
              '</div>' +
            '</div>' +
            '<div class="card" style="min-width:0">' +
              '<div class="card-head"><h3>Последние поставки</h3></div>' +
              '<div class="card-body" style="padding-top:10px">' +
                (supplies.length
                  ? '<div class="table-wrap"><table class="tbl"><thead><tr><th>Дата</th><th class="hide-sm">Точка</th><th>Позиций</th><th class="text-right">Единиц</th></tr></thead><tbody>' +
                      supplies.slice().sort(function (a, b) { return b.createdAt - a.createdAt; }).slice(0, 6).map(function (sp) {
                        return '<tr><td><div class="cell-main nowrap">' + fmtDate(sp.createdAt) + '</div><div class="cell-sub nowrap">' + (sp.code || '') + '</div></td>' +
                          '<td class="hide-sm"><span class="cell-sub truncate" style="max-width:140px;display:block">' + esc(sp.pointName || pointName(sp.pointId)) + '</span></td>' +
                          '<td><span class="badge neutral">' + (sp.items || []).length + '</span></td>' +
                          '<td class="text-right"><span class="badge neutral">' + (sp.totalQty || 0) + ' шт</span></td></tr>';
                      }).join('') + '</tbody></table></div>'
                  : '<div class="tbl-empty">За выбранный период поставок не было</div>') +
              '</div>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<button type="button" class="fab" id="anExport">' + icon('download', 17) + ' Экспорт в Excel' +
          '<span class="kbd">XLSX</span></button>';

      root.querySelectorAll('[data-period]').forEach(function (btn) {
        btn.addEventListener('click', function () { state.period = btn.getAttribute('data-period'); ctx.rerender(); });
      });
      bindPeriodToolbar(root, state, function () { ctx.rerender(); });
      var pSelect = root.querySelector('#anPoint');
      if (pSelect) pSelect.addEventListener('change', function () {
        state.pointId = pSelect.value;
        if (isSeller) setActivePoint(user, pSelect.value);
        ctx.rerender();
      });

      var chart = root.querySelector('#anChart');
      if (chart) drawLineChart(chart, chartData(state.period, range.from, range.to, opts));
      var donut = root.querySelector('#anDonut');
      if (donut) {
        drawDonut(donut,
          [{ value: stats.byMethod.cash, color: '#12b76a' }, { value: stats.byMethod.qr, color: '#4f46e5' }, { value: stats.byMethod.mixed, color: '#ee46bc' }],
          'Оборот', fmtCompact(stats.revenue));
      }

      root.querySelector('#anExport').addEventListener('click', function () {
        var summary = [
          ['Показатель', 'Значение'],
          ['Период', range.label + ': ' + fmtDate(range.from) + ' — ' + fmtDate(range.to)],
          ['Точка', state.pointId === 'all' ? 'Все точки' : pointName(state.pointId)],
          ['Выручка, ₸', stats.revenue],
          ['Расходы, ₸', stats.expenses],
          ['Прибыль, ₸', stats.profit],
          ['Маржинальность, %', Math.round(margin)],
          ['Продаж', stats.salesCount],
          ['Средний чек, ₸', Math.round(stats.avgCheck)],
          ['Продано товаров, шт', stats.itemsSold],
          ['Наличные (только нал.), ₸', stats.byMethod.cash],
          ['Kaspi QR (только QR), ₸', stats.byMethod.qr],
          ['Смешанная оплата, всего, ₸', stats.byMethod.mixed],
          ['— из них наличными, ₸', stats.mixedCash],
          ['— из них Kaspi QR, ₸', stats.mixedQr],
          ['— количество смешанных продаж', stats.mixedCount],
          ['Итого поступило наличными (с учётом смешанных), ₸', stats.cashTotal],
          ['Итого поступило Kaspi QR (с учётом смешанных), ₸', stats.qrTotal],
          ['Поставок на склад', supplySum.count],
          ['Поставлено единиц, шт', supplySum.qty],
          ['Сформировано', fmtDateTime(Date.now())]
        ];
        var tx = [['№', 'Дата', 'Время', 'Точка', 'Продавец', 'Товары', 'Кол-во', 'Сумма, ₸', 'Оплата', 'Наличными, ₸', 'Kaspi QR, ₸']];
        stats.sales.forEach(function (s) {
          var cash = s.payment === 'cash' ? s.total : (s.payment === 'mixed' ? (s.cashAmount || 0) : 0);
          var qr = s.payment === 'qr' ? s.total : (s.payment === 'mixed' ? (s.qrAmount || 0) : 0);
          tx.push([s.code || '', fmtDate(s.createdAt), fmtTime(s.createdAt), s.pointName || pointName(s.pointId), s.userName,
            (s.items && s.items.length) ? (s.items || []).map(function (i) { return i.name + ' ×' + i.qty; }).join(', ') : (s.imported ? 'Импорт' : '—'),
            (s.items || []).reduce(function (n, i) { return n + i.qty; }, 0), s.total, paymentLabel(s.payment), cash, qr]);
        });
        var products = [['Товар', 'Кол-во', 'Выручка, ₸', 'Доля, %']];
        top.forEach(function (p) {
          products.push([p.name, p.qty, p.revenue, stats.revenue ? Math.round((p.revenue / stats.revenue) * 1000) / 10 : 0]);
        });
        var exp = [['Дата', 'Статья', 'Точка', 'Сотрудник', 'Сумма, ₸']];
        stats.expenseList.forEach(function (e) {
          exp.push([fmtDate(e.createdAt), e.reason, e.pointName || pointName(e.pointId), e.userName, e.amount]);
        });
        var pts = [['Точка', 'Продаж', 'Выручка, ₸']];
        byPoint.forEach(function (p) { pts.push([p.name, p.count, p.revenue]); });
        var sup = [['Дата', '№', 'Точка', 'Товары', 'Единиц, шт', 'Сотрудник']];
        supplies.slice().sort(function (a, b) { return b.createdAt - a.createdAt; }).forEach(function (sp) {
          sup.push([fmtDate(sp.createdAt) + ' ' + fmtTime(sp.createdAt), sp.code || '', sp.pointName || pointName(sp.pointId),
            (sp.items || []).map(function (i) { return i.name + ' ×' + i.qty; }).join(', '),
            sp.totalQty || 0, sp.userName || '']);
        });

        var sellers = [['Сотрудник', 'Продаж', 'Выручка, ₸', 'Средний чек, ₸', 'Товаров, шт']];
        bySeller.forEach(function (s) { sellers.push([s.name, s.count, s.total, Math.round(s.total / s.count), s.items]); });

        PosXlsx.downloadXlsx('analitika_' + dayKey(range.from) + '_' + dayKey(range.to) + '.xlsx', [
          { name: 'Сводка', rows: summary },
          { name: 'Транзакции', rows: tx },
          { name: 'Товары', rows: products },
          { name: 'Точки', rows: pts },
          { name: 'Сотрудники', rows: sellers },
          { name: 'Расходы', rows: exp },
          { name: 'Поставки', rows: sup }
        ]);
        toast('Аналитический отчёт выгружен', 'success');
      });
    }
  };
})();

</script>
  <script>
/* ============================================================
   POS Контроль — ручные продажи: любая дата и время (владелец, разработчик)
   ============================================================ */
(function () {
  'use strict';
  var PAGES = window.PAGES = window.PAGES || {};

  var state = { period: 'month', pointId: 'all' };

  function rangeFor(period) {
    var now = Date.now();
    if (period === 'today') return { from: startOfDay(new Date()), to: now };
    if (period === 'week') return { from: startOfDay(addDays(new Date(), -6)), to: now };
    if (period === 'month') return { from: startOfDay(addDays(new Date(), -29)), to: now };
    if (period === 'quarter') return { from: startOfDay(addDays(new Date(), -89)), to: now };
    return { from: 0, to: now };
  }

  function periodCovering(at) {
    var now = Date.now();
    if (at >= startOfDay(new Date())) return 'today';
    if (at >= startOfDay(addDays(new Date(), -6))) return 'week';
    if (at >= startOfDay(addDays(new Date(), -29))) return 'month';
    if (at >= startOfDay(addDays(new Date(), -89))) return 'quarter';
    return 'all';
  }

  function sellersFor(pointId) {
    return DB.users.filter(function (u) {
      if (u.role !== 'seller') return false;
      var ids = Array.isArray(u.pointIds) ? u.pointIds : (u.pointId ? [u.pointId] : []);
      return ids.indexOf(pointId) !== -1;
    });
  }

  function sellerOptions(pointId, currentUserId) {
    var me = getUser(currentUserId);
    var list = sellersFor(pointId);
    var html = '<option value="">' + esc(me ? 'Я — ' + me.fullName : 'Не указывать') + '</option>';
    list.forEach(function (u) {
      html += '<option value="' + u.id + '">' + esc(u.fullName) + '</option>';
    });
    return html;
  }

  /* ---------- форма добавления ---------- */
  function openManualSaleModal(ctx, opts) {
    opts = opts || {};
    var user = ctx.user;
    if (!DB.points.length) {
      toast('Сначала создайте точку продаж', 'error');
      return;
    }

    var pointId = opts.pointId || (state.pointId !== 'all' ? state.pointId : (DB.points[0] && DB.points[0].id));
    var cart = [];
    var payment = 'cash';
    var defaultDate = opts.date || dayKey(new Date());
    var defaultTime = opts.time || fmtTime(Date.now());

    function productsOf(pid) {
      return productsForPoint(pid);
    }

    function productOptions(pid) {
      var list = productsOf(pid);
      if (!list.length) return '<option value="">Нет товаров на точке</option>';
      return list.map(function (p) {
        return '<option value="' + p.id + '">' + esc(p.name) + ' · ' + fmtMoney(p.price) + '</option>';
      }).join('');
    }

    var pointsOptions = DB.points.map(function (p) {
      return '<option value="' + p.id + '"' + (p.id === pointId ? ' selected' : '') + '>' + esc(p.name) + '</option>';
    }).join('');

    var modal = openModal({
      title: 'Добавить продажу',
      subtitle: 'Любая дата — продажа попадёт в статистику, аналитику и отчёт по складу',
      size: 'lg',
      body:
        '<form id="msForm" style="display:flex;flex-direction:column;gap:14px">' +
          '<div class="form-grid">' +
            '<div class="field"><label for="msPoint">Точка продаж</label>' +
              '<select class="select" id="msPoint">' + pointsOptions + '</select></div>' +
            '<div class="field"><label for="msSeller">Кто оформил</label>' +
              '<select class="select" id="msSeller">' + sellerOptions(pointId, user.id) + '</select></div>' +
            '<div class="field"><label for="msDate">Дата продажи</label>' +
              '<input class="input" type="date" id="msDate" max="' + dayKey(new Date()) + '" value="' + defaultDate + '"></div>' +
            '<div class="field"><label for="msTime">Время</label>' +
              '<input class="input" type="time" id="msTime" value="' + defaultTime + '"></div>' +
          '</div>' +

          '<div class="field" style="margin:0"><label>Товары</label>' +
            '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">' +
              '<select class="select" id="msProduct" style="flex:1 1 220px;min-width:170px">' + productOptions(pointId) + '</select>' +
              '<input class="input" type="number" id="msQty" min="1" step="1" value="1" style="width:76px" title="Количество">' +
              '<input class="input" type="number" id="msPrice" min="0" step="1" style="width:110px" title="Цена за штуку" placeholder="Цена">' +
              '<button type="button" class="btn btn-secondary" id="msAdd">' + icon('plus', 15) + ' Добавить</button>' +
            '</div>' +
            '<div id="msCart" style="margin-top:10px"></div>' +
          '</div>' +

          '<div class="field" style="margin:0"><label>Оплата</label>' +
            '<div class="segmented pay-seg" id="msPay">' +
              '<button type="button" data-pay="cash" class="active">Наличные</button>' +
              '<button type="button" data-pay="qr">Kaspi QR</button>' +
              '<button type="button" data-pay="mixed">Смешанный</button>' +
            '</div>' +
          '</div>' +

          '<div class="form-grid" id="msMixed" style="display:none">' +
            '<div class="field"><label for="msCash">Наличными, ' + APP_CONFIG.currency + '</label>' +
              '<input class="input" id="msCash" inputmode="numeric" placeholder="0"></div>' +
            '<div class="field"><label for="msQr">Kaspi QR, ' + APP_CONFIG.currency + '</label>' +
              '<input class="input" id="msQr" inputmode="numeric" placeholder="0"></div>' +
          '</div>' +

          '<div class="field" style="margin:0"><label for="msNote">Комментарий (необязательно)</label>' +
            '<input class="input" id="msNote" placeholder="Например: продажа за 15 октября, чек потерян"></div>' +

          '<div id="msStockBox">' +
            '<label class="check"><input type="checkbox" id="msDeduct" checked>' +
              '<span id="msDeductText">Списать товары со склада (только для сегодняшней даты).</span></label>' +
          '</div>' +

          '<div class="form-note info" style="margin:0" id="msHint">' + icon('info', 15) +
            '<span id="msHintText">Продажа за прошлую дату попадёт в отчёт склада за эту дату (колонка «Продано»), но не изменит остатки и отчёты за следующие дни.</span></div>' +
        '</form>',
      footer:
        '<button type="button" class="btn btn-secondary" data-cancel>Отмена</button>' +
        '<button type="button" class="btn btn-primary" id="msSave">' + icon('check', 16) + ' Добавить продажу</button>',
      onMount: function (el, close) {
        var pointEl = el.querySelector('#msPoint');
        var sellerEl = el.querySelector('#msSeller');
        var productEl = el.querySelector('#msProduct');
        var qtyEl = el.querySelector('#msQty');
        var priceEl = el.querySelector('#msPrice');
        var cartEl = el.querySelector('#msCart');
        var mixedBox = el.querySelector('#msMixed');
        var cashEl = el.querySelector('#msCash');
        var qrEl = el.querySelector('#msQr');

        function cartTotal() {
          return cart.reduce(function (s, it) { return s + it.price * it.qty; }, 0);
        }

        function syncPrice() {
          var p = getProduct(productEl.value);
          priceEl.value = p ? p.price : '';
        }

        function renderCart() {
          if (!cart.length) {
            cartEl.innerHTML = '<div class="muted small" style="padding:6px 0">Пока пусто — выберите товар и нажмите «Добавить»</div>';
          } else {
            cartEl.innerHTML = '<div class="table-wrap"><table class="tbl"><thead><tr>' +
              '<th>Товар</th><th style="width:84px">Кол-во</th><th style="width:110px">Цена</th>' +
              '<th class="text-right">Сумма</th><th style="width:44px"></th></tr></thead><tbody>' +
              cart.map(function (it, i) {
                return '<tr>' +
                  '<td><span class="cell-main">' + esc(it.name) + '</span></td>' +
                  '<td><input class="input" style="width:70px;height:34px" type="number" min="1" step="1" value="' + it.qty + '" data-qty="' + i + '"></td>' +
                  '<td><input class="input" style="width:96px;height:34px" type="number" min="0" step="1" value="' + it.price + '" data-price="' + i + '"></td>' +
                  '<td class="text-right"><span class="cell-main money">' + fmtMoney(it.price * it.qty) + '</span></td>' +
                  '<td><button type="button" class="icon-btn danger" data-remove="' + i + '" title="Убрать">' + icon('trash', 15) + '</button></td>' +
                '</tr>';
              }).join('') + '</tbody></table></div>' +
              '<div class="flex between" style="padding:8px 2px 0;font-weight:700">' +
                '<span>Итого</span><span>' + fmtMoney(cartTotal()) + '</span></div>';
          }
          cartEl.querySelectorAll('[data-qty]').forEach(function (inp) {
            inp.addEventListener('change', function () {
              var i = Number(inp.getAttribute('data-qty'));
              cart[i].qty = Math.max(1, Math.round(Number(inp.value) || 1));
              renderCart();
            });
          });
          cartEl.querySelectorAll('[data-price]').forEach(function (inp) {
            inp.addEventListener('change', function () {
              var i = Number(inp.getAttribute('data-price'));
              cart[i].price = Math.max(0, Math.round(Number(inp.value) || 0));
              renderCart();
            });
          });
          cartEl.querySelectorAll('[data-remove]').forEach(function (btn) {
            btn.addEventListener('click', function () {
              cart.splice(Number(btn.getAttribute('data-remove')), 1);
              renderCart();
            });
          });
          syncMixedHint();
        }

        function syncMixedHint() {
          var total = cartTotal();
          if (payment !== 'mixed') return;
          if (!cashEl.value) {
            qrEl.value = total ? String(total) : '';
          }
        }

        function rebuildProducts() {
          productEl.innerHTML = productOptions(pointEl.value);
          syncPrice();
          sellerEl.innerHTML = sellerOptions(pointEl.value, user.id);
        }

        productEl.addEventListener('change', syncPrice);
        pointEl.addEventListener('change', function () {
          rebuildProducts();
          cart = [];
          renderCart();
        });

        el.querySelector('#msAdd').addEventListener('click', function () {
          var product = getProduct(productEl.value);
          if (!product) { toast('Выберите товар', 'error'); return; }
          var qty = Math.max(1, Math.round(Number(qtyEl.value) || 1));
          var price = priceEl.value === '' ? product.price : Math.max(0, Math.round(Number(priceEl.value) || 0));
          if (price <= 0) { toast('Укажите цену больше нуля', 'error'); priceEl.focus(); return; }
          var existing = cart.filter(function (it) { return it.productId === product.id; })[0];
          if (existing) {
            existing.qty += qty;
            existing.price = price;
          } else {
            cart.push({ productId: product.id, name: product.name, price: price, qty: qty });
          }
          qtyEl.value = '1';
          renderCart();
        });

        el.querySelectorAll('#msPay [data-pay]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            payment = btn.getAttribute('data-pay');
            el.querySelectorAll('#msPay [data-pay]').forEach(function (b) { b.classList.toggle('active', b === btn); });
            mixedBox.style.display = payment === 'mixed' ? '' : 'none';
            if (payment === 'mixed') syncMixedHint();
          });
        });

        cashEl.addEventListener('input', function () {
          var cash = Math.max(0, Math.round(Number(cashEl.value) || 0));
          var total = cartTotal();
          if (cash > total) cash = total;
          qrEl.value = String(Math.max(0, total - cash));
        });

        var deductEl = el.querySelector('#msDeduct');
        var dateEl = el.querySelector('#msDate');
        var hintText = el.querySelector('#msHintText');

        var lastToday = null;
        function syncDeductState() {
          var at = parseSaleMoment(dateEl.value, el.querySelector('#msTime').value || '00:00');
          var isToday = !!at && at >= startOfDay(new Date());
          deductEl.disabled = !isToday;
          if (!isToday) deductEl.checked = false;
          else if (lastToday === false) deductEl.checked = true;   // вернулись к сегодняшней дате
          lastToday = isToday;
          hintText.innerHTML = isToday
            ? 'Продажа за сегодня: если оставить галочку, товары спишутся со склада, как при обычной продаже.'
            : 'Продажа за прошлую дату попадёт в отчёт склада за эту дату (колонка «Продано»), но <b>не изменит остатки</b> и отчёты за следующие дни.';
        }
        dateEl.addEventListener('change', syncDeductState);
        el.querySelector('#msTime').addEventListener('change', syncDeductState);
        syncDeductState();

        el.querySelector('[data-cancel]').addEventListener('click', close);
        el.querySelector('#msSave').addEventListener('click', function () {
          if (!cart.length) { toast('Добавьте хотя бы один товар', 'error'); return; }
          var at = parseSaleMoment(el.querySelector('#msDate').value, el.querySelector('#msTime').value);
          if (!at) { toast('Проверьте дату и время', 'error'); return; }
          if (at > Date.now() + 60000) { toast('Дата продажи не может быть в будущем', 'error'); return; }

          var cashAmount = 0, qrAmount = 0;
          if (payment === 'mixed') {
            cashAmount = Math.max(0, Math.round(Number(cashEl.value) || 0));
            qrAmount = Math.max(0, Math.round(Number(qrEl.value) || 0));
          }

          var res = createManualSale({
            pointId: pointEl.value,
            at: at,
            items: cart,
            payment: payment,
            cashAmount: cashAmount,
            qrAmount: qrAmount,
            sellerId: sellerEl.value || null,
            note: el.querySelector('#msNote').value,
            deductStock: el.querySelector('#msDeduct').checked
          }, user);

          if (res.error) { toast(res.error, 'error', 4600); return; }

          state.pointId = res.sale.pointId;
          state.period = periodCovering(at);
          close();
          toast('Продажа на ' + fmtMoney(res.total) + ' добавлена за ' + fmtDate(at) + ' ' + fmtTime(at), 'success', 4200);
          ctx.rerender();
        });
      }
    });
    return modal;
  }

  PAGES.manual = {
    render: function (root, ctx) {
      var user = ctx.user;
      if (!canManageManualSales(user)) {
        root.innerHTML = '<div class="page">' + emptyState('lock', 'Раздел недоступен', 'Добавлять продажи вручную может владелец или разработчик.', '') + '</div>';
        return;
      }

      var range = rangeFor(state.period);
      var all = manualSales();
      var list = all.filter(function (s) {
        if (s.createdAt < range.from || s.createdAt > range.to) return false;
        if (state.pointId !== 'all' && s.pointId !== state.pointId) return false;
        return true;
      }).sort(function (a, b) { return b.createdAt - a.createdAt; });

      var sum = list.reduce(function (n, s) { return n + (s.total || 0); }, 0);
      var deducted = list.filter(function (s) { return s.stockDeducted; }).length;

      var pointOptions = DB.points.map(function (p) {
        return '<option value="' + p.id + '"' + (state.pointId === p.id ? ' selected' : '') + '>' + esc(p.name) + '</option>';
      }).join('');

      var rows = list.map(function (s) {
        var itemsText = (s.items || []).map(function (it) { return it.name + ' ×' + it.qty; }).join(', ') || '—';
        var pay = s.payment === 'mixed'
          ? badge(paymentLabel('mixed'), paymentBadgeClass('mixed')) + '<div class="cell-sub nowrap">нал ' + fmtCompact(s.cashAmount || 0) + ' · QR ' + fmtCompact(s.qrAmount || 0) + '</div>'
          : badge(paymentLabel(s.payment), paymentBadgeClass(s.payment));
        return '<tr data-manual-row>' +
          '<td><div class="cell-main nowrap">' + fmtDate(s.createdAt) + '</div><div class="cell-sub nowrap">' + fmtTime(s.createdAt) + '</div></td>' +
          '<td><span class="cell-main">' + esc(s.pointName || pointName(s.pointId)) + '</span></td>' +
          '<td style="max-width:250px"><div class="cell-main truncate" title="' + esc(itemsText) + '">' + esc(itemsText) + '</div>' +
            '<div class="cell-sub">' + (s.items || []).reduce(function (n, it) { return n + it.qty; }, 0) + ' шт · #' + esc(s.code || '') + '</div></td>' +
          '<td>' + pay + '</td>' +
          '<td class="text-right"><span class="cell-main money">' + fmtMoney(s.total) + '</span></td>' +
          '<td><span class="cell-main">' + esc(s.userName || '—') + '</span>' +
            '<div class="cell-sub">добавил: ' + esc(s.manualBy || '—') + '</div>' +
            (s.manualNote ? '<div class="cell-sub truncate" title="' + esc(s.manualNote) + '">' + esc(s.manualNote) + '</div>' : '') + '</td>' +
          '<td>' + (s.stockDeducted
            ? '<span class="badge success">списано</span>'
            : '<span class="badge neutral">без списания</span>') +
            (s.stockDeducted ? '' : '<div class="cell-sub">только в отчёте</div>') + '</td>' +
          '<td><div class="actions"><button type="button" class="icon-btn danger" data-del-manual="' + s.id + '" title="Удалить продажу">' + icon('trash', 16) + '</button></div></td>' +
          '</tr>';
      }).join('');

      root.innerHTML =
        '<div class="page">' +
          '<div class="page-head">' +
            '<div><h1>Ручные продажи</h1>' +
              '<div class="sub">Добавление продаж за любую дату и время — они попадают во все отчёты и аналитику</div></div>' +
            '<div class="page-actions">' +
              '<div class="segmented">' +
                '<button type="button" data-period="today" class="' + (state.period === 'today' ? 'active' : '') + '">Сегодня</button>' +
                '<button type="button" data-period="week" class="' + (state.period === 'week' ? 'active' : '') + '">7 дней</button>' +
                '<button type="button" data-period="month" class="' + (state.period === 'month' ? 'active' : '') + '">30 дней</button>' +
                '<button type="button" data-period="quarter" class="' + (state.period === 'quarter' ? 'active' : '') + '">90 дней</button>' +
                '<button type="button" data-period="all" class="' + (state.period === 'all' ? 'active' : '') + '">Всё время</button>' +
              '</div>' +
              '<button type="button" class="btn btn-primary" id="manualAdd">' + icon('plus', 16) + ' Добавить продажу</button>' +
            '</div>' +
          '</div>' +

          '<div class="kpi-inline" style="margin-bottom:16px">' +
            '<div class="kpi-mini"><div class="l">Добавлено вручную</div><div class="v">' + list.length + '</div></div>' +
            '<div class="kpi-mini"><div class="l">Сумма</div><div class="v">' + fmtMoney(sum) + '</div></div>' +
            '<div class="kpi-mini"><div class="l">Списано со склада</div><div class="v">' + deducted + '</div></div>' +
            '<div class="kpi-mini"><div class="l">Всего за всё время</div><div class="v">' + all.length + '</div></div>' +
          '</div>' +

          '<div class="card">' +
            '<div class="card-head" style="padding-bottom:14px">' +
              '<div><h3>Список ручных продаж</h3><div class="sub">' + (list.length ? list.length + ' ' + plural(list.length, 'запись', 'записи', 'записей') : 'пока пусто') + '</div></div>' +
              '<select class="select" id="manualPoint" style="width:auto;height:36px">' +
                '<option value="all"' + (state.pointId === 'all' ? ' selected' : '') + '>Все точки</option>' + pointOptions +
              '</select>' +
            '</div>' +
            '<div class="card-body" style="padding-top:0">' +
              (list.length
                ? '<div class="table-wrap"><table class="tbl"><thead><tr>' +
                    '<th>Дата продажи</th><th>Точка</th><th>Товары</th><th>Оплата</th>' +
                    '<th class="text-right">Сумма</th><th>Кто · комментарий</th><th>Склад</th><th></th>' +
                  '</tr></thead><tbody>' + rows + '</tbody></table></div>'
                : '<div class="tbl-empty">' + (all.length
                    ? 'За выбранный период ручных продаж нет'
                    : 'Ручных продаж ещё не было. Нажмите «Добавить продажу».') + '</div>') +
            '</div>' +
          '</div>' +

          '<div class="form-note info" style="margin-top:14px">' + icon('info', 15) +
            '<span>Продажа сохраняется с выбранной датой: она сразу видна в <b>панели</b>, <b>аналитике</b> и в колонке <b>«Продано»</b> отчёта по складу за эту дату. Продажи за прошлые даты <b>не меняют остатки</b> — отчёты за следующие дни остаются такими же, как были. Склад списывается только у продажи за сегодня.</span>' +
          '</div>' +
        '</div>';

      root.querySelectorAll('[data-period]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          state.period = btn.getAttribute('data-period');
          ctx.rerender();
        });
      });
      root.querySelector('#manualPoint').addEventListener('change', function (e) {
        state.pointId = e.target.value;
        ctx.rerender();
      });
      root.querySelector('#manualAdd').addEventListener('click', function () {
        var pointId = state.pointId !== 'all' ? state.pointId : (DB.points[0] && DB.points[0].id);
        openManualSaleModal(ctx, { pointId: pointId });
      });

      root.querySelectorAll('[data-del-manual]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var id = btn.getAttribute('data-del-manual');
          var sale = DB.sales.find(function (s) { return s.id === id; });
          if (!sale) return;
          confirmDialog({
            title: 'Удалить ручную продажу?',
            message: 'Продажа #' + esc(sale.code) + ' на ' + fmtMoney(sale.total) + ' от ' + fmtDate(sale.createdAt) + ' ' + fmtTime(sale.createdAt) +
              ' исчезнет из статистики.' + (sale.stockDeducted ? ' Товары вернутся на склад.' : ''),
            danger: true,
            confirmText: 'Удалить'
          }).then(function (ok) {
            if (!ok) return;
            var res = deleteManualSale(id, user);
            if (res.error) { toast(res.error, 'error'); return; }
            toast('Продажа удалена' + (sale.stockDeducted ? ', товары возвращены на склад' : ''), 'success', 3600);
            ctx.rerender();
          });
        });
      });
    }
  };

  window.openManualSaleModal = openManualSaleModal;
})();

  <script>
/* ============================================================
   POS Контроль — журнал изменений продаж (правки и отмены)
   ============================================================ */
(function () {
  'use strict';
  var PAGES = window.PAGES = window.PAGES || {};
  var state = { period: 'week', type: 'all', pointId: 'all' };

  function typeLabel(type) {
    if (type === 'cancel') return 'Отмена';
    return 'Правка';
  }

  function typeBadge(type) {
    return type === 'cancel'
      ? '<span class="badge" style="background:var(--danger-soft);color:var(--danger-600)">' + icon('x', 12) + ' Отмена</span>'
      : '<span class="badge" style="background:var(--primary-soft);color:var(--primary-600)">' + icon('edit', 12) + ' Правка</span>';
  }

  function payText(snap) {
    if (!snap) return '—';
    if (snap.payment === 'mixed') {
      return 'Смешанный · нал ' + fmtMoney(snap.cashAmount) + ' / QR ' + fmtMoney(snap.qrAmount);
    }
    return paymentLabel(snap.payment) + (snap.payment === 'qr' ? ' · ' + fmtMoney(snap.total) : ' · ' + fmtMoney(snap.total));
  }

  function receiptText(snap) {
    if (!snap) return '—';
    return snap.hasReceipt ? '<span class="badge success">есть</span>' : '<span class="badge neutral">нет</span>';
  }

  function rangeFor(period) {
    var now = Date.now();
    var today = startOfDay(new Date());
    if (period === 'today') return { from: today, to: now };
    if (period === 'week') return { from: startOfDay(addDays(new Date(), -6)), to: now };
    if (period === 'month') return { from: startOfDay(addDays(new Date(), -29)), to: now };
    return { from: 0, to: now };
  }

  PAGES.changes = {
    render: function (root, ctx) {
      var user = ctx.user;
      var range = rangeFor(state.period);

      var all = (DB.saleChanges || []).slice().sort(function (a, b) { return b.at - a.at; });
      var list = all.filter(function (c) {
        if (c.at < range.from || c.at > range.to) return false;
        if (state.type !== 'all' && c.type !== state.type) return false;
        if (state.pointId !== 'all' && c.pointId !== state.pointId) return false;
        return true;
      });

      var edits = list.filter(function (c) { return c.type === 'edit'; }).length;
      var cancels = list.filter(function (c) { return c.type === 'cancel'; }).length;

      var rowsHtml = list.map(function (c) {
        var before = c.before || null;
        var after = c.after || null;
        var items = (c.items || []).map(function (i) { return esc(i.name) + ' ×' + i.qty; }).join(', ') || '—';
        return '<tr data-change-row data-name="' + esc((c.saleCode + ' ' + c.userName + ' ' + items).toLowerCase()) + '">' +
          '<td><div class="cell-main nowrap">' + fmtDate(c.at) + '</div><div class="cell-sub nowrap">' + fmtTime(c.at) + '</div></td>' +
          '<td>' + typeBadge(c.type) + '</td>' +
          '<td><div class="cell-main nowrap">#' + esc(c.saleCode || '') + '</div>' +
            '<div class="cell-sub nowrap">продажа ' + fmtDate(c.saleAt || c.at) + ' ' + fmtTime(c.saleAt || c.at) + '</div></td>' +
          '<td><span class="cell-main">' + esc(c.userName || '—') + '</span>' +
            '<div class="cell-sub">' + esc(c.pointName || pointName(c.pointId)) + '</div></td>' +
          '<td style="max-width:230px"><span class="muted small">' + items + '</span></td>' +
          '<td><div class="cell-sub nowrap">было: ' + payText(before) + '</div>' +
            '<div class="cell-sub nowrap">чек: ' + receiptText(before) + '</div></td>' +
          '<td>' + (after
            ? '<div class="cell-main nowrap">стало: ' + payText(after) + '</div><div class="cell-sub nowrap">чек: ' + receiptText(after) + '</div>'
            : '<div class="cell-main" style="color:var(--danger-600)">отменена</div>' +
              '<div class="cell-sub">' + ((c.restored || []).length ? 'возврат: ' + (c.restored || []).map(function (r) { return esc(r.name) + ' ×' + r.qty; }).join(', ') : '') + '</div>') + '</td>' +
          '</tr>';
      }).join('');

      var pointOptions = DB.points.map(function (p) {
        return '<option value="' + p.id + '"' + (state.pointId === p.id ? ' selected' : '') + '>' + esc(p.name) + '</option>';
      }).join('');

      root.innerHTML =
        '<div class="page">' +
          '<div class="page-head">' +
            '<div><h1>Изменения</h1><div class="sub">Правки и отмены продаж — кто, когда и что изменил</div></div>' +
            '<div class="page-actions">' +
              '<div class="segmented">' +
                '<button type="button" data-period="today" class="' + (state.period === 'today' ? 'active' : '') + '">Сегодня</button>' +
                '<button type="button" data-period="week" class="' + (state.period === 'week' ? 'active' : '') + '">7 дней</button>' +
                '<button type="button" data-period="month" class="' + (state.period === 'month' ? 'active' : '') + '">30 дней</button>' +
                '<button type="button" data-period="all" class="' + (state.period === 'all' ? 'active' : '') + '">Всё время</button>' +
              '</div>' +
            '</div>' +
          '</div>' +

          '<div class="kpi-inline" style="margin-bottom:16px">' +
            '<div class="kpi-mini"><div class="l">Всего изменений</div><div class="v">' + list.length + '</div></div>' +
            '<div class="kpi-mini"><div class="l">Правок</div><div class="v">' + edits + '</div></div>' +
            '<div class="kpi-mini"><div class="l">Отмен продаж</div><div class="v" style="color:var(--danger-600)">' + cancels + '</div></div>' +
            '<div class="kpi-mini"><div class="l">Сумма отменённых</div><div class="v">' + fmtMoney(list.filter(function (c) { return c.type === 'cancel' && c.before; }).reduce(function (s, c) { return s + (c.before.total || 0); }, 0)) + '</div></div>' +
          '</div>' +

          '<div class="card">' +
            '<div class="card-head" style="padding-bottom:14px">' +
              '<div><h3>Журнал изменений</h3><div class="sub">' + (list.length ? list.length + ' ' + plural(list.length, 'запись', 'записи', 'записей') : 'пока пусто') + '</div></div>' +
              '<div class="flex gap-8 wrap">' +
                '<select class="select" id="chType" style="width:auto;height:36px">' +
                  '<option value="all"' + (state.type === 'all' ? ' selected' : '') + '>Все типы</option>' +
                  '<option value="edit"' + (state.type === 'edit' ? ' selected' : '') + '>Только правки</option>' +
                  '<option value="cancel"' + (state.type === 'cancel' ? ' selected' : '') + '>Только отмены</option>' +
                '</select>' +
                '<select class="select" id="chPoint" style="width:auto;height:36px">' +
                  '<option value="all"' + (state.pointId === 'all' ? ' selected' : '') + '>Все точки</option>' + pointOptions +
                '</select>' +
                '<div class="input-icon" style="width:180px">' + icon('search', 15) +
                  '<input class="input" id="chSearch" style="height:36px" placeholder="Найти…"></div>' +
              '</div>' +
            '</div>' +
            '<div class="card-body" style="padding-top:0">' +
              (list.length
                ? '<div class="table-wrap"><table class="tbl"><thead><tr>' +
                    '<th>Когда</th><th>Тип</th><th>Продажа</th><th>Кто · точка</th><th>Товары</th><th>Было</th><th>Стало</th>' +
                  '</tr></thead><tbody>' + rowsHtml + '</tbody></table></div>'
                : '<div class="tbl-empty">' + (all.length ? 'За выбранный период изменений нет' : 'Продажи ещё не правили и не отменяли') + '</div>') +
            '</div>' +
          '</div>' +

          '<div class="form-note info" style="margin-top:14px">' + icon('info', 15) +
            '<span>Продавец может изменить оплату, чек и отменить продажу <b>только в течение 2 суток</b> и только на своей точке. Каждое действие фиксируется здесь: кто, когда, что было и что стало.</span>' +
          '</div>' +
        '</div>';

      root.querySelectorAll('[data-period]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          state.period = btn.getAttribute('data-period');
          ctx.rerender();
        });
      });
      root.querySelector('#chType').addEventListener('change', function (e) { state.type = e.target.value; ctx.rerender(); });
      root.querySelector('#chPoint').addEventListener('change', function (e) { state.pointId = e.target.value; ctx.rerender(); });
      var search = root.querySelector('#chSearch');
      search.addEventListener('input', function () {
        var q = search.value.trim().toLowerCase();
        root.querySelectorAll('[data-change-row]').forEach(function (tr) {
          tr.style.display = tr.getAttribute('data-name').indexOf(q) === -1 ? 'none' : '';
        });
      });
    }
  };
})();

</script>
  <script>
/* ============================================================
   POS Контроль — помощь: интерактивное руководство
   ============================================================ */
(function () {
  'use strict';
  var PAGES = window.PAGES = window.PAGES || {};

  function navGroup(title, items) {
    return '<div class="grp">' + title + '</div>' + items.map(function (it) {
      return '<a href="#" data-target="' + it[0] + '">' + icon(it[1], 15) + ' ' + it[2] + '</a>';
    }).join('');
  }

  function contactTile(iconName, title, desc, href) {

  function serverCardHtml(user) {

    var head = '<h3>' + icon('cloud', 17) + ' Сервер и синхронизация</h3>' +

        '</div>' +

          '<button type="button" class="btn btn-secondary" id="srvTest">' + icon('cloud', 16) + ' Проверить связь</button>' +

      '</div>';
    }

    var lastSync = st.lastSyncAt ? fmtDate(st.lastSyncAt) + ', ' + fmtTime(st.lastSyncAt) : 'ещё не выполнялась';
    var roleMismatch = cfg.user && cfg.user.role !== user.role
      ? '<div class="form-note warn">' + icon('alert', 15) + '<span>Роль на сервере: <b>' + roleLabel(cfg.user.role) + '</b>, на устройстве: <b>' + roleLabel(user.role) + '</b>. Войдите на сервер заново, чтобы применить роль.</span></div>'
      : '';

  function bindServerCard(root, ctx) {
    var api = window.POS_API;
    if (!api) return;
    var statusBox = root.querySelector('#srvStatus');
    function note(html, cls) {
      if (!statusBox) return;
      statusBox.className = 'hint';
      statusBox.innerHTML = html;
      statusBox.style.color = cls === 'error' ? 'var(--danger)' : (cls === 'success' ? 'var(--success-600)' : '');
    }
    function readUrl() {
      var input = root.querySelector('#srvUrl');
      return input ? input.value.trim() : api.serverConfig().url;
    }

    var test = root.querySelector('#srvTest');
    if (test) test.addEventListener('click', async function () {
      var btn = this;
      var url = readUrl();
      if (!url) { note('Укажите адрес сервера', 'error'); return; }
      setButtonBusy(btn, true, 'Проверяем…');
      try {
        var info = await api.testServer(url);
        note('Сервер доступен · версия ' + (info.version || '—') + ' · пользователей: ' + (info.users === null || info.users === undefined ? '—' : info.users), 'success');
      } catch (err) {
        note(err.message, 'error');
      }
      setButtonBusy(btn, false);
    });

    async function connect(mode, btn) {
      var url = readUrl();
      var loginInput = root.querySelector('#srvUser');
      var passInput = root.querySelector('#srvPass');
      var username = loginInput ? loginInput.value.trim() : '';
      var password = passInput ? passInput.value : '';
      if (!url) { note('Укажите адрес сервера', 'error'); return; }
      if (!username) { note('Укажите логин', 'error'); return; }
      if (password.length < 6) { note('Пароль — минимум 6 символов', 'error'); return; }
      var clean = url.replace(/\/+$/, '');
      var old = api.serverConfig();
      setButtonBusy(btn, true, mode === 'login' ? 'Входим…' : 'Создаём…');
      try {
        api.saveServerConfig({ url: clean });
        if (mode === 'login') {
          await api.serverLogin(username, password);
          toast('Сервер подключён, вход выполнен', 'success');
        } else {
          await api.serverRegister({ fullName: ctx.user.fullName, username: username, password: password });
          toast('Аккаунт создан на сервере', 'success');
        }
        setTimeout(function () { location.reload(); }, 500);
      } catch (err) {
        api.saveServerConfig({ url: old.url || clean });
        setButtonBusy(btn, false);
        note(err.message, 'error');
      }
    }

    var loginBtn = root.querySelector('#srvLogin');
    if (loginBtn) loginBtn.addEventListener('click', function () { connect('login', this); });
    var regBtn = root.querySelector('#srvRegister');
    if (regBtn) regBtn.addEventListener('click', function () { connect('register', this); });

    var syncBtn = root.querySelector('#srvSync');
    if (syncBtn) syncBtn.addEventListener('click', async function () {
      var btn = this;
      setButtonBusy(btn, true, 'Синхронизируем…');
      var res = await api.syncNow({ silent: true });
      setButtonBusy(btn, false);
      if (res && res.error) { toast(res.error, 'error', 4600); ctx.rerender(); return; }
      if (res && res.skipped) { toast(res.offline ? 'Нет интернета — изменения отправим позже' : 'Сервер не подключён', 'warn'); return; }
      toast('Готово: отправлено ' + (res.pushed || 0) + ', получено ' + (res.pulled || 0), 'success');
      ctx.rerender();
    });

    var auto = root.querySelector('#srvAuto');
    if (auto) auto.addEventListener('change', function () {
      api.saveServerConfig({ autoSync: this.checked });
      toast(this.checked ? 'Автосинхронизация включена' : 'Автосинхронизация выключена', 'info');
    });

    var off = root.querySelector('#srvOff');
    if (off) off.addEventListener('click', async function () {
      var ok = await confirmDialog({
        title: 'Отключить сервер?',
        message: 'Данные останутся на этом устройстве. Синхронизация прекратится, войти снова можно в любой момент.',
        confirmText: 'Отключить',
        danger: true
      });
      if (!ok) return;
      api.serverLogout();
      api.saveServerConfig({ url: '', user: null, lastSync: 0 });
      toast('Сервер отключён', 'info');
      ctx.rerender();
    });
  }

        '</div>' +
        '<div class="form-grid">' +
          '<div class="field"><label for="histDate">Дата, если её нет в тексте</label>' +
            '<input class="input" type="date" id="histDate" value="' + dayKey(new Date()) + '" max="' + dayKey(new Date()) + '">' +
            '<div class="hint">Для списка транзакций без даты</div></div>' +
          '<div class="field"><label for="histAvg">Средний чек, ' + APP_CONFIG.currency + '</label>' +

      onMount: function (el, close) {

        var previewEl = el.querySelector('#histPreview');
        var goBtn = el.querySelector('#histGo');

        function renderPreview() {
          var text = textEl.value.trim();
          if (!text) { parsed = null; previewEl.innerHTML = ''; goBtn.disabled = false; return; }

          if (looksLikeTransactions(text)) {
            var tx = parseTransactionsText(text, { date: dateEl.value || dayKey(new Date()) });
            parsed = { mode: 'transactions', list: tx.transactions, errors: tx.errors, revenue: tx.revenue, receipts: tx.receipts };
            var txRows = tx.transactions.map(function (t) {
              var itemsText = (t.items || []).map(function (i) { return i.name + ' ×' + i.qty; }).join(', ');
              return '<tr>' +
                '<td><span class="cell-main nowrap">' + fmtTime(t.at) + '</span></td>' +
                '<td><span class="small">' + esc(t.seller) + '</span></td>' +
                '<td><span class="small">' + esc(t.pointName || '—') + (t.pointId ? '' : ' <span class="badge warn">не найдена</span>') + '</span></td>' +
                '<td><span class="small">' + esc(itemsText || '—') + '</span></td>' +
                '<td>' + badge(paymentLabel(t.payment), paymentBadgeClass(t.payment)) + '</td>' +
                '<td class="text-right"><span class="cell-main money">' + fmtMoney(t.total) + '</span></td>' +
                '</tr>';
            }).join('');
            previewEl.innerHTML =
              '<div class="kpi-inline" style="margin:6px 0 12px">' +
                '<div class="kpi-mini"><div class="l">Транзакций</div><div class="v">' + tx.transactions.length + '</div></div>' +
                '<div class="kpi-mini"><div class="l">Выручка</div><div class="v">' + fmtMoney(tx.revenue) + '</div></div>' +
                '<div class="kpi-mini"><div class="l">Дата</div><div class="v" style="font-size:15px">' + fmtDate(parseDayKey(dateEl.value) || new Date()) + '</div></div>' +
              '</div>' +
              (tx.transactions.length
                ? '<div class="table-wrap" style="max-height:260px;overflow:auto"><table class="tbl"><thead><tr>' +
                    '<th>Время</th><th>Продавец</th><th>Точка</th><th>Товары</th><th>Оплата</th><th class="text-right">Сумма</th></tr></thead><tbody>' +
                    txRows + '</tbody></table></div>'
                : '<div class="tbl-empty">Не нашёл транзакций — проверьте формат</div>') +
              ((tx.errors || []).length
                ? '<div class="form-note warn" style="margin-top:10px">' + icon('alert', 15) + '<span>' + esc(tx.errors.slice(0, 6).join(' · ')) + '</span></div>'
                : '');
            goBtn.disabled = !tx.transactions.length;
            return;
          }

          parsed = { mode: 'days' };
          parsed = Object.assign(parsed, parseHistoryText(text, { avgCheck: parseAmount(avgEl.value) || 3000 }));
          var days = parsed.days || [];
          var rows = days.map(function (d) {
            return '<tr>' +
              '<td><span class="cell-main nowrap">' + fmtDate(d.date) + '</span></td>' +
              '<td class="text-right"><span class="cell-main money">' + fmtMoney(d.revenue) + '</span></td>' +
              '<td class="text-right"><span class="small">' + fmtMoney(d.cash) + '</span></td>' +
              '<td class="text-right"><span class="small">' + fmtMoney(d.qr) + '</span></td>' +
              '<td class="text-right"><span class="small">' + fmtNumber(d.count) + '</span></td>' +
              '</tr>';
          }).join('');
          previewEl.innerHTML =
            '<div class="kpi-inline" style="margin:6px 0 12px">' +
              '<div class="kpi-mini"><div class="l">Дней</div><div class="v">' + days.length + '</div></div>' +
              '<div class="kpi-mini"><div class="l">Выручка</div><div class="v">' + fmtMoney(parsed.revenue) + '</div></div>' +
              '<div class="kpi-mini"><div class="l">Чеков</div><div class="v">' + fmtNumber(parsed.receipts) + '</div></div>' +
            '</div>' +
            (days.length
              ? '<div class="table-wrap" style="max-height:240px;overflow:auto"><table class="tbl"><thead><tr>' +
                  '<th>Дата</th><th class="text-right">Выручка</th><th class="text-right">Наличные</th>' +
                  '<th class="text-right">Kaspi QR</th><th class="text-right">Чеков</th></tr></thead><tbody>' + rows + '</tbody></table></div>'
              : '<div class="tbl-empty">Не нашёл ни одной строки с датой и суммой</div>') +
            ((parsed.errors || []).length
              ? '<div class="form-note warn" style="margin-top:10px">' + icon('alert', 15) + '<span>' + esc(parsed.errors.slice(0, 6).join(' · ')) + '</span></div>'
              : '');
          goBtn.disabled = !days.length;
        }

        textEl.addEventListener('input', renderPreview);
        avgEl.addEventListener('change', renderPreview);
        dateEl.addEventListener('change', renderPreview);
        el.querySelector('[data-cancel]').addEventListener('click', close);
        goBtn.addEventListener('click', function () {
          if (!parsed) { toast('Нет данных для внесения', 'error'); return; }
          var replace = el.querySelector('#histReplace').checked;

          if (parsed.mode === 'transactions') {
            if (!parsed.list.length) { toast('Нет транзакций для внесения', 'error'); return; }
            var txRes = importTransactions(parsed.list, { actor: user, replace: replace });

            close();
            toast('Внесено ' + txRes.created + ' транзакций на ' + fmtMoney(txRes.revenue), 'success', 4600);
            ctx.rerender();
            return;
          }

          if (!parsed.days || !parsed.days.length) { toast('Нет строк для внесения', 'error'); return; }
          var res = importHistoryDays(parsed.days, { actor: user, replace: replace });
          if (res.error) { toast(res.error, 'error'); return; }
          close();
          toast('Внесено ' + res.created + ' записей на ' + fmtMoney(res.revenue) + ' за ' + parsed.days.length + ' дн.', 'success', 4600);
          ctx.rerender();
        });
      }
    });
  }
