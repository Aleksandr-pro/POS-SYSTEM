.point-card .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line-soft); }
.geo-link { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--info); font-weight: 600; }
.geo-link:hover { text-decoration: underline; }
.stock-toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.stock-toolbar .select { max-width: 260px; }
.qty-cell { cursor: pointer; position: relative; }
.qty-cell:hover .stock-qty { color: var(--brand-600, #4338ca); }
.qty-edit-hint { display: inline-flex; align-items: center; margin-left: 5px; color: var(--muted); opacity: .45; vertical-align: middle; }
.qty-cell:hover .qty-edit-hint { opacity: 1; }
.qty-inline { width: 92px; height: 34px; padding: 0 8px; text-align: center; font-weight: 700; }
.stock-qty { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 14px; }
.stock-qty.low { color: var(--warning); }
.stock-qty.zero { color: var(--danger); }
.stock-btns { display: inline-flex; gap: 3px; }
.history-list { display: flex; flex-direction: column; }
.history-row { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0; border-bottom: 1px dashed var(--line-soft); font-size: 12.5px; }
.history-row:last-child { border-bottom: 0; }
.history-row .d { width: 30px; height: 30px; border-radius: 9px; background: var(--bg-soft); display: flex; align-items: center; justify-content: center; flex: 0 0 auto; font-weight: 700; font-size: 11px; }
.history-row .d.plus { background: var(--success-soft); color: var(--success-600); }
.history-row .d.minus { background: var(--danger-soft); color: var(--danger-600); }
.history-row .tm { color: var(--muted-2); font-size: 11px; margin-top: 1px; }

/* ---------- Время ---------- */
.time-hero {
  border-radius: 20px; padding: 26px; color: #fff; position: relative; overflow: hidden;
  background:
    radial-gradient(600px 300px at 100% 0%, rgba(129,140,248,.4), transparent 60%),
    linear-gradient(135deg, #312e81, #4338ca 55%, #6d28d9);
  box-shadow: 0 20px 40px -18px rgba(55,48,163,.55);
}
.time-hero::after { content: ""; position: absolute; width: 260px; height: 260px; border: 1px solid rgba(255,255,255,.12); border-radius: 50%; right: -80px; bottom: -140px; }
.time-hero .lbl { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: rgba(255,255,255,.65); font-weight: 650; }
.time-hero .clock { font-size: 40px; font-weight: 800; letter-spacing: -.03em; margin-top: 2px; font-variant-numeric: tabular-nums; }
.time-hero .status { display: inline-flex; align-items: center; gap: 7px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.16); border-radius: 99px; padding: 5px 13px; font-size: 12.5px; font-weight: 600; margin-top: 12px; backdrop-filter: blur(6px); }
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: #6ce9a6; box-shadow: 0 0 0 4px rgba(108,233,166,.2); }
.status-dot.off { background: #fda29b; box-shadow: 0 0 0 4px rgba(253,162,155,.18); }
.status-dot.wait { background: #fec84b; box-shadow: 0 0 0 4px rgba(254,200,75,.18); }
.time-actions { display: flex; gap: 12px; margin-top: 22px; flex-wrap: wrap; position: relative; z-index: 1; }
.time-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 9px; height: 52px; padding: 0 22px;
  border-radius: 13px; border: 1px solid transparent; font-size: 14.5px; font-weight: 700; transition: all .15s;
}
.time-btn.arrive { background: #12b76a; color: #fff; box-shadow: 0 10px 22px -10px rgba(18,183,106,.9); }
.time-btn.arrive:hover { background: #0e9f5d; }
.time-btn.leave { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.34); color: #fff; backdrop-filter: blur(4px); }
.time-btn.leave:hover { background: rgba(239,68,68,.9); border-color: transparent; }
.time-btn[disabled] { opacity: .45; pointer-events: none; }
.time-geo { margin-top: 16px; font-size: 12px; color: rgba(255,255,255,.68); display: flex; align-items: center; gap: 6px; position: relative; z-index: 1; flex-wrap: wrap; }
.time-geo a { color: #c7d2fe; }
.time-geo .ok { color: #a6f4c5; }
.time-day { display: flex; flex-direction: column; }
.time-day-row { display: grid; grid-template-columns: 1fr auto auto; gap: 14px; align-items: center; padding: 13px 16px; border-bottom: 1px solid var(--line-soft); font-size: 13px; }
.time-day-row:last-child { border-bottom: 0; }
.time-day-row .dur { font-weight: 650; font-variant-numeric: tabular-nums; color: var(--primary-600); background: var(--primary-soft); padding: 3px 9px; border-radius: 99px; font-size: 11.5px; }
.time-day-row .io { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12.5px; }
.time-day-row .io b { color: var(--ink); font-weight: 650; }

/* ---------- Аналитика ---------- */
.report-grid { display: grid; grid-template-columns: 1.55fr 1fr; gap: 16px; }
.bar-list { display: flex; flex-direction: column; gap: 13px; }
.bar-row .line { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12.5px; margin-bottom: 5px; }
.bar-row .nm { font-weight: 550; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-row .val { font-weight: 650; font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted); }
.bar-track { height: 7px; background: var(--bg-soft); border-radius: 99px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, #818cf8, var(--primary)); transition: width .4s ease; }
.bar-fill.green { background: linear-gradient(90deg, #6ce9a6, var(--success)); }
.bar-fill.red { background: linear-gradient(90deg, #fda29b, var(--danger)); }
.bar-fill.amber { background: linear-gradient(90deg, #fec84b, var(--warning)); }
.kpi-inline { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.kpi-mini { background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: 12px; padding: 12px 13px; }
.kpi-mini .l { font-size: 11.5px; color: var(--muted); }
.kpi-mini .v { font-size: 17px; font-weight: 750; margin-top: 2px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }

/* ---------- Справка ---------- */
.help-layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 22px; align-items: start; }
.help-nav { position: sticky; top: 86px; display: flex; flex-direction: column; gap: 2px; }
.help-nav a { display: flex; align-items: center; gap: 8px; padding: 8px 11px; border-radius: 9px; font-size: 12.8px; font-weight: 550; color: var(--ink-2); }
.help-nav a:hover { background: var(--surface); text-decoration: none; color: var(--primary-600); }
.help-nav .grp { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted-2); font-weight: 650; padding: 14px 11px 5px; }
.help-hero { border-radius: 20px; padding: 26px; color: #fff; background: linear-gradient(130deg, #3730a3, #6d28d9); position: relative; overflow: hidden; }
.help-hero::after { content: ""; position: absolute; width: 320px; height: 320px; border-radius: 50%; border: 1px solid rgba(255,255,255,.14); right: -100px; top: -140px; }
.help-hero h2 { font-size: 22px; font-weight: 800; letter-spacing: -.02em; position: relative; z-index: 1; }
.help-hero p { font-size: 13px; color: rgba(255,255,255,.75); margin-top: 6px; max-width: 560px; position: relative; z-index: 1; }
.help-hero .badge { background: rgba(255,255,255,.14); color: #e0e7ff; margin-bottom: 12px; }
.help-section { scroll-margin-top: 80px; }
.help-section h3 { font-size: 17px; font-weight: 750; letter-spacing: -.015em; display: flex; align-items: center; gap: 9px; }
.help-section h3 .ic { width: 32px; height: 32px; border-radius: 9px; background: var(--primary-soft); color: var(--primary); display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
.help-section h4 { font-size: 13.5px; font-weight: 700; margin-bottom: 7px; }
.help-card { padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
.help-card > p { font-size: 13px; color: var(--ink-2); line-height: 1.55; }
.help-list { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 7px; font-size: 13px; color: var(--ink-2); }
.help-list li { display: flex; gap: 8px; align-items: flex-start; line-height: 1.45; }
.help-list li .b { color: var(--primary); margin-top: 1px; flex: 0 0 auto; }
.help-list li b { color: var(--ink); }
.steps { counter-reset: st; display: flex; flex-direction: column; gap: 12px; }
.step { display: flex; gap: 12px; align-items: flex-start; }
.step::before { counter-increment: st; content: counter(st); width: 24px; height: 24px; border-radius: 8px; background: var(--primary-soft); color: var(--primary-600); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; margin-top: 1px; }
.step .t { font-size: 13px; line-height: 1.5; }
.step .t b { font-weight: 650; }
.callout { display: flex; gap: 9px; border-radius: 12px; padding: 11px 13px; font-size: 12.6px; line-height: 1.5; align-items: flex-start; }
.callout.info { background: var(--info-soft); color: #026aa2; }
.callout.warn { background: var(--warning-soft); color: #93370d; }
.callout.success { background: var(--success-soft); color: #05603a; }
.callout .icon { margin-top: 1px; }
.role-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.role-tile { border: 1px solid var(--line); border-radius: 13px; padding: 14px; display: flex; flex-direction: column; gap: 8px; background: var(--surface-2); }
.role-tile .top { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; }
.role-tile ul { margin: 0; padding-left: 16px; font-size: 11.8px; color: var(--muted); display: flex; flex-direction: column; gap: 3px; line-height: 1.4; }
.contacts-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.contact-tile { display: flex; flex-direction: column; gap: 9px; padding: 16px; border: 1px solid var(--line); border-radius: 13px; background: var(--surface); transition: all .15s; }
.contact-tile:hover { border-color: #c7d2fe; box-shadow: var(--shadow-sm); text-decoration: none; transform: translateY(-1px); }
.contact-tile .ic { width: 38px; height: 38px; border-radius: 11px; display: flex; align-items: center; justify-content: center; background: var(--primary-soft); color: var(--primary); }
.contact-tile .t { font-size: 13px; font-weight: 650; color: var(--ink); }
.contact-tile .d { font-size: 11.5px; color: var(--muted); word-break: break-word; }

/* ---------- Настройки ---------- */
.settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
.settings-section { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.settings-section > h3 { font-size: 15px; font-weight: 750; display: flex; align-items: center; gap: 8px; }
.settings-section .desc { font-size: 12.5px; color: var(--muted); margin-top: -8px; }
.profile-banner { display: flex; align-items: center; gap: 14px; padding: 18px 20px; }
.profile-banner .nm { font-size: 16px; font-weight: 750; }
.profile-banner .rl { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.danger-zone { border: 1px solid #fecdca; border-radius: 15px; padding: 16px; background: #fffbfa; }
.danger-zone h4 { color: var(--danger-600); font-size: 13.5px; margin-bottom: 4px; }
.danger-zone p { font-size: 12px; color: #912018; margin-bottom: 12px; line-height: 1.45; }
.about-list { display: flex; flex-direction: column; gap: 0; font-size: 12.8px; }
.about-row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line-soft); }
.about-row:last-child { border-bottom: 0; }
.about-row .k { color: var(--muted); }
.about-row .v { font-weight: 600; text-align: right; }

/* ---------- Экспорт / FAB ---------- */
.fab {
  position: fixed; right: 26px; bottom: 26px; z-index: 35; display: inline-flex; align-items: center; gap: 8px;
  height: 46px; padding: 0 17px; border-radius: 99px; border: 1px solid rgba(255,255,255,.2);
  background: linear-gradient(180deg, #5b54ea, var(--primary)); color: #fff; font-weight: 650; font-size: 13px;
  box-shadow: 0 14px 28px -10px rgba(67,56,202,.6), inset 0 1px 0 rgba(255,255,255,.2);
  transition: transform .15s, box-shadow .15s;
}
.fab:hover { transform: translateY(-2px); box-shadow: 0 18px 32px -10px rgba(67,56,202,.66); }
.fab:active { transform: translateY(0); }
.fab .kbd { font-size: 10.5px; background: rgba(255,255,255,.18); border-radius: 5px; padding: 1px 5px; }
.add-fab {
  position: fixed; right: 26px; bottom: 26px; z-index: 35; width: 54px; height: 54px; border-radius: 50%;
  border: 0; background: linear-gradient(180deg, #5b54ea, var(--primary)); color: #fff; display: none;
  align-items: center; justify-content: center; box-shadow: 0 14px 28px -10px rgba(67,56,202,.6);
}

/* ---------- Мобильная навигация ---------- */
.bottomnav {
  display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 45;
  background: var(--nav-bg); backdrop-filter: blur(14px); border-top: 1px solid var(--line);
  padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
}
.bottomnav .bn-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; border: 0; background: none;
  color: var(--muted); font-size: 10px; font-weight: 600; padding: 6px 2px 4px; border-radius: 10px;
  position: relative;
}
.bottomnav .bn-item.active { color: var(--primary); }
.bottomnav .bn-item .icon { width: 22px; height: 22px; }
.bottomnav .bn-item .tail { position: absolute; top: 2px; right: calc(50% - 17px); width: 7px; height: 7px; border-radius: 50%; background: var(--danger); border: 1.5px solid #fff; }
.nav-overlay { display: none; position: fixed; inset: 0; background: rgba(16,24,40,.45); z-index: 39; backdrop-filter: blur(1px); animation: overlayIn .15s ease; }

/* ---------- Адаптив ---------- */
@media (max-width: 1180px) {
  .dash-grid { grid-template-columns: 1.4fr 1fr; }
  .cash-layout { grid-template-columns: minmax(0,1fr) 340px; }
  .help-layout { grid-template-columns: 210px minmax(0,1fr); }
}
@media (max-width: 1020px) {
  .sidebar { transform: translateX(-100%); transition: transform .24s cubic-bezier(.2,.8,.3,1); width: 280px; box-shadow: var(--shadow-lg); }
  .sidebar.open { transform: none; }
  .sidebar.open ~ .nav-overlay, .nav-overlay.show { display: block; }
  .main { margin-left: 0; }
  .menu-btn { display: inline-flex; }
  .bottomnav { display: flex; }
  .page { padding: 20px 18px 130px; }
  .topbar { padding: 0 16px; height: 58px; }
  .topbar-user { display: none; }
  .fab { bottom: 92px; right: 18px; }
  .add-fab { display: flex; bottom: 92px; right: 18px; }
  .grid-4 { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .dash-grid { grid-template-columns: 1fr; }
  .cash-layout { grid-template-columns: 1fr; }
  .cart { position: static; max-height: none; }
  .cart-items { max-height: none; }
  .cart.mobile-hidden { display: none; }
  .report-grid { grid-template-columns: 1fr; }
  .help-layout { grid-template-columns: 1fr; }
  .help-nav { display: none; }
  .settings-grid { grid-template-columns: 1fr; }
  .modal-overlay { padding: 0; align-items: flex-end; }
  .modal { max-width: none; border-radius: 22px 22px 0 0; max-height: 92vh; animation: sheetIn .25s cubic-bezier(.2,.8,.3,1) both; }
  .modal-sm, .modal-lg { max-width: none; }
  .modal-foot { padding-bottom: calc(18px + env(safe-area-inset-bottom)); }
  @keyframes sheetIn { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
  .role-grid { grid-template-columns: 1fr; }
  .contacts-grid { grid-template-columns: 1fr; }
}
@media (min-width: 1021px) {
  .mobile-only { display: none !important; }
}
@media (max-width: 760px) {
  .auth { grid-template-columns: 1fr; }
  .auth-art { display: none; }
  .auth-panel { padding: 28px 20px 44px; align-items: flex-start; background: var(--surface); }
  .auth-card { max-width: 440px; margin: 0 auto; }
  .auth-card > .brand-mobile { display: flex; align-items: center; gap: 10px; margin-bottom: 26px; }
  .auth-card > .brand-mobile .nm { font-size: 15px; font-weight: 750; }
  .auth-card > .brand-mobile .tg { font-size: 10.5px; color: var(--muted); }
  .page-head h1, .greet h1 { font-size: 21px; }
  .stat-value { font-size: 21px; }
  .stat-card { padding: 14px; gap: 9px; }
  .stat-icon { width: 36px; height: 36px; border-radius: 10px; }
  .stat-label { font-size: 12px; }
  .card-pad { padding: 16px; }
  .card-head { padding: 15px 16px 0; }
  .card-body { padding: 13px 16px 16px; }
  .form-grid { grid-template-columns: 1fr; }
  .cash-cols { grid-template-columns: 1fr; }
  .product-grid { grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; }
  .prod-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
  .time-hero { padding: 20px; }
  .time-hero .clock { font-size: 32px; }
  .time-actions { gap: 9px; }
  .time-btn { flex: 1; min-width: 140px; height: 48px; }
  .time-day-row { grid-template-columns: 1fr auto; }
  .time-day-row .io { grid-column: 1 / -1; }
  .fab { padding: 0 14px; height: 42px; font-size: 12.5px; }
  .toast-wrap { top: 12px; }
  .page { padding: 16px 14px 132px; }
  .topbar-date { display: none; }
  .tbl thead th, .tbl tbody td { padding: 10px 10px; }
  .modal-head { padding: 16px 18px 0; }
  .modal-body { padding: 15px 18px; }
  .modal-foot { padding: 0 18px calc(16px + env(safe-area-inset-bottom)); flex-wrap: wrap; }
  .modal-foot .btn { flex: 1; }
  .donut-wrap { flex-wrap: wrap; }
  .point-checks { grid-template-columns: 1fr; }
  .profile-banner { flex-wrap: wrap; }
}
@media (max-width: 420px) {
  .grid-4 { gap: 10px; }
  .stat-value { font-size: 19px; }
  .stat-icon { display: none; }
  .stat-top { justify-content: flex-end; }
  .segmented button { padding: 7px 10px; font-size: 12.3px; }
  .product-grid { grid-template-columns: 1fr 1fr; }
  .prod-grid { grid-template-columns: 1fr 1fr; }
  .prod-card .nm { font-size: 13px; }
  .prod-card .price { font-size: 15px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ---------- Дополнения ---------- */
.badge.neutral { background: var(--surface-3); color: var(--muted); }
.badge.success { background: var(--success-soft); color: var(--success-600); }
.badge.warn { background: var(--warning-soft); color: #b54708; }
.badge.danger { background: var(--danger-soft); color: var(--danger-600); }
.spinner {
  width: 15px; height: 15px; border-radius: 50%; display: inline-block; margin-right: 2px;
  border: 2px solid rgba(255,255,255,.38); border-top-color: #fff; animation: spin .7s linear infinite;
  vertical-align: -2px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.idx { display: inline-flex; width: 22px; height: 22px; align-items: center; justify-content: center; border-radius: 7px; font-size: 11px; font-weight: 700; padding: 0; }
.side-user { cursor: default; }
.side-user .nm { max-width: 128px; }
@media (max-width: 760px) {
  .hide-sm { display: none !important; }
}
@media (max-width: 1020px) {
  .grid-2, .report-grid, .dash-grid { grid-template-columns: 1fr !important; }
  .time-day-row { grid-template-columns: 1fr auto !important; }
  .time-day-row .io { grid-column: 1 / -1; }
}

/* ---------- Исправления раскладки изображений ---------- */
.product-card { align-items: stretch; }
.product-photo { width: 100%; flex: 0 0 auto; }
.product-photo .fallback { position: absolute; inset: 0; }
.product-photo img { position: absolute; inset: 0; }
.prod-card .photo { width: 100%; flex: 0 0 auto; }
.prod-card .photo .fallback, .prod-card .photo img { position: absolute; inset: 0; }
.cart-item .thumb { position: relative; }
@media (max-width: 1280px) {
  .cash-cols { grid-template-columns: 1fr; }
}

/* ---------- Топ товаров: аккуратная сетка ---------- */
.top-prod-row {
  display: grid;
  grid-template-columns: 22px minmax(0, 1fr) auto 54px;
  align-items: center;
  column-gap: 9px;
  font-size: 13px;
}
.top-prod-row .nm { min-width: 0; }
.top-prod-row .sum { text-align: right; min-width: 0; font-size: 12.5px; }
.donut-wrap canvas { max-width: 100%; }

/* ---------- Мобильные корректировки ---------- */
@media (max-width: 1020px) {
  .toast-wrap { top: calc(58px + env(safe-area-inset-top)); }
  .add-fab { display: flex; }
  /* экспорт на телефоне — круглая кнопка, чтобы функция осталась доступной */
  .fab {
    bottom: 92px; right: 18px; width: 52px; height: 52px; padding: 0; border-radius: 50%;
    font-size: 0; gap: 0; justify-content: center;
  }
  .fab .icon { width: 21px; height: 21px; }
  .fab .kbd { display: none; }
  .modal-foot { position: sticky; bottom: 0; background: var(--surface); padding-top: 12px; z-index: 2; }
}
@media (max-width: 760px) {
  .cart { scroll-margin-top: 70px; }
  .cart.flash { animation: cartFlash .9s ease; }
  @keyframes cartFlash { 0% { box-shadow: 0 0 0 0 rgba(79,70,229,.45); } 100% { box-shadow: 0 0 0 14px rgba(79,70,229,0); } }
  .top-prod-row { grid-template-columns: 22px minmax(0, 1fr) auto 46px; }
}

/* ============================================================
   ТЁМНАЯ ТЕМА
   ============================================================ */
html[data-theme="dark"] { color-scheme: dark; }
html[data-theme="dark"] {
  --bg: #0a0e18;
  --bg-soft: #182034;
  --card: #111827;
  --surface: #141c2b;
  --surface-2: #182034;
  --surface-3: #1f2941;
  --hover: #1b2437;
  --ink: #eef1f8;
  --ink-2: #c6cedd;
  --muted: #94a0b6;
  --muted-2: #6d7b93;
  --line: #26314a;
  --line-soft: #1e283c;
  --line-strong: #34405e;
  --primary: #6d68f0;
  --primary-600: #7c77f5;
  --primary-700: #b3b0ff;
  --primary-soft: #1e2340;
  --primary-ring: rgba(124, 119, 245, .28);
  --success: #32d583;
  --success-600: #6ce9a6;
  --success-soft: #0b2a1e;
  --danger: #f97066;
  --danger-600: #fda29b;
  --danger-soft: #2c1418;
  --warning: #fdb022;
  --warning-soft: #2b2110;
  --info: #36bffa;
  --info-soft: #0d2637;
  --purple: #a48afb;
  --purple-soft: #201a38;
  --pink: #f670c7;
  --pink-soft: #2b1424;
  --topbar-bg: rgba(10, 14, 24, .82);
  --nav-bg: rgba(17, 24, 39, .96);
  --chart-grid: #232d44;
  --chart-axis: #7b88a1;
  --chart-text: #a4b0c6;
  --chart-strong: #eef1f8;
  --scroll-thumb: #2f3a55;
  --scroll-thumb-hover: #46557a;
  --shadow-xs: 0 1px 2px rgba(0, 0, 0, .5);
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, .55), 0 1px 2px rgba(0, 0, 0, .4);
  --shadow: 0 4px 10px -2px rgba(0, 0, 0, .5), 0 14px 30px -10px rgba(0, 0, 0, .65);
  --shadow-lg: 0 32px 60px -18px rgba(0, 0, 0, .8);
}
html[data-theme="dark"] .card { box-shadow: 0 1px 2px rgba(0,0,0,.45); }
html[data-theme="dark"] .card-hover:hover { border-color: var(--line-strong); box-shadow: var(--shadow); }
html[data-theme="dark"] .modal-overlay { background: rgba(3, 6, 14, .72); }
html[data-theme="dark"] .modal { border: 1px solid var(--line); }
html[data-theme="dark"] .modal-foot { background: var(--surface); border-top: 1px solid var(--line-soft); }
html[data-theme="dark"] .tbl tbody tr:hover { background: var(--hover); }
html[data-theme="dark"] .tbl thead th { background: var(--surface-2); color: var(--muted); }
html[data-theme="dark"] .btn-secondary:hover { background: var(--hover); }
html[data-theme="dark"] .icon-btn:hover { background: var(--surface-3); }
html[data-theme="dark"] .side-item:hover { background: var(--hover); }
html[data-theme="dark"] .side-item.active { color: var(--primary-700); }
html[data-theme="dark"] .badge-admin { color: var(--primary-700); background: var(--primary-soft); }
html[data-theme="dark"] .badge-dev { color: #c4b5fd; background: var(--purple-soft); }
html[data-theme="dark"] .badge-seller { color: #7dd3fc; background: var(--info-soft); }
html[data-theme="dark"] .badge-success, html[data-theme="dark"] .badge-cash { color: #6ce9a6; }
html[data-theme="dark"] .badge-warn { color: #fdb022; }
html[data-theme="dark"] .badge-danger { color: #fda29b; }
html[data-theme="dark"] .badge-qr { color: #b3b0ff; background: var(--primary-soft); }
html[data-theme="dark"] .badge-mixed { color: #f670c7; background: var(--pink-soft); }
html[data-theme="dark"] .badge.neutral { background: var(--surface-3); color: var(--muted); }
html[data-theme="dark"] .badge.success { color: #6ce9a6; }
html[data-theme="dark"] .badge.warn { color: #fdb022; }
html[data-theme="dark"] .badge.danger { color: #fda29b; }
html[data-theme="dark"] .form-note.info, html[data-theme="dark"] .callout.info { color: #7dd3fc; }
html[data-theme="dark"] .form-note.warn, html[data-theme="dark"] .callout.warn { color: #fdb022; }
html[data-theme="dark"] .form-note.success, html[data-theme="dark"] .callout.success { color: #6ce9a6; }
html[data-theme="dark"] .geo-link { color: #7dd3fc; }
html[data-theme="dark"] .stock.low { color: #fdb022; }
html[data-theme="dark"] .stock.none { background: var(--surface-3); color: var(--muted-2); }
html[data-theme="dark"] .receipt-drop, html[data-theme="dark"] .photo-picker { border-color: var(--line-strong); }
html[data-theme="dark"] .receipt-drop:hover, html[data-theme="dark"] .photo-picker:hover { border-color: var(--primary); }
html[data-theme="dark"] .product-card .add-hint { background: rgba(20, 28, 43, .92); color: var(--ink); }
html[data-theme="dark"] .prod-card .photo-actions .icon-btn { background: rgba(20, 28, 43, .94); color: var(--ink); }
html[data-theme="dark"] .danger-zone { background: rgba(44, 20, 24, .5); border-color: #4a2028; }
html[data-theme="dark"] .danger-zone h4 { color: #fda29b; }
html[data-theme="dark"] .danger-zone p { color: #f9b7b0; }
html[data-theme="dark"] .auth-panel { background: var(--bg); }
html[data-theme="dark"] .auth-error { border-color: #4a2028; }
html[data-theme="dark"] .input.invalid { box-shadow: 0 0 0 4px rgba(249, 112, 102, .18); }
html[data-theme="dark"] .pw-toggle:hover { background: var(--surface-3); }
html[data-theme="dark"] .segmented { background: var(--surface-3); }
html[data-theme="dark"] .segmented button.active { background: var(--surface); color: var(--ink); }
html[data-theme="dark"] .pay-tabs { background: var(--surface-3); }
html[data-theme="dark"] .pay-tabs button.active { background: var(--surface); }
html[data-theme="dark"] .product-photo, html[data-theme="dark"] .prod-card .photo { background: var(--surface-3); }
html[data-theme="dark"] .cart-item .thumb { border: 1px solid rgba(255,255,255,.08); }
html[data-theme="dark"] .time-hero { box-shadow: 0 20px 40px -18px rgba(0,0,0,.8); }
html[data-theme="dark"] .toast { border: 1px solid rgba(255,255,255,.08); }
html[data-theme="dark"] .tabs { border-bottom-color: var(--line); }
html[data-theme="dark"] .help-nav.card { background: var(--surface); }
html[data-theme="dark"] .role-tile { background: var(--surface-2); }
html[data-theme="dark"] .kpi-mini { background: var(--surface-2); }
html[data-theme="dark"] .empty .art { background: var(--surface-3); }
html[data-theme="dark"] .donut-wrap canvas { filter: none; }
html[data-theme="dark"] .avatar { box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); }
html[data-theme="dark"] .auth-art { box-shadow: inset -1px 0 0 rgba(255,255,255,.04); }
html[data-theme="dark"] .bottomnav .bn-item .tail { border-color: var(--surface); }
html[data-theme="dark"] .modal-head .sub, html[data-theme="dark"] .card-head .sub { color: var(--muted); }

/* Переключатель темы */
.theme-toggle {
  width: 36px; height: 36px; border-radius: 11px; border: 1px solid var(--line);
  background: var(--surface); color: var(--muted); display: inline-flex;
  align-items: center; justify-content: center; box-shadow: var(--shadow-xs);
  transition: color .15s, background .15s, border-color .15s;
}
.theme-toggle:hover { color: var(--ink); background: var(--hover); }
.theme-toggle:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--primary-ring); }
.auth-theme-toggle { position: absolute; top: 18px; right: 20px; z-index: 5; }
.theme-seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.theme-option {
  border: 1px solid var(--line); border-radius: 12px; padding: 12px 10px; background: var(--surface);
  display: flex; flex-direction: column; align-items: center; gap: 7px; font-size: 12.5px;
  font-weight: 600; color: var(--muted); transition: all .15s;
}
.theme-option:hover { border-color: var(--line-strong); background: var(--hover); }
.theme-option.active { border-color: var(--primary); background: var(--primary-soft); color: var(--primary-700); box-shadow: 0 0 0 1px var(--primary) inset; }
.theme-option .preview {
  width: 100%; height: 46px; border-radius: 8px; border: 1px solid var(--line);
  overflow: hidden; position: relative; display: flex;
}
.theme-option .preview .bars { flex: 1; padding: 7px 6px; display: flex; flex-direction: column; gap: 4px; }
.theme-option .preview .bars i { display: block; height: 5px; border-radius: 3px; background: #d7dce8; }
.theme-option .preview .bars i:first-child { width: 60%; background: #6d68f0; }
.theme-option .preview .side { width: 26%; background: #f1f3f9; border-right: 1px solid #e4e7ec; }
.theme-option[data-preview="dark"] .preview { background: #111827; border-color: #26314a; }
.theme-option[data-preview="dark"] .preview .bars i { background: #2b3650; }
.theme-option[data-preview="dark"] .preview .bars i:first-child { background: #7c77f5; }
.theme-option[data-preview="dark"] .preview .side { background: #0d1420; border-color: #26314a; }
.theme-option[data-preview="system"] .preview .half-dark { flex: 1; background: #111827; padding: 7px 6px; display: flex; flex-direction: column; gap: 4px; }
.theme-option[data-preview="system"] .preview .half-dark i { display: block; height: 5px; border-radius: 3px; background: #2b3650; }
.theme-option[data-preview="system"] .preview .half-dark i:first-child { width: 60%; background: #7c77f5; }

@media (max-width: 1020px) {
  .theme-toggle { display: none; }
  .auth-theme-toggle { display: inline-flex; }
}

/* Тёмная тема: активный чип категории (иначе белый на белом) */
html[data-theme="dark"] .chip { background: var(--surface); }
html[data-theme="dark"] .chip:hover { background: var(--hover); }
html[data-theme="dark"] .chip.active {
  background: linear-gradient(180deg, #7c77f5, #5f59e8);
  border-color: #7c77f5;
  color: #fff;
  box-shadow: 0 2px 8px rgba(124,119,245,.35);
}
html[data-theme="dark"] .tabs .count { background: var(--surface-3); }
html[data-theme="dark"] .tabs button.active .count { background: var(--primary-soft); color: var(--primary-700); }

/* Текущая роль в справке */
.role-tile-current { border-color: #c7d2fe; background: #eef2ff; }
html[data-theme="dark"] .role-tile-current { border-color: var(--primary); background: var(--primary-soft); }

/* индикатор синхронизации в шапке */
.sync-pill {
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  height: 38px; min-width: 38px; padding: 0 9px; border-radius: 11px;
  border: 1px solid var(--border); background: var(--surface);
  color: var(--muted); font-size: 12px; font-weight: 700; cursor: pointer;
  transition: background .15s, color .15s, border-color .15s;
}
.sync-pill:hover { background: var(--surface-3); color: var(--text); }
.sync-pill.ok { color: var(--success-600); border-color: var(--success-soft); }
.sync-pill.pending { color: var(--warning-600, #b54708); background: var(--warning-soft); border-color: transparent; }
.sync-pill.error { color: var(--danger-600); border-color: var(--danger-soft); }
.sync-pill .cnt { line-height: 1; }
.sync-pill.busy { opacity: .6; }
.sync-pill.busy svg { animation: spin 1s linear infinite; }
html[data-theme="dark"] .sync-pill.ok { color: #6ee7b7; }
html[data-theme="dark"] .sync-pill.pending { color: #fbbf24; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (max-width: 640px) {
  #syncPill { height: 34px; min-width: 34px; padding: 0 7px; }
}

/* полоса «сервер» на экранах входа */
.auth-server {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  margin-top: 14px; padding: 9px 11px; border-radius: 11px;
  background: var(--surface-2); border: 1px solid var(--border);
  font-size: 12px;
}
.auth-server .badge { flex: none; }
.auth-server .link-btn { margin-left: auto; }

/* разбивка смешанной оплаты в отчётах */
.donut-legend .row.sub { font-size: 11.5px; }
.donut-legend .row.sub .nm { color: var(--muted); }
.donut-legend .row.sub .val { font-weight: 550; color: var(--ink-2); }
.pay-split { display: flex; flex-direction: column; gap: 4px; padding: 6px 0 2px 2px; border-left: 2px solid #ee46bc33; margin-left: 3px; }
.pay-totals { border-top: 1px dashed var(--border); margin-top: 8px; padding-top: 8px; display: flex; flex-direction: column; gap: 6px; }
.pay-totals .row .nm { color: var(--ink-2); font-weight: 600; }
.pay-totals .row .val { font-weight: 750; }

/* переключатель точки в шапке */
.point-switch {
  height: 38px; width: auto; min-width: 130px; max-width: 190px;
  font-size: 12.5px; font-weight: 600; padding-right: 28px;
}
@media (max-width: 640px) {
  .point-switch { height: 34px; min-width: 96px; max-width: 128px; font-size: 12px; }
}
/* список точек в карточке пользователя */
.point-checks { display: flex; flex-wrap: wrap; gap: 8px 16px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 11px; background: var(--surface-2); }
.point-checks .check { margin: 0; }

/* разбивка оплат в кассе за сегодня */
.cash-split { border-top: 1px dashed var(--border); margin: 0 20px 16px; padding-top: 12px; display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; }
.cash-split .row { display: flex; justify-content: space-between; gap: 12px; }
.cash-split .row .nm { color: var(--muted); }
.cash-split .row .val { font-weight: 650; font-variant-numeric: tabular-nums; }
.cash-split .row.sub { font-size: 11.5px; }
.cash-split .row.sub .nm { padding-left: 10px; }
.cash-split .row.total { border-top: 1px solid var(--border); padding-top: 6px; margin-top: 2px; font-weight: 700; }
.cash-split .row.total .nm { color: var(--ink-2); font-weight: 650; }

/* итоги по оплатам в отчётах */
.pay-total-box { display: flex; flex-direction: column; gap: 9px; margin-top: 4px; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); }
.pay-total-box .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 13px; }
.pay-total-box .row .nm { color: var(--muted); }
.pay-total-box .row .val { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pay-total-box .row.total { border-top: 1px solid var(--border); padding-top: 9px; }
.pay-total-box .row.total .nm { color: var(--ink-2); font-weight: 650; }
.pay-total-box .row.total .val { font-size: 14.5px; font-weight: 800; }

@media (max-width: 640px) {
  .topbar .topbar-crumb { display: none; }
  .topbar-left > div { min-width: 0; }
}

/* ---------- Касса: допуск продавца, экраны блокировки ---------- */
.shift-strip { display: flex; gap: 18px; flex-wrap: wrap; padding: 12px 16px; margin-bottom: 14px; align-items: center; }
.shift-item { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.shift-lbl { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
.shift-val { font-size: 13px; font-weight: 600; }
.gate-card { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 40px 24px; gap: 12px; }
.gate-card h2 { margin: 0; font-size: 24px; letter-spacing: -.01em; }
.gate-icon { width: 74px; height: 74px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #fff; }
.gate-icon.night { background: linear-gradient(135deg, #475569, #1e293b); }
.gate-icon.arrive { background: linear-gradient(135deg, #10b981, #059669); }
.gate-icon.check { background: linear-gradient(135deg, #6366f1, #4338ca); }
.gate-text { max-width: 480px; color: var(--muted); font-size: 14px; line-height: 1.6; }
.gate-timer { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.gate-note { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); max-width: 520px; }
.btn-lg { height: 48px; padding: 0 24px; font-size: 15px; }
.check-qty { width: 84px; height: 34px; padding: 0 8px; text-align: center; }
.tbl tr.row-diff td { background: color-mix(in srgb, var(--warning) 10%, transparent); }
@media (max-width: 640px) {
  .shift-strip { gap: 10px; }
  .shift-item { flex: 1 1 100%; justify-content: space-between; }
}

/* ---------- Сверка склада: две кнопки ---------- */
.check-card { margin-bottom: 16px; padding: 18px 20px; }
.check-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.check-card-head h3 { margin: 0 0 3px; font-size: 16px; }
.check-q { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
.check-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.check-actions .btn { flex: 1 1 220px; }
.check-time { margin-top: 10px; font-size: 12px; color: var(--muted); }
.check-result { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 0 4px; text-align: center; }
.check-result-icon { width: 58px; height: 58px; border-radius: 18px; display: flex; align-items: center; justify-content: center; color: #fff; }
.check-result-icon.ok { background: linear-gradient(135deg, #10b981, #059669); }
.check-result-icon.warn { background: linear-gradient(135deg, #f79009, #dc6803); }
.check-result-text { font-size: 18px; font-weight: 700; }
@media (max-width: 640px) {
  .check-actions { flex-direction: column; }
  .check-actions .btn { flex: 1 1 auto; width: 100%; }
}

/* ============================================================
   Компьютерная версия (ширина ≥ 1021px)
   ============================================================ */
.topbar-search { display: none; }
.sidebar-collapse { display: none; }

@media (min-width: 1021px) {
  .page { max-width: 1540px; padding: 30px 36px 88px; }
  .page-head { margin-bottom: 24px; }
  .page-head h1, .greet h1 { font-size: 27px; letter-spacing: -.03em; }
  .page-head .sub { font-size: 13.5px; }
  .card { border-radius: 16px; }
  .grid-4 { gap: 18px; }
  .stat-card { padding: 20px; gap: 14px; }
  .stat-value { font-size: 27px; }
  .stat-label { font-size: 13px; }
  .tbl { font-size: 13.5px; }
  .tbl thead th { position: sticky; top: 68px; z-index: 3; padding: 12px 14px; }
  .tbl tbody td { padding: 11px 14px; }
  .tbl tbody tr { transition: background .12s ease; }
  .card-body .table-wrap { border-radius: 0 0 16px 16px; }
  .topbar { height: 68px; padding: 0 36px; }
  .topbar-title { font-size: 15px; }
  .topbar-right { gap: 12px; }
  .sidebar .side-item { padding: 10px 12px; }

  /* поиск в шапке */
  .topbar-search {
    display: inline-flex; align-items: center; gap: 9px; width: 300px; height: 38px;
    padding: 0 11px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--surface); color: var(--muted); font-size: 13px; cursor: text;
    transition: border-color .14s, box-shadow .14s, background .14s;
  }
  .topbar-search:hover { border-color: var(--line-strong); background: var(--surface-2); }
  .topbar-search .kbd-hint {
    margin-left: auto; display: inline-flex; gap: 3px; font-size: 11px; color: var(--muted-2);
    background: var(--surface-3); border: 1px solid var(--line); border-radius: 6px; padding: 1px 5px;
  }

  /* сворачивание сайдбара */
  .sidebar-collapse {
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; margin-left: auto; border: 1px solid var(--line);
    border-radius: 8px; background: var(--surface); color: var(--muted);
  }
  .sidebar-collapse:hover { color: var(--ink); background: var(--surface-2); }
  .sidebar-collapse .icon { transition: transform .2s ease; }

  body.side-collapsed .sidebar { width: 76px; }
  body.side-collapsed .main { margin-left: 76px; }
  body.side-collapsed .sidebar-brand { padding: 18px 0 40px; justify-content: center; position: relative; }
  body.side-collapsed .sidebar { overflow: visible; }
  body.side-collapsed .sidebar-brand > div:not(.logo-mark),
  body.side-collapsed .side-label,
  body.side-collapsed .side-item > span,
  body.side-collapsed .side-user > div,
  body.side-collapsed .side-user .logout { display: none; }
  body.side-collapsed .sidebar-collapse {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: 6px;
    width: 34px; height: 24px; border-radius: 99px; z-index: 2;
  }
  body.side-collapsed .sidebar-collapse .icon { transform: rotate(180deg); width: 14px; height: 14px; }
  body.side-collapsed .side-nav { padding: 10px 10px 12px; }
  body.side-collapsed .side-item { justify-content: center; padding: 12px 0; }
  body.side-collapsed .side-item .tail { position: absolute; top: 4px; right: 8px; margin: 0; padding: 0 4px; font-size: 9.5px; }
  body.side-collapsed .side-foot { padding: 10px 8px; }
  body.side-collapsed .side-user { justify-content: center; padding: 4px; }

  /* экспорт переезжает в шапку страницы */
  .fab-inline, .fab.fab-inline {
    position: static; height: 38px; padding: 0 14px; border-radius: 10px; font-size: 13px;
    background: var(--primary); box-shadow: none; border: 1px solid transparent;
  }
  .fab-inline:hover { transform: none; box-shadow: none; background: var(--primary-600, #3f37c9); }
  .fab-inline .kbd { display: none; }
  .page-actions .fab-inline { margin-left: 2px; }

  .modal-overlay { padding: 40px 24px; }
  .modal { max-height: 88vh; }
  .dash-grid { gap: 18px; }
}

@media (min-width: 1560px) {
  .page { padding-left: 44px; padding-right: 44px; }
}

/* ---------- Командная палитра (Ctrl+K) ---------- */
.cmdk-overlay {
  position: fixed; inset: 0; z-index: 80; display: flex; align-items: flex-start; justify-content: center;
  padding: 12vh 20px 20px; background: rgba(15,23,42,.42); backdrop-filter: blur(3px);
  animation: overlayIn .12s ease;
}
.cmdk {
  width: 100%; max-width: 620px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 18px; box-shadow: 0 30px 80px -20px rgba(15,23,42,.45); overflow: hidden;
  animation: modalIn .16s cubic-bezier(.2,.8,.3,1);
}
.cmdk-input-row { display: flex; align-items: center; gap: 11px; padding: 15px 18px; border-bottom: 1px solid var(--line); }
.cmdk-input-row .icon { color: var(--muted); flex: 0 0 auto; }
.cmdk-input {
  flex: 1; border: 0; outline: 0; background: transparent; color: var(--ink);
  font-size: 15.5px; font-family: inherit;
}
.cmdk-input::placeholder { color: var(--muted-2); }
.cmdk-esc { font-size: 11px; color: var(--muted-2); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; }
.cmdk-list { max-height: 52vh; overflow-y: auto; padding: 8px; }
.cmdk-group { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted-2); font-weight: 650; padding: 10px 10px 6px; }
.cmdk-item {
  display: flex; align-items: center; gap: 11px; width: 100%; padding: 10px 11px; border: 0; border-radius: 10px;
  background: transparent; color: var(--ink-2); font-size: 13.5px; text-align: left; cursor: pointer;
}
.cmdk-item .ic { width: 30px; height: 30px; border-radius: 8px; background: var(--surface-2); color: var(--muted); display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
.cmdk-item .t { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; }
.cmdk-item .t .nm { display: block; width: 100%; font-weight: 600; color: var(--ink); font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cmdk-item .t .sub { display: block; width: 100%; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.cmdk-item .hint { font-size: 11px; color: var(--muted-2); }
.cmdk-item.active, .cmdk-item:hover { background: var(--primary-soft); }
.cmdk-item.active .ic { background: #fff; color: var(--primary); }
.cmdk-empty { padding: 28px 16px; text-align: center; color: var(--muted); font-size: 13px; }
.cmdk-foot { display: flex; align-items: center; gap: 14px; padding: 9px 16px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted-2); }
.cmdk-foot .k { border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; background: var(--surface-2); margin-right: 4px; }
@media (max-width: 760px) {
  .cmdk-overlay { padding: 0; align-items: flex-end; }
  .cmdk { max-width: none; border-radius: 20px 20px 0 0; }
  .cmdk-list { max-height: 60vh; }
}

@media (min-width: 1021px) and (max-width: 1179px) {
  .topbar-search { display: none; }
}
@media (min-width: 1400px) {
  .dash-grid { grid-template-columns: minmax(0, 2.05fr) minmax(320px, .95fr); }
}

@media (min-width: 1021px) {
  .greet .page-actions, .period-row .page-actions { display: flex; gap: 8px; align-items: center; }
  .greet .fab-inline, .period-row .fab-inline { height: 38px; }
}

/* ============================================================
   iOS / iPhone — Safe Area, отключение зума, «резиновость»
   ============================================================ */
html {
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
  height: -webkit-fill-available;
}
body {
  min-height: -webkit-fill-available;
  overscroll-behavior-y: none;
  -webkit-overflow-scrolling: touch;
}
input, select, textarea, button { -webkit-appearance: none; appearance: none; }
@media (max-width: 1020px) {
  /* на iPhone поле с мелким текстом вызывает зум при фокусе — держим 16px */
  input[type="text"], input[type="password"], input[type="number"], input[type="date"],
  input[type="month"], input[type="email"], input[type="tel"], input[type="search"],
  select, textarea, .input { font-size: 16px; }
}

@media (max-width: 1020px) {
  .topbar { padding-top: env(safe-area-inset-top); height: calc(58px + env(safe-area-inset-top)); }
  .page { padding-left: max(18px, env(safe-area-inset-left)); padding-right: max(18px, env(safe-area-inset-right)); }
  .bottomnav { padding-bottom: env(safe-area-inset-bottom); height: calc(64px + env(safe-area-inset-bottom)); }
  .page { padding-bottom: calc(130px + env(safe-area-inset-bottom)); }
  .fab, .add-fab { bottom: calc(92px + env(safe-area-inset-bottom)); right: max(18px, env(safe-area-inset-right)); }
  .modal-foot { padding-bottom: calc(18px + env(safe-area-inset-bottom)); }
  .modal { max-height: calc(92vh - env(safe-area-inset-top)); }
  .toast-wrap { bottom: calc(80px + env(safe-area-inset-bottom)); }
  .sidebar { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
}
/* полноэкранный режим на iPhone (домашний экран) */
@media (display-mode: standalone) {
  .ios-only-hint { display: none !important; }
}

/* подсказка «установить на iPhone» */
.ios-install {
  position: fixed; left: 12px; right: 12px; bottom: calc(78px + env(safe-area-inset-bottom)); z-index: 60;

  <script>
/* ============================================================
   Минимальный генератор XLSX без внешних библиотек
   (ZIP без сжатия + SpreadsheetML). Работает офлайн.
   ============================================================ */
(function (global) {
  'use strict';

  var CRC_TABLE = (function () {
    var table = new Uint32Array(256);
    for (var n = 0; n < 256; n++) {
      var c = n;
      for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      table[n] = c >>> 0;
    }
    return table;
  })();

  function crc32(bytes) {
    var crc = 0xFFFFFFFF;
    for (var i = 0; i < bytes.length; i++) {
      crc = CRC_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
    }
    return (crc ^ 0xFFFFFFFF) >>> 0;
  }

  function utf8(str) {
    if (typeof TextEncoder !== 'undefined') return new TextEncoder().encode(str);
    var out = [];
    for (var i = 0; i < str.length; i++) {
      var c = str.charCodeAt(i);
      if (c < 128) out.push(c);
      else if (c < 2048) out.push(192 | (c >> 6), 128 | (c & 63));
      else out.push(224 | (c >> 12), 128 | ((c >> 6) & 63), 128 | (c & 63));
    }
    return new Uint8Array(out);
  }

  function dosDateTime(d) {
    var date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
    var time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
    return { date: date & 0xFFFF, time: time & 0xFFFF };
  }

  function zipStore(files) {
    var now = dosDateTime(new Date());
    var localParts = [];
    var centralParts = [];
    var offset = 0;

    files.forEach(function (f) {
      var name = utf8(f.name);
      var data = f.data;
      var crc = crc32(data);
      var local = new Uint8Array(30 + name.length);
      var dv = new DataView(local.buffer);
      dv.setUint32(0, 0x04034b50, true);
      dv.setUint16(4, 20, true);
      dv.setUint16(6, 0x0800, true); // UTF-8 names
      dv.setUint16(8, 0, true);      // store
      dv.setUint16(10, now.time, true);
      dv.setUint16(12, now.date, true);
      dv.setUint32(14, crc, true);
      dv.setUint32(18, data.length, true);
      dv.setUint32(22, data.length, true);
      dv.setUint16(26, name.length, true);
      dv.setUint16(28, 0, true);
      local.set(name, 30);

      var central = new Uint8Array(46 + name.length);
      var cv = new DataView(central.buffer);
      cv.setUint32(0, 0x02014b50, true);
      cv.setUint16(4, 20, true);
      cv.setUint16(6, 20, true);
      cv.setUint16(8, 0x0800, true);
      cv.setUint16(10, 0, true);
      cv.setUint16(12, now.time, true);
      cv.setUint16(14, now.date, true);
      cv.setUint32(16, crc, true);
      cv.setUint32(20, data.length, true);
      cv.setUint32(24, data.length, true);
      cv.setUint16(28, name.length, true);
      cv.setUint16(30, 0, true);
      cv.setUint16(32, 0, true);
      cv.setUint16(34, 0, true);
      cv.setUint16(36, 0, true);
      cv.setUint32(38, 0, true);
      cv.setUint32(42, offset, true);
      central.set(name, 46);

      localParts.push(local, data);
      centralParts.push(central);
      offset += local.length + data.length;
    });

    var centralSize = centralParts.reduce(function (s, p) { return s + p.length; }, 0);
    var eocd = new Uint8Array(22);
    var ev = new DataView(eocd.buffer);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(4, 0, true);
    ev.setUint16(6, 0, true);
    ev.setUint16(8, files.length, true);
    ev.setUint16(10, files.length, true);
    ev.setUint32(12, centralSize, true);
    ev.setUint32(16, offset, true);
    ev.setUint16(20, 0, true);

    var all = localParts.concat(centralParts, [eocd]);
    var total = all.reduce(function (s, p) { return s + p.length; }, 0);
    var out = new Uint8Array(total);
    var pos = 0;
    all.forEach(function (p) { out.set(p, pos); pos += p.length; });
    return out;
  }

  function xmlEscape(value) {
    return String(value)
      .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function colLetter(index) {
    var s = '';
    index = index + 1;
    while (index > 0) {
      var m = (index - 1) % 26;
      s = String.fromCharCode(65 + m) + s;
      index = Math.floor((index - 1) / 26);
    }
    return s;
  }

  function safeSheetName(name, used) {
    var base = String(name || 'Лист').replace(/[\[\]\*\/\\\?\:]/g, ' ').trim().slice(0, 31) || 'Лист';
    var candidate = base;
    var i = 2;
    while (used[candidate.toLowerCase()]) {
      var suffix = ' (' + i + ')';
      candidate = base.slice(0, 31 - suffix.length) + suffix;
      i++;
    }
    used[candidate.toLowerCase()] = true;
    return candidate;
  }

  function buildSheetXml(rows) {
    var displayRows = (rows && rows.length) ? rows : [['Нет данных']];
    var widths = [];
    displayRows.forEach(function (row, ri) {
      (row || []).forEach(function (cell, ci) {
        var len = cell === null || cell === undefined ? 0 : String(cell).length;
        if (ri === 0) len = Math.max(len, 4);
        widths[ci] = Math.max(widths[ci] || 10, Math.min(48, Math.max(10, len + 2)));
      });
    });

    var cols = '<cols>' + widths.map(function (w, i) {
      return '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + w + '" customWidth="1"/>';
    }).join('') + '</cols>';

    var body = displayRows.map(function (row, ri) {
      var cells = (row || []).map(function (cell, ci) {
        var ref = colLetter(ci) + (ri + 1);
        if (cell === null || cell === undefined || cell === '') {
          return '<c r="' + ref + '" s="' + (ri === 0 ? 1 : 0) + '"/>';
        }
        var isNumber = typeof cell === 'number' && isFinite(cell);
        var style = ri === 0 ? 1 : 0;
        if (isNumber) return '<c r="' + ref + '" s="' + style + '"><v>' + cell + '</v></c>';
        return '<c r="' + ref + '" t="inlineStr" s="' + style + '"><is><t xml:space="preserve">' +
          xmlEscape(cell) + '</t></is></c>';
      }).join('');
      return '<row r="' + (ri + 1) + '"' + (ri === 0 ? ' ht="24" customHeight="1"' : '') + '>' + cells + '</row>';
    }).join('');

    var lastCol = colLetter(Math.max(0, widths.length - 1));
    var lastRow = displayRows.length;
    var dimension = 'A1:' + lastCol + Math.max(1, lastRow);

    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
      '<dimension ref="' + dimension + '"/>' +
      '<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/><selection pane="bottomLeft" activeCell="A2" sqref="A2"/></sheetView></sheetViews>' +
      '<sheetFormatPr defaultRowHeight="15"/>' +
      cols +
      '<sheetData>' + body + '</sheetData>' +
      (lastRow > 1 ? '<autoFilter ref="A1:' + lastCol + lastRow + '"/>' : '') +
      '<pageMargins left="0.5" right="0.5" top="0.7" bottom="0.7" header="0.3" footer="0.3"/>' +
      '</worksheet>';
  }

  var STYLES_XML = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    '<fonts count="2">' +
    '<font><sz val="11"/><color rgb="FF1D2939"/><name val="Calibri"/><family val="2"/></font>' +
    '<font><b/><sz val="11"/><color rgb="FF312E81"/><name val="Calibri"/><family val="2"/></font>' +
    '</fonts>' +
    '<fills count="3">' +
    '<fill><patternFill patternType="none"/></fill>' +
    '<fill><patternFill patternType="gray125"/></fill>' +
    '<fill><patternFill patternType="solid"><fgColor rgb="FFEEF2FF"/><bgColor indexed="64"/></patternFill></fill>' +
    '</fills>' +
    '<borders count="2">' +
    '<border><left/><right/><top/><bottom/><diagonal/></border>' +
    '<border><left/><right/><top/><bottom style="thin"><color rgb="FFC7D2FE"/></bottom><diagonal/></border>' +
    '</borders>' +
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
    '<cellXfs count="2">' +
    '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="center" wrapText="1"/></xf>' +
    '<xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment vertical="center" wrapText="1"/></xf>' +
    '</cellXfs>' +
    '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>' +
    '</styleSheet>';

  function buildXlsx(sheets) {
    var list = (sheets && sheets.length ? sheets : [{ name: 'Лист', rows: [] }]);
    var used = {};
    var names = list.map(function (s) { return safeSheetName(s.name, used); });

    var files = [];
    var overrides = '';
    var sheetTags = '';
    var sheetRels = '';

    list.forEach(function (sheet, i) {
      var name = 'xl/worksheets/sheet' + (i + 1) + '.xml';
      files.push({ name: name, data: utf8(buildSheetXml(sheet.rows)) });
      overrides += '<Override PartName="/' + name + '" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>';
      sheetTags += '<sheet name="' + xmlEscape(names[i]) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>';
      sheetRels += '<Relationship Id="rId' + (i + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + (i + 1) + '.xml"/>';
    });

    var contentTypes = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
      overrides +
      '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
      '</Types>';

    var rootRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
      '</Relationships>';

    var workbook = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
      '<bookViews><workbookView xWindow="0" yWindow="0" windowWidth="24000" windowHeight="13000"/></bookViews>' +
      '<sheets>' + sheetTags + '</sheets>' +
      '</workbook>';

    var workbookRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      sheetRels +
      '<Relationship Id="rId' + (list.length + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
      '</Relationships>';

    files.unshift({ name: '[Content_Types].xml', data: utf8(contentTypes) });
    files.push({ name: '_rels/.rels', data: utf8(rootRels) });
    files.push({ name: 'xl/workbook.xml', data: utf8(workbook) });
    files.push({ name: 'xl/_rels/workbook.xml.rels', data: utf8(workbookRels) });
    files.push({ name: 'xl/styles.xml', data: utf8(STYLES_XML) });

    return zipStore(files);
  }

  function triggerDownload(bytes, fileName, mime) {
    var blob = new Blob([bytes], { type: mime || 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () {
      URL.revokeObjectURL(url);
      a.remove();
    }, 1200);
  }

  function bytesToBase64(bytes) {
    var binary = '';
    var chunk = 0x8000;
    for (var i = 0; i < bytes.length; i += chunk) {
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    return btoa(binary);
  }

  /* Сохранение файла: в браузере — скачивание, в APK (Capacitor) — в «Документы» + меню «Поделиться» */
  async function saveFile(fileName, bytes, mime) {
    // 1) APK: нативный мост сохраняет файл в Downloads и открывает «Поделиться»
    try {
      if (window.AndroidPos && typeof window.AndroidPos.exportFile === 'function') {
        var base64Native = bytesToBase64(bytes);
        var saved = window.AndroidPos.exportFile(fileName, base64Native, mime || 'application/octet-stream');
        if (saved) return { native: true, via: 'android-bridge' };
      }
    } catch (err) {
      console.warn('Нативный экспорт недоступен', err);
    }

    // 2) Capacitor-плагины (если приложение собрано через Capacitor)
    try {
      var cap = window.Capacitor;
      var plugins = cap && cap.Plugins;
      if (plugins && plugins.Filesystem && plugins.Filesystem.writeFile) {
        var base64 = bytesToBase64(bytes);
        var uri = null;
        try {
          var res = await plugins.Filesystem.writeFile({ path: fileName, data: base64, directory: 'DOCUMENTS', recursive: true });
          uri = res && res.uri;
        } catch (e1) { /* нет доступа к документам — пробуем кэш */ }
        if (!uri) {
          try {
            var res2 = await plugins.Filesystem.writeFile({ path: fileName, data: base64, directory: 'CACHE', recursive: true });
            uri = res2 && res2.uri;
          } catch (e2) { /* ignore */ }
        }
        if (uri) {
          if (plugins.Share && plugins.Share.share) {
            try { await plugins.Share.share({ title: fileName, url: uri }); } catch (e3) { /* пользователь закрыл меню */ }
          }
          return { native: true, uri: uri };
        }
      }
    } catch (err) {
      console.warn('Нативное сохранение недоступно, используем скачивание', err);
    }
    try { triggerDownload(bytes, fileName, mime); } catch (e) { console.error('Не удалось сохранить файл', e); }
    return { native: false };
  }

  function downloadXlsx(fileName, sheets) {
    var name = /\.xlsx$/i.test(fileName) ? fileName : fileName + '.xlsx';
    return saveFile(name, buildXlsx(sheets), 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
  }

  function downloadJson(fileName, obj) {
    var name = /\.json$/i.test(fileName) ? fileName : fileName + '.json';
    return saveFile(name, utf8(JSON.stringify(obj, null, 2)), 'application/json');
  }

  global.PosXlsx = {
    buildXlsx: buildXlsx,
    downloadXlsx: downloadXlsx,
    downloadJson: downloadJson,
    saveFile: saveFile,
    bytesToBase64: bytesToBase64,
    triggerDownload: triggerDownload,
    utf8: utf8,
    crc32: crc32,
    _zipStore: zipStore
  };
})(typeof window !== 'undefined' ? window : globalThis);

if (typeof module !== 'undefined' && module.exports) module.exports = globalThis.PosXlsx;

</script>

};

var DB = null;
var LAST_SAVE_ERROR = 0;

/* Доступно ли постоянное хранилище (в sandbox-предпросмотре localStorage может быть запрещён) */

/* ---------- Утилиты ---------- */
function uid() {
  if (window.crypto && crypto.randomUUID) {
    try { return crypto.randomUUID(); } catch (e) { /* ignore */ }
  }
  return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}

function pad2(n) { return n < 10 ? '0' + n : '' + n; }

function startOfDay(d) {
  var x = new Date(d);
  x.setHours(0, 0, 0, 0);
  return x.getTime();
}

function endOfDay(d) {
  var x = new Date(d);
  x.setHours(23, 59, 59, 999);
  return x.getTime();
}

function addDays(date, days) {
  var x = new Date(date);
  x.setDate(x.getDate() + days);
  return x;
}

function dayKey(input) {
  var d = new Date(input);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}

function fmtDate(input) {
  if (!input) return '—';
  var d = new Date(input);
  return pad2(d.getDate()) + '.' + pad2(d.getMonth() + 1) + '.' + d.getFullYear();
}

function fmtTime(input) {
  if (!input) return '—';
  var d = new Date(input);
  return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}

function fmtDateTime(input) {
  if (!input) return '—';
  return fmtDate(input) + ', ' + fmtTime(input);
}

var MONTHS_RU = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
var MONTHS_SHORT = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
var WEEKDAYS_RU = ['воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'];
var WEEKDAYS_SHORT = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];

function fmtDateHuman(input) {
  var d = new Date(input);
  return WEEKDAYS_RU[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS_RU[d.getMonth()] + ' ' + d.getFullYear();
}

function fmtDateShort(input) {
  var d = new Date(input);
  return d.getDate() + ' ' + MONTHS_SHORT[d.getMonth()];
}

function fmtMoney(n, withCurrency) {
  n = Number(n) || 0;
  var rounded = Math.round(n * 100) / 100;
  var opts = Number.isInteger(rounded)
    ? { maximumFractionDigits: 0 }
    : { minimumFractionDigits: 2, maximumFractionDigits: 2 };
  var s = rounded.toLocaleString('ru-RU', opts).replace(/\u00A0/g, ' ');
  return withCurrency === false ? s : s + ' ' + APP_CONFIG.currency;
}

function fmtCompact(n) {
  n = Number(n) || 0;
  var abs = Math.abs(n);
  if (abs >= 1000000) return (n / 1000000).toLocaleString('ru-RU', { maximumFractionDigits: 1 }) + ' млн';
  if (abs >= 10000) return Math.round(n / 1000) + ' тыс';
  if (abs >= 1000) {
    var thousands = n / 1000;
    return thousands.toLocaleString('ru-RU', { maximumFractionDigits: 1 }) + ' тыс';
  }
  return String(Math.round(n));
}

function fmtNumber(n) {
  return (Number(n) || 0).toLocaleString('ru-RU').replace(/\u00A0/g, ' ');
}

function parseAmount(value) {
  if (typeof value === 'number') return value;
  var s = String(value || '').replace(/[^\d.,-]/g, '').replace(/\s/g, '').replace(',', '.');
  var n = parseFloat(s);
  return isFinite(n) ? n : 0;
}

function plural(n, one, few, many) {
  var abs = Math.abs(n) % 100;
  var last = abs % 10;
  if (abs > 10 && abs < 20) return many;
  if (last > 1 && last < 5) return few;
  if (last === 1) return one;
  return many;
}

function esc(value) {
  return String(value === null || value === undefined ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function initials(name) {
  var parts = String(name || '').trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return '?';
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[1][0]).toUpperCase();
}

/* ---------- Тема оформления ---------- */
var THEME_KEY = 'poskontrol_theme';

function systemPrefersDark() {
  try { return window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) { return false; }
}

function themePreference() {
  var pref = (DB && DB.settings && DB.settings.theme) || 'system';
  if (['light', 'dark', 'system'].indexOf(pref) === -1) pref = 'system';
  return pref;
}

function resolvedTheme(pref) {
  pref = pref || themePreference();
  if (pref === 'dark') return 'dark';
  if (pref === 'light') return 'light';
  return systemPrefersDark() ? 'dark' : 'light';
}

function readThemeMirror() {
  try { return localStorage.getItem(THEME_KEY) || 'system'; } catch (e) { return 'system'; }
}

function writeThemeMirror(pref) {
  try { localStorage.setItem(THEME_KEY, pref); } catch (e) { /* ignore */ }
}

function applyTheme(pref, opts) {
  opts = opts || {};
  var preference = pref || themePreference();
  var theme = resolvedTheme(preference);
  document.documentElement.setAttribute('data-theme', theme);
  document.documentElement.setAttribute('data-theme-pref', preference);
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', theme === 'dark' ? '#0a0e18' : '#4338ca');
  try {
    if (window.AndroidPos && typeof window.AndroidPos.setTheme === 'function') {
      window.AndroidPos.setTheme(theme);
    }
  } catch (e) { /* в браузере моста нет */ }
  if (!opts.silent) window.dispatchEvent(new CustomEvent('pos:theme', { detail: { theme: theme, pref: preference } }));
  return theme;
}

function setThemePreference(pref) {
  if (['light', 'dark', 'system'].indexOf(pref) === -1) pref = 'system';
  if (DB && DB.settings) {
    DB.settings.theme = pref;
    DB.settings.updatedAt = Date.now();
    saveDB();
  }
  writeThemeMirror(pref);
  return applyTheme(pref);
}

function toggleTheme() {
  var current = resolvedTheme();
  return setThemePreference(current === 'dark' ? 'light' : 'dark');
}

function initTheme() {
  var pref = (DB && DB.settings && DB.settings.theme) ? DB.settings.theme : readThemeMirror();
  if (['light', 'dark', 'system'].indexOf(pref) === -1) pref = 'system';
  applyTheme(pref, { silent: true });
  try {
    var media = window.matchMedia('(prefers-color-scheme: dark)');
    var onChange = function () {
      if (themePreference() === 'system') applyTheme('system');
    };
    if (media.addEventListener) media.addEventListener('change', onChange);
    else if (media.addListener) media.addListener(onChange);
  } catch (e) { /* ignore */ }
}

/* ---------- Хранилище ---------- */
function defaultDB() {
  return {
    version: 1,
    createdAt: Date.now(),
    users: [],
    points: [],
    categories: [
      { id: 'cat-drinks', name: 'Напитки' },
      { id: 'cat-bakery', name: 'Выпечка' },

    ],
    products: [],
    stock: [],

    saleChanges: [],
    expenses: [],

    settings: {
      companyName: '',
      supportPhone: '',
      supportEmail: '',
      supportTelegram: '',
      demoLoaded: false,
      theme: 'system'
    },
    session: null
  };
}

function loadDB() {
  var raw = null;
  if (STORAGE_AVAILABLE) {
    try { raw = localStorage.getItem(APP_CONFIG.storageKey); } catch (e) { raw = null; }
  }
  if (!raw) {
    DB = defaultDB();
    saveDB();
    return;
  }
  try {
    var parsed = JSON.parse(raw);
    DB = normalizeDB(parsed);
  } catch (e) {
    console.error('Не удалось прочитать базу, создаю новую', e);
    DB = defaultDB();
    saveDB();
  }
}

function normalizeDB(data) {
  var base = defaultDB();
  if (!data || typeof data !== 'object') return base;
  ['users', 'points', 'categories', 'products', 'stock', 'supplies', 'sales', 'saleChanges', 'expenses', 'time', 'stockChecks'].forEach(function (key) {
    if (!Array.isArray(data[key])) data[key] = base[key];
  });
  if (!data.settings || typeof data.settings !== 'object') data.settings = base.settings;
  data.settings = Object.assign({}, base.settings, data.settings);
  if (data.session && (!data.session.userId || !data.users.some(function (u) { return u.id === data.session.userId; }))) {
    data.session = null;
  }
  data.version = 1;
  return data;
}

function saveDB() {
  if (!STORAGE_AVAILABLE) { LAST_SAVE_ERROR = 0; return; }
  try {
    localStorage.setItem(APP_CONFIG.storageKey, JSON.stringify(DB));
    LAST_SAVE_ERROR = 0;
  } catch (e) {
    console.error('Ошибка сохранения', e);
    var now = Date.now();
    if (now - LAST_SAVE_ERROR > 15000) {
      LAST_SAVE_ERROR = now;
      window.dispatchEvent(new CustomEvent('pos:storage-error', { detail: e }));
    }
  }
}

function resetDB() {
  if (STORAGE_AVAILABLE) {
    try { localStorage.removeItem(APP_CONFIG.storageKey); } catch (e) { /* ignore */ }
  }
  DB = defaultDB();
  saveDB();
}

function cleanupExpiredData() {
  var now = Date.now();
  var salesCutoff = now - APP_CONFIG.receiptTtlDays * 86400000;
  var expensesCutoff = now - APP_CONFIG.expenseTtlDays * 86400000;
  var changed = false;

  DB.sales.forEach(function (sale) {
    if (sale.createdAt < salesCutoff && sale.receipt) {
      sale.receipt = null;
      sale.receiptPruned = true;
      changed = true;
    }
  });
  DB.expenses.forEach(function (exp) {
    if (exp.createdAt < expensesCutoff && !exp.pruned) {
      exp.reason = 'Детали удалены (старше 7 дней)';
      exp.pruned = true;
      changed = true;
    }
  });
  DB.stock.forEach(function (row) {
    if (Array.isArray(row.history) && row.history.length > 150) {
      row.history = row.history.slice(0, 150);
      changed = true;
    }
  });
  if (changed) saveDB();
}

/* ---------- Сессия и пароли ---------- */
function currentUser() {
  if (!DB || !DB.session) return null;
  var user = DB.users.find(function (u) { return u.id === DB.session.userId; });
  if (!user) { DB.session = null; saveDB(); return null; }
  return user;
}

function setSession(userId) {
  DB.session = { userId: userId, at: Date.now() };
  saveDB();

  DB.session = null;
