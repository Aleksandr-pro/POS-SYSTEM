  function bindDevAdjustCard(root, ctx) {
    var card = root.querySelector('#devAdjustCard');
    if (!card) return;
    var user = ctx.user;
    var dateEl = card.querySelector('#devAdjDate');
    var statusEl = card.querySelector('#devAdjStatus');
    var fields = {
      revenue: card.querySelector('#devAdjRevenue'),
      expenses: card.querySelector('#devAdjExpenses'),
      profit: card.querySelector('#devAdjProfit'),
      avgCheck: card.querySelector('#devAdjAvg'),
      cash: card.querySelector('#devAdjCash'),
      qr: card.querySelector('#devAdjQr'),
      mixed: card.querySelector('#devAdjMixed')
    };

    function paint(key, keepValues) {
      var sum = dayEditSummary(key);
      if (!sum) { statusEl.innerHTML = '<span class="badge danger">Некорректная дата</span>'; return; }
      var a = sum.adjustment || {};
      Object.keys(fields).forEach(function (f) {
        if (!fields[f]) return;
        if (!keepValues) fields[f].value = a[f] != null ? a[f] : '';
        fields[f].placeholder = sum[f] != null ? Math.round(sum[f]) : '0';
      });
      statusEl.innerHTML =
        '<span class="badge ' + (sum.adjustment ? 'warn' : 'neutral') + '">' +
          (sum.adjustment ? 'Корректировка есть' : 'Корректировки нет') + '</span> ' +
        '<span class="small muted">' + fmtNumber(sum.sales) + ' записей' +
          (sum.history ? ' · история ' + fmtNumber(sum.history) : '') +
          (sum.stubs ? ' · заглушек ' + fmtNumber(sum.stubs) : '') +
          ' · ' + fmtNumber(sum.count) + ' чеков</span>';
    }

    function currentKey() { return dateEl.value || dayKey(new Date()); }
    paint(currentKey(), false);

    dateEl.addEventListener('change', function () {
      var key = currentKey();
      if (!canAdjustDay(key)) {
        toast('Можно править только дни до 22.10.2026', 'error');
        dateEl.value = '2026-10-21';
        key = '2026-10-21';
      }
      paint(key, false);
    });

    card.querySelector('#devAdjSave').addEventListener('click', function () {
      var key = currentKey();
      var patch = {};
      Object.keys(fields).forEach(function (f) {
        if (fields[f] && String(fields[f].value).trim() !== '') patch[f] = parseAmount(fields[f].value);
      });
      var res = setDayAdjustment(user, key, patch, { replace: true });
      if (res.error) { toast(res.error, 'error'); return; }
      toast(res.adjustment ? 'Показатели за ' + fmtDate(parseDayKey(key)) + ' сохранены' : 'Корректировка снята', 'success', 4000);
      paint(key, false);
      ctx.rerender();
    });

    card.querySelector('#devAdjClear').addEventListener('click', function () {
      var key = currentKey();
      var res = resetDayAdjustment(user, key);
      if (res.error) { toast(res.error, 'error'); return; }
      if (!res.removed) { toast('За этот день корректировки нет', 'info'); return; }
      toast('Корректировка снята — значения снова фактические', 'success', 4000);
      ctx.rerender();
    });

    function removeSales(opts, title, msg) {
      confirmDialog({ title: title, message: msg, confirmText: 'Удалить', danger: true }).then(function (okay) {
        if (!okay) return;
        var res = deleteDaySales(user, currentKey(), opts);
        if (res.error) { toast(res.error, 'error'); return; }
        toast(res.removed ? 'Удалено ' + fmtNumber(res.removed) + ' записей на ' + fmtMoney(res.revenue) : 'Нечего удалять', res.removed ? 'success' : 'info', 4200);
        ctx.rerender();
      });
    }

    card.querySelector('#devAdjDelStubs').addEventListener('click', function () {
      var sum = dayEditSummary(currentKey());
      removeSales({ onlyStubs: true }, 'Удалить заглушки дня?',
        'За ' + fmtDate(parseDayKey(currentKey())) + ' будет удалено сводных записей: <b>' + fmtNumber(sum.stubs) + '</b>. Транзакции и обычные продажи останутся.');
    });

    card.querySelector('#devAdjDelHistory').addEventListener('click', function () {
      var sum = dayEditSummary(currentKey());
      removeSales({ onlyHistory: true }, 'Удалить историю дня?',
        'За ' + fmtDate(parseDayKey(currentKey())) + ' будет удалено записей истории (транзакции и заглушки): <b>' + fmtNumber(sum.history) + '</b>. Обычные продажи останутся.');
    });

    card.querySelector('#devAdjDelAll').addEventListener('click', function () {
      var sum = dayEditSummary(currentKey());
      removeSales({}, 'Удалить все продажи дня?',
        'За ' + fmtDate(parseDayKey(currentKey())) + ' будут удалены <b>все</b> продажи: ' + fmtNumber(sum.sales) + ' записей на ' + fmtMoney(sum.revenue) + '. Склад не изменится. Действие необратимо.');
    });
  }

  function bindLegacyCard(root, ctx) {
    if (!window.POS_IMPORT_DATA) return;
    var note = root.querySelector('#legacyNote');
    function say(text, color) {
      if (!note) return;
      note.textContent = text;
      note.style.color = color || '';
    }

    var importBtn = root.querySelector('#legacyImport');
    if (importBtn) importBtn.addEventListener('click', async function () {
      var btn = this;
      var data = window.POS_IMPORT_DATA;
      var ok = await confirmDialog({
        title: 'Внести данные из старой системы?',
        message: 'В базу добавятся <b>' + data.products.length + ' товаров</b> и <b>' + data.totalSales + ' продаж</b> за 1–18 октября 2026 на сумму <b>' + fmtMoney(data.totalRevenue) + '</b>.<br><br>Существующие данные не удаляются. Позже эти записи можно удалить вручную.',
        confirmText: 'Внести данные'
      });
      if (!ok) return;
      setButtonBusy(btn, true, 'Переносим…');
      try {
        var res = applyLegacyStarter({ actor: ctx.user });
        toast('Готово: товаров +' + res.products.created + ', продаж +' + res.sales.created, 'success', 5200);
        setTimeout(function () { ctx.rerender(); }, 300);
      } catch (err) {
        setButtonBusy(btn, false);
        say(err.message, 'var(--danger)');
        toast(err.message, 'error', 5200);
      }
    });

    var again = root.querySelector('#legacyAgain');
    if (again) again.addEventListener('click', function () {
      var sales = DB.sales.filter(function (s) { return s.imported; });
      var revenue = sales.reduce(function (sum, s) { return sum + (s.total || 0); }, 0);
      var products = DB.products.filter(function (p) { return p.imported; }).length;
      say('В базе: ' + products + ' ' + plural(products, 'товар', 'товара', 'товаров') + ', ' +
        sales.length + ' ' + plural(sales.length, 'продажа', 'продажи', 'продаж') + ' на ' + fmtMoney(revenue), 'var(--success-600)');
    });

    var csvBtn = root.querySelector('#legacyCsv');
    var fileInput = root.querySelector('#legacyFile');
    if (csvBtn && fileInput) {
      csvBtn.addEventListener('click', function () { fileInput.click(); });
      fileInput.addEventListener('change', function () {
        var file = fileInput.files && fileInput.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function () {
          try {
            var rows = parseProductsCsv(reader.result);
            if (!rows.length) throw new Error('В файле не найдено ни одного товара');
            var res = importProducts(rows, {});
            toast('Товары: добавлено ' + res.created + ', пропущено ' + res.skipped + ', категорий +' + res.categories, 'success', 5200);
            setTimeout(function () { ctx.rerender(); }, 300);
          } catch (err) {
            toast(err.message, 'error', 5000);
          }
          fileInput.value = '';
        };
        reader.onerror = function () { toast('Не удалось прочитать файл', 'error'); };
        reader.readAsText(file, 'utf-8');
      });
    }

    var manual = root.querySelector('#legacyManual');
    if (manual) manual.addEventListener('click', function () {
      var defaultFrom = dayKey(Date.now() - 30 * 86400000);
      var defaultTo = dayKey(Date.now());
      openModal({

            '<div class="field"><label for="impFrom">С</label><input class="input" id="impFrom" type="date" value="' + defaultFrom + '"></div>' +
            '<div class="field"><label for="impTo">По</label><input class="input" id="impTo" type="date" value="' + defaultTo + '"></div>' +
            '<div class="field"><label for="impCount">Количество продаж</label><input class="input" id="impCount" inputmode="numeric" placeholder="692"></div>' +
            '<div class="field"><label for="impRevenue">Выручка, ₸</label><input class="input" id="impRevenue" inputmode="numeric" placeholder="1405350"></div>' +
            '<div class="field"><label for="impCash">Наличные, ₸</label><input class="input" id="impCash" inputmode="numeric" placeholder="426400"></div>' +
            '<div class="field"><label for="impQr">Kaspi QR, ₸</label><input class="input" id="impQr" inputmode="numeric" placeholder="978950"></div>' +
            '<div class="field"><label for="impMixedCash">Из смешанных: наличными</label><input class="input" id="impMixedCash" inputmode="numeric" placeholder="30150"></div>' +
            '<div class="field"><label for="impMixedQr">Из смешанных: Kaspi</label><input class="input" id="impMixedQr" inputmode="numeric" placeholder="16950"></div>' +
            (DB.points.length > 1
              ? '<div class="field full"><label for="impPoint">Точка продаж</label><select class="select" id="impPoint">' +
                  DB.points.map(function (p) { return '<option value="' + p.id + '">' + esc(p.name) + '</option>'; }).join('') +
                '</select></div>'
              : '') +
          '</div>' +
          '<div class="form-note info">' + icon('info', 15) + '<span>Наличные + Kaspi QR должны равняться выручке. Смешанные — часть этих сумм.</span></div>',
        footer: '<button type="button" class="btn btn-secondary" data-cancel>Отмена</button>' +
                '<button type="button" class="btn btn-primary" data-save>Добавить</button>',
        onMount: function (el, close) {
          el.querySelector('[data-cancel]').addEventListener('click', close);
          el.querySelector('[data-save]').addEventListener('click', function () {
            var btn = this;
            try {
              var pointSel = el.querySelector('#impPoint');
              var res = importSalesHistory({
                from: el.querySelector('#impFrom').value,
                to: el.querySelector('#impTo').value,
                count: parseAmount(el.querySelector('#impCount').value),
                revenue: parseAmount(el.querySelector('#impRevenue').value),
                cashTotal: parseAmount(el.querySelector('#impCash').value),

                mixedCash: parseAmount(el.querySelector('#impMixedCash').value),

          '</div>' +

          '<div class="about-list">' +

              ? '<div class="about-row"><span class="k">Связь</span><span class="v">' +
                  (st.online ? '<span class="badge success">онлайн</span>' : '<span class="badge warn">офлайн</span>') + '</span></div>' +

            ? '<button type="button" class="btn btn-secondary" id="srvCheck" style="align-self:flex-start">' + icon('cloud', 16) + ' Проверить связь</button>' +
              '<div class="hint" id="srvCheckResult"></div>'
            : '<div class="hint">Адрес сервера настраивает администратор. Пока данные хранятся только на этом устройстве.</div>') +
        '</div>' +

        '<div class="card settings-section">' +
          '<h3>Смена пароля</h3>' +
          '<div class="field"><label for="curPass">Текущий пароль</label>' +
            '<div class="pw-wrap"><input class="input" id="curPass" type="password" autocomplete="current-password">' +
            '<button type="button" class="pw-toggle" data-pw-toggle="curPass">' + icon('eye', 18) + '</button></div></div>' +
          '<div class="form-grid">' +
            '<div class="field"><label for="newPass">Новый пароль</label>' +
              '<div class="pw-wrap"><input class="input" id="newPass" type="password" autocomplete="new-password">' +
              '<button type="button" class="pw-toggle" data-pw-toggle="newPass">' + icon('eye', 18) + '</button></div></div>' +
            '<div class="field"><label for="newPass2">Повтор пароля</label>' +
              '<div class="pw-wrap"><input class="input" id="newPass2" type="password" autocomplete="new-password">' +
              '<button type="button" class="pw-toggle" data-pw-toggle="newPass2">' + icon('eye', 18) + '</button></div></div>' +
          '</div>' +
          '<button type="button" class="btn btn-primary" id="savePassword" style="align-self:flex-start">' + icon('lock', 16) + ' Обновить пароль</button>' +
        '</div>' +
      '</div>';

    bindPasswordToggle(root);
    root.querySelector('#logoutBtn').addEventListener('click', function () { ctx.logout(); });

    var checkBtn = root.querySelector('#srvCheck');
    if (checkBtn) {
      checkBtn.addEventListener('click', async function () {
        var btn = this;
        var box = root.querySelector('#srvCheckResult');
        setButtonBusy(btn, true, 'Проверяем…');
        try {
          var info = await window.POS_API.testServer();
          if (box) box.textContent = 'Сервер на связи · версия ' + (info.version || '—');
        } catch (err) {
          if (box) box.textContent = err.message || 'Нет связи с сервером';
        }
        setButtonBusy(btn, false);
      });
    }

    root.querySelector('#savePassword').addEventListener('click', async function () {
      var btn = this;
      var current = root.querySelector('#curPass').value;
      var next = root.querySelector('#newPass').value;
      var repeat = root.querySelector('#newPass2').value;
      if (!current) { toast('Введите текущий пароль', 'error'); return; }
      if (next.length < 6) { toast('Новый пароль — минимум 6 символов', 'error'); return; }
      if (next !== repeat) { toast('Пароли не совпадают', 'error'); return; }
      setButtonBusy(btn, true, 'Проверяем…');
      var currentHash = await hashPassword(current);
      if (currentHash !== user.pass) {
        setButtonBusy(btn, false);
        toast('Текущий пароль указан неверно', 'error');
        return;
      }
      if (window.POS_API && window.POS_API.isServerConfigured()) {
        try {
          await window.POS_API.changeServerPassword(current, next);
        } catch (err) {
          setButtonBusy(btn, false);
          toast(err.message || 'Сервер не принял пароль', 'error', 4600);
          return;
        }
      }
      user.pass = await hashPassword(next);
      user.updatedAt = Date.now();
      saveDB();
      setButtonBusy(btn, false);
      root.querySelector('#curPass').value = '';
      root.querySelector('#newPass').value = '';
      root.querySelector('#newPass2').value = '';
      toast('Пароль обновлён', 'success');
    });
  }

                      : '<span style="color:var(--warning)">не подключена</span>') + '</span></div>' +
                  '<div class="about-row"><span class="k">Экспорт</span><span class="v">Excel (.xlsx), JSON</span></div>' +
                '</div>' +
                '<a class="btn btn-secondary" href="#/help" style="align-self:flex-start" id="goHelp">' + icon('book', 16) + ' Открыть руководство</a>' +
              '</div>' +

              '<div class="danger-zone">' +
                '<h4>' + icon('alert', 15) + ' Опасная зона</h4>' +
                '<p>Полный сброс удалит всех пользователей, товары, продажи, склад и историю времени на этом устройстве. Перед сбросом скачайте резервную копию.</p>' +
                '<button type="button" class="btn btn-danger btn-sm" id="resetAll">' + icon('trash', 15) + ' Сбросить все данные</button>' +
              '</div>' +
            '</div>' +
          '</div>' +
        '</div>';

      bindPasswordToggle(root);
      bindServerCard(root, ctx);
      bindLegacyCard(root, ctx);
      bindHistoryCard(root, ctx);
      bindDevAdjustCard(root, ctx);
      bindStockCard(root, ctx);
      root.querySelector('#logoutBtn').addEventListener('click', function () { ctx.logout(); });

      /* тема */
      function paintThemeOptions() {
        var pref = themePreference();
        root.querySelectorAll('[data-theme-option]').forEach(function (btn) {
          btn.classList.toggle('active', btn.getAttribute('data-theme-option') === pref);
        });
        var hint = root.querySelector('#themeHint');
        if (hint) {
          hint.textContent = pref === 'system'
            ? 'Сейчас используется ' + (resolvedTheme() === 'dark' ? 'тёмная' : 'светлая') + ' тема — как в системе. Переключится автоматически при смене темы телефона.'
            : 'Выбрана ' + (pref === 'dark' ? 'тёмная' : 'светлая') + ' тема принудительно.';
        }
      }
      root.querySelectorAll('[data-theme-option]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          setThemePreference(btn.getAttribute('data-theme-option'));
          paintThemeOptions();
          var toggle = document.getElementById('themeToggle');
          if (toggle) toggle.innerHTML = icon(resolvedTheme() === 'dark' ? 'sun' : 'moon', 17);
          toast('Тема: ' + (themePreference() === 'system' ? 'как в системе' : (resolvedTheme() === 'dark' ? 'тёмная' : 'светлая')), 'success');
        });
      });
      paintThemeOptions();

      /* профиль */
      root.querySelector('#saveProfile').addEventListener('click', async function () {
        var saveBtn = this;
        var name = root.querySelector('#setName').value.trim();
        var login = root.querySelector('#setLogin').value.trim();
        if (!name) { toast('Имя не может быть пустым', 'error'); return; }
        if (!/^[A-Za-zА-Яа-яЁё0-9_\-\.]{2,32}$/.test(login)) { toast('Логин: 2–32 символа (буквы, цифры, _ - .)', 'error'); return; }
        var dup = DB.users.some(function (u) { return u.username.toLowerCase() === login.toLowerCase() && u.id !== user.id; });
        if (dup) { toast('Это имя пользователя уже занято', 'error'); return; }

        var api = window.POS_API;
        var patch = { fullName: name, username: login };
        if (api && api.isServerConfigured()) {
          setButtonBusy(saveBtn, true, 'Сохраняем…');
          try {
            var res = await api.updateServerUser({
              userId: user.id, fullName: name, username: login, role: user.role,
              pointIds: userPointIds(user), pointId: user.pointId, workStart: user.workStart, workEnd: user.workEnd
            });
            if (res && res.user) patch.updatedAt = res.user.updatedAt;
          } catch (err) {
            setButtonBusy(saveBtn, false);
            toast(err.message || 'Не удалось сохранить на сервере', 'error', 4600);
            return;
          }
          setButtonBusy(saveBtn, false);
        }
        updateUser(user.id, patch);
        toast('Профиль сохранён', 'success');
        ctx.rerender();
      });

      /* пароль */
      root.querySelector('#savePassword').addEventListener('click', async function () {
        var btn = this;
        var current = root.querySelector('#curPass').value;
        var next = root.querySelector('#newPass').value;
        var repeat = root.querySelector('#newPass2').value;
        if (!current) { toast('Введите текущий пароль', 'error'); return; }
        if (next.length < 6) { toast('Новый пароль — минимум 6 символов', 'error'); return; }
        if (next !== repeat) { toast('Пароли не совпадают', 'error'); return; }
        setButtonBusy(btn, true, 'Проверяем…');
        var currentHash = await hashPassword(current);
        if (currentHash !== user.pass) {
          setButtonBusy(btn, false);
          toast('Текущий пароль указан неверно', 'error');
          return;
        }
        if (window.POS_API && window.POS_API.isServerConfigured()) {
          try {
            await window.POS_API.changeServerPassword(current, next);
          } catch (err) {
            setButtonBusy(btn, false);
            toast(err.message || 'Сервер не принял пароль', 'error', 4600);
            return;
          }
        }
        user.pass = await hashPassword(next);
        user.updatedAt = Date.now();
        saveDB();
        setButtonBusy(btn, false);
        root.querySelector('#curPass').value = '';
        root.querySelector('#newPass').value = '';
        root.querySelector('#newPass2').value = '';
        toast('Пароль обновлён', 'success');
      });

      /* контакты */
      var saveContacts = root.querySelector('#saveContacts');
      if (saveContacts) {
        saveContacts.addEventListener('click', function () {
          DB.settings.companyName = root.querySelector('#setCompany').value.trim();
          DB.settings.supportPhone = root.querySelector('#setPhone').value.trim();
          DB.settings.supportEmail = root.querySelector('#setEmail').value.trim();
          DB.settings.supportTelegram = root.querySelector('#setTelegram').value.trim().replace(/^@/, '');
          DB.settings.updatedAt = Date.now();
          saveDB();
          toast('Контакты сохранены', 'success');
          ctx.rerender();
        });
      }

      /* резервные копии */
      root.querySelector('#backupDownload').addEventListener('click', function () {
        var stamp = fmtDate(Date.now()).replace(/\./g, '-') + '_' + fmtTime(Date.now()).replace(':', '-');
        PosXlsx.downloadJson('pos_backup_' + stamp + '.json', exportBackup());
        toast('Резервная копия скачана', 'success');
      });
      var fileInput = root.querySelector('#backupFile');
      root.querySelector('#backupUpload').addEventListener('click', function () { fileInput.click(); });
      fileInput.addEventListener('change', function () {
        var file = fileInput.files && fileInput.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = async function () {
          try {
            var payload = JSON.parse(reader.result);
            var ok = await confirmDialog({
              title: 'Восстановить из копии?',
              message: 'Текущие данные будут <b>заменены</b> содержимым файла «' + esc(file.name) + '». Рекомендуется сначала скачать текущую копию.',
              confirmText: 'Восстановить',
              danger: true
            });
            if (!ok) { fileInput.value = ''; return; }
            importBackup(payload);
            toast('База восстановлена', 'success');
            setTimeout(function () { location.reload(); }, 600);
          } catch (err) {
            toast(err.message || 'Не удалось прочитать файл', 'error', 5000);
          }
          fileInput.value = '';
        };
        reader.onerror = function () { toast('Не удалось прочитать файл', 'error'); };
        reader.readAsText(file);
      });

      /* сброс */
      root.querySelector('#resetAll').addEventListener('click', async function () {
        var ok = await confirmDialog({
          title: 'Сбросить все данные?',
          message: 'Будут удалены <b>все</b> пользователи, товары, точки, продажи, склад и записи времени. Это действие нельзя отменить.<br><br>Рекомендуем сначала скачать резервную копию.',
          confirmText: 'Удалить всё',
          danger: true
        });
        if (!ok) return;
        resetDB();
        if (typeof window.resetCashState === 'function') window.resetCashState();
        toast('Все данные удалены. Создайте первый аккаунт.', 'info', 4600);
        ctx.navigate('login');
      });

      var goHelp = root.querySelector('#goHelp');
      if (goHelp) goHelp.addEventListener('click', function (e) { e.preventDefault(); ctx.navigate('help'); });
    }
  };
})();

</script>
  <script>
/* ============================================================
   POS Контроль — точка входа: роутер и каркас приложения
   ============================================================ */
(function () {
  'use strict';

  var NAV = {
    dashboard: { label: 'Панель', icon: 'grid' },
    cash: { label: 'Касса', icon: 'cash' },
    products: { label: 'Товары', icon: 'package' },
    stock: { label: 'Склад', icon: 'layers' },
    points: { label: 'Точки продаж', icon: 'pin' },
    time: { label: 'Время', icon: 'clock' },
    analytics: { label: 'Аналитика', icon: 'chart' },
    manual: { label: 'Ручные продажи', icon: 'edit' },
    changes: { label: 'Изменения', icon: 'history' },
    help: { label: 'Помощь', icon: 'book' },
    settings: { label: 'Настройки', icon: 'sliders' }
  };
  var WORK_ORDER = ['dashboard', 'cash', 'products', 'stock', 'points', 'time', 'analytics', 'manual', 'changes'];
  var activePage = null;
  var activeUser = null;

  function defaultPage(user) {
    return canAccess(user, 'dashboard') ? 'dashboard' : 'cash';
  }

  function navigate(page) {
    var target = '#/' + page;
    if (location.hash === target) route();
    else location.hash = target;
  }

  function doLogout() {
    logoutUser();
    if (typeof window.resetCashState === 'function') window.resetCashState();
    activePage = null;
    toast('Вы вышли из аккаунта', 'info');
    if (location.hash === '#/login') route();
    else location.hash = '#/login';
  }

  function pageCtx(user, page) {
    return {
      user: user,
      page: page,
      navigate: navigate,
      rerender: function () { renderPageOnly(); },
      logout: doLogout
    };
  }

  function navItemHtml(page, user) {
    var item = NAV[page];
    var label = (page === 'settings' && user.role === 'seller') ? 'Профиль' : item.label;
    var active = activePage === page;
    var tail = '';
    if (page === 'time' && user.role === 'seller' && !timeEntryFor(user.id)) {
      tail = '<span class="tail" title="Приход не отмечен">!</span>';
    }
    return '<button type="button" class="side-item' + (active ? ' active' : '') + '" data-nav="' + page + '" title="' + label + '">' +
      icon(item.icon, 18) + '<span>' + label + '</span>' + tail + '</button>';
  }

  function shellHtml(user, page) {
    var workItems = WORK_ORDER.filter(function (p) { return canAccess(user, p); }).map(function (p) { return navItemHtml(p, user); }).join('');
    var systemItems = ['help', 'settings'].filter(function (p) { return canAccess(user, p); }).map(function (p) { return navItemHtml(p, user); }).join('');

    var shortNav = WORK_ORDER.concat(['help', 'settings']).filter(function (p) { return canAccess(user, p); }).slice(0, 4);
    var bottomItems = shortNav.map(function (p) {
      var label = (p === 'settings' && user.role === 'seller') ? 'Профиль' : NAV[p].label;
      return '<button type="button" class="bn-item' + (activePage === p ? ' active' : '') + '" data-nav="' + p + '">' +
        icon(NAV[p].icon, 22) + '<span>' + label + '</span></button>';
    }).join('');

    var now = new Date();
    return '<div class="app">' +
      '<aside class="sidebar" id="sidebar">' +
        '<div class="sidebar-brand">' +
          '<div class="logo-mark">' + icon('logo', 22) + '</div>' +
          '<div><div class="nm">POS Контроль</div><div class="tg">v' + APP_CONFIG.version + ' · офлайн-режим</div></div>' +
          '<button type="button" class="sidebar-collapse" id="sideCollapse" title="Свернуть меню (Ctrl+B)">' + icon('chevronLeft', 16) + '</button>' +
        '</div>' +
        '<nav class="side-nav">' +
          '<div class="side-label">Работа</div>' + workItems +
          '<div class="side-label">Система</div>' + systemItems +
        '</nav>' +
        '<div class="side-foot">' +
          '<div class="side-user">' +
            avatarHtml(user.fullName, 'avatar-sm') +
            '<div style="min-width:0"><div class="nm truncate">' + esc(user.fullName) + '</div><div class="rl">' + roleLabel(user.role) + '</div></div>' +
            '<button type="button" class="icon-btn danger logout" id="sideLogout" title="Выйти">' + icon('logout', 16) + '</button>' +
          '</div>' +
        '</div>' +
      '</aside>' +
      '<div class="nav-overlay" id="navOverlay"></div>' +
      '<div class="main">' +
        '<header class="topbar">' +
          '<div class="topbar-left">' +
            '<button type="button" class="icon-btn menu-btn" id="menuBtn" aria-label="Меню">' + icon('menu', 20) + '</button>' +
            '<div><div class="topbar-title">' + NAV[page].label + '</div>' +
              '<div class="topbar-crumb">POS Контроль · ' + roleLabel(user.role) + '</div></div>' +
          '</div>' +
          '<div class="topbar-right">' +
            '<button type="button" class="topbar-search" id="globalSearch" title="Поиск по системе (Ctrl+K)">' +
              icon('search', 16) + '<span>Поиск по системе</span><span class="kbd-hint">Ctrl K</span>' +
            '</button>' +
            topbarPointHtml(user) +
            cloudPillHtml() +
            '<button type="button" class="theme-toggle" id="themeToggle" title="Переключить тему" aria-label="Переключить тему">' +
              icon(resolvedTheme() === 'dark' ? 'sun' : 'moon', 17) +
            '</button>' +
            '<span class="topbar-date">' + icon('calendar', 14) + ' ' + fmtDateShort(now) + ', ' + WEEKDAYS_SHORT[now.getDay()] + '</span>' +
            '<button type="button" class="topbar-user" id="topbarUser" title="Настройки профиля">' +
              avatarHtml(user.fullName, 'avatar-sm') +
              '<div style="text-align:left"><div class="nm">' + esc((user.fullName || '').split(' ')[0]) + '</div><div class="rl">' + roleLabel(user.role) + '</div></div>' +
            '</button>' +
          '</div>' +
        '</header>' +
        '<div id="pageRoot"></div>' +
      '</div>' +
      '<nav class="bottomnav">' + bottomItems +
        '<button type="button" class="bn-item" id="moreBtn">' + icon('menu', 22) + '<span>Ещё</span></button>' +
      '</nav>' +
    '</div>';
  }

  function topbarPointHtml(user) {
    if (!user || user.role !== 'seller') return '';
    var points = userPoints(user);
    if (points.length < 2) return '';
    var active = activePointId(user);
    return '<select class="select point-switch" id="topbarPoint" title="Точка продаж">' +
      points.map(function (p) {
        return '<option value="' + p.id + '"' + (p.id === active ? ' selected' : '') + '>' + esc(p.name) + '</option>';
      }).join('') +
      '</select>';
  }

  function cloudPillHtml() {
    var api = window.POS_API;
    if (!api || !api.isServerConfigured()) return '';
    var st = api.syncStatus();
    var pending = st.pending || 0;
    var cls = pending ? 'pending' : (st.error ? 'error' : 'ok');
    var title = pending
      ? 'Не отправлено: ' + pending + ' — нажмите, чтобы синхронизировать'
      : (st.error ? st.error : 'Данные синхронизированы');
    return '<button type="button" class="sync-pill ' + cls + '" id="syncPill" title="' + esc(title) + '">' +
      icon(pending ? 'sync' : 'cloud', 16) +
      (pending ? '<span class="cnt">' + pending + '</span>' : '') +
      '</button>';
  }

  function refreshCloudPill() {
    var pill = document.getElementById('syncPill');
    if (!pill) return;
    var api = window.POS_API;
    if (!api || !api.isServerConfigured()) { pill.remove(); return; }
    var holder = document.createElement('div');
    holder.innerHTML = cloudPillHtml();
    var fresh = holder.firstChild;
    if (fresh) pill.replaceWith(fresh);
    bindCloudPill();

    var pointSwitch = document.getElementById('topbarPoint');
    if (pointSwitch) {
      pointSwitch.addEventListener('change', function () {
        if (!setActivePoint(user, pointSwitch.value)) return;
        toast('Точка продаж: ' + pointName(pointSwitch.value), 'info', 2600);
        if (activePage === 'cash' && typeof window.resetCashStatePoint === 'function') window.resetCashStatePoint();
        renderApp(activePage, user);
      });
    }
  }

  function bindCloudPill() {
    var pill = document.getElementById('syncPill');
    if (!pill) return;
    pill.addEventListener('click', function () {
      var api = window.POS_API;
      if (!api) return;
      var st = api.syncStatus();
      if (st.pending && st.online) {
        pill.classList.add('busy');
        api.syncNow({ silent: false }).then(function () {
          pill.classList.remove('busy');
          refreshCloudPill();
          renderPageOnly();
        });
      } else {
        navigate('settings');
      }
    });
  }

  /* ---------- компьютерный режим: свёрнутый сайдбар, поиск, горячие клавиши ---------- */

  function desktopMode() {
    return window.matchMedia('(min-width: 1021px)').matches;
  }

  function applySidebarState(collapsed) {
    document.body.classList.toggle('side-collapsed', !!collapsed && desktopMode());
    try { localStorage.setItem('poskontrol_sidebar', collapsed ? 'collapsed' : 'open'); } catch (e) {}
  }

  function restoreSidebarState() {
    var saved = 'open';
    try { saved = localStorage.getItem('poskontrol_sidebar') || 'open'; } catch (e) {}
    applySidebarState(saved === 'collapsed');
  }

  function toggleSidebarCollapse() {
    if (!desktopMode()) return;
    applySidebarState(!document.body.classList.contains('side-collapsed'));
  }

  /** На компьютере кнопка «Экспорт» переезжает в шапку страницы */
  function syncExportButton() {
    var root = document.getElementById('pageRoot');
    if (!root) return;
    var fab = root.querySelector('.fab, .fab-inline');
    if (!fab) return;
    if (desktopMode()) {
      var head = root.querySelector('.page-head');
      var host = head;
      if (!host) {
        var greet = root.querySelector('.greet');
        if (greet) host = greet;
      }
      if (!host) return;
      fab.classList.add('fab-inline');
      var actions = host.querySelector('.page-actions');
      if (!actions) {
        actions = document.createElement('div');
        actions.className = 'page-actions';
        if (host.classList.contains('greet')) {
          var row = host.querySelector('.period-row');
          if (row) row.appendChild(actions); else host.appendChild(actions);
        } else {
          host.appendChild(actions);
        }
      }
      if (fab.parentNode !== actions) actions.appendChild(fab);
    } else if (fab.classList.contains('fab-inline')) {
      fab.classList.remove('fab-inline');
      if (!root.querySelector('.fab')) root.appendChild(fab);
    }
  }

  /** Поиск по всей системе (Ctrl+K) */
  function openCommandPalette() {
    if (document.querySelector('.cmdk-overlay') || !activeUser) return;
    var user = activeUser;

    var items = [];
    WORK_ORDER.concat(['help', 'settings']).forEach(function (page) {
      if (!canAccess(user, page)) return;
      var label = (page === 'settings' && user.role === 'seller') ? 'Профиль' : NAV[page].label;
      items.push({ group: 'Разделы', name: label, sub: 'Открыть раздел', icon: NAV[page].icon, run: function () { navigate(page); } });
    });

    if (user.role === 'seller') {
      items.push({ group: 'Разделы', name: 'Новая продажа', sub: 'Касса', icon: 'cash', run: function () { navigate('cash'); } });
    } else {
      items.push({ group: 'Действия', name: 'Ручная продажа за прошлую дату', sub: 'Раздел «Ручные продажи»', icon: 'edit', run: function () { navigate('manual'); } });
      items.push({ group: 'Действия', name: 'Добавить расход', sub: 'Панель → расходы', icon: 'wallet', run: function () {
        navigate('dashboard');
        setTimeout(function () { if (typeof window.openExpenseModal === 'function') window.openExpenseModal(); }, 220);
      } });
    }

    (DB.products || []).slice(0, 400).forEach(function (p) {
      items.push({ group: 'Товары', name: p.name, sub: fmtMoney(p.price) + (p.variant ? ' · вариант' : ''), icon: 'package', run: function () { navigate('products'); } });
    });
    (DB.points || []).forEach(function (p) {
      items.push({ group: 'Точки', name: p.name, sub: p.address || 'Точка продаж', icon: 'pin', run: function () { navigate(user.role === 'seller' ? 'cash' : 'points'); } });
    });
    if (user.role === 'admin' || user.role === 'dev') {
      (DB.users || []).forEach(function (u) {
        items.push({ group: 'Сотрудники', name: u.fullName, sub: '@' + u.username + ' · ' + roleLabel(u.role), icon: 'user', run: function () { navigate('points'); } });
      });
    }

    var overlay = document.createElement('div');
    overlay.className = 'cmdk-overlay';
    overlay.innerHTML =
      '<div class="cmdk" role="dialog" aria-modal="true" aria-label="Поиск">' +
        '<div class="cmdk-input-row">' + icon('search', 19) +
          '<input class="cmdk-input" id="cmdkInput" placeholder="Раздел, товар, точка, сотрудник…" autocomplete="off" spellcheck="false">' +
          '<span class="cmdk-esc">Esc</span>' +
        '</div>' +
        '<div class="cmdk-list" id="cmdkList"></div>' +
        '<div class="cmdk-foot">' +
          '<span><span class="k">↑</span><span class="k">↓</span> выбор</span>' +
          '<span><span class="k">Enter</span> открыть</span>' +
          '<span style="margin-left:auto"><span class="k">Ctrl</span><span class="k">K</span></span>' +
        '</div>' +
      '</div>';
    document.body.appendChild(overlay);

    var input = overlay.querySelector('#cmdkInput');
    var listEl = overlay.querySelector('#cmdkList');
    var visible = [], activeIndex = 0;

    function normalize(t) { return String(t || '').toLowerCase().replace(/\s+/g, ' ').trim(); }

    function render() {
      var q = normalize(input.value);
      var matched = items.filter(function (it) {
        if (!q) return true;
        return normalize(it.name).indexOf(q) !== -1 || normalize(it.sub).indexOf(q) !== -1 || normalize(it.group).indexOf(q) !== -1;
      });
      var limit = q ? 40 : 22;
      visible = matched.slice(0, limit);
      if (activeIndex >= visible.length) activeIndex = Math.max(0, visible.length - 1);

      if (!visible.length) {
        listEl.innerHTML = '<div class="cmdk-empty">Ничего не найдено по запросу «' + esc(input.value) + '»</div>';
        return;
      }
      var html = '', group = '';
      visible.forEach(function (it, i) {
        if (it.group !== group) {
          group = it.group;
          html += '<div class="cmdk-group">' + esc(group) + '</div>';
        }
        html += '<button type="button" class="cmdk-item' + (i === activeIndex ? ' active' : '') + '" data-cmdk="' + i + '">' +
          '<span class="ic">' + icon(it.icon, 16) + '</span>' +
          '<span class="t"><span class="nm">' + esc(it.name) + '</span><span class="sub">' + esc(it.sub) + '</span></span>' +
          '<span class="hint">↵</span>' +
        '</button>';
      });
      listEl.innerHTML = html;
      var active = listEl.querySelector('.cmdk-item.active');
      if (active && active.scrollIntoView) active.scrollIntoView({ block: 'nearest' });
    }

    function runIndex(i) {
      var it = visible[i];
      if (!it) return;
      close();
      setTimeout(function () { it.run(); }, 30);
    }

    function close() {
      overlay.remove();
      document.removeEventListener('keydown', onKey, true);
    }

    function onKey(e) {
      if (e.key === 'Escape') { e.preventDefault(); close(); return; }
      if (e.key === 'ArrowDown') { e.preventDefault(); activeIndex = Math.min(visible.length - 1, activeIndex + 1); render(); return; }
      if (e.key === 'ArrowUp') { e.preventDefault(); activeIndex = Math.max(0, activeIndex - 1); render(); return; }
      if (e.key === 'Enter') { e.preventDefault(); runIndex(activeIndex); }
    }

    input.addEventListener('input', function () { activeIndex = 0; render(); });
    listEl.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-cmdk]');
      if (btn) runIndex(Number(btn.getAttribute('data-cmdk')));
    });
    overlay.addEventListener('mousedown', function (e) { if (e.target === overlay) close(); });
    document.addEventListener('keydown', onKey, true);

    render();
    setTimeout(function () { input.focus(); }, 40);
  }
  window.openCommandPalette = openCommandPalette;

  /* ---------- iPhone: подсказка «на экран Домой» ---------- */
  function isIOS() {
    var ua = navigator.userAgent || '';
    var iOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    return iOS && !window.MSStream;
  }

  function isStandalone() {
    return (window.navigator.standalone === true) ||
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  }

  function showIOSInstallHint() {
    if (!isIOS() || isStandalone()) return;
    try { if (localStorage.getItem('poskontrol_ios_hint') === 'off') return; } catch (e) {}
    if (document.querySelector('.ios-install')) return;

    var box = document.createElement('div');
    box.className = 'ios-install ios-only-hint';
    box.innerHTML =
      '<div class="ic">' + icon('download', 18) + '</div>' +
      '<div style="flex:1;min-width:0">' +
        '<div class="ttl">Установить на iPhone</div>' +
        '<div class="txt">В Safari нажмите <b>«Поделиться»</b> (квадрат со стрелкой вверх) → ' +
          '<b>«На экран „Домой“»</b>. Приложение откроется без адресной строки и будет работать без интернета.</div>' +
      '</div>' +
      '<button type="button" class="icon-btn cls" id="iosHintClose" aria-label="Закрыть">' + icon('x', 16) + '</button>';
    document.body.appendChild(box);

    box.querySelector('#iosHintClose').addEventListener('click', function () {
      try { localStorage.setItem('poskontrol_ios_hint', 'off'); } catch (e) {}
      box.remove();
    });
    setTimeout(function () { if (box.parentNode) box.remove(); }, 22000);
  }

  /* ---------- обновления PWA ---------- */
  function watchServiceWorker() {
    if (!('serviceWorker' in navigator) || window.Capacitor) return;
    if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (window.__swReloaded) return;
      window.__swReloaded = true;
      toast('Обновление установлено — перезапустите приложение', 'info', 5000);
    });
    setInterval(function () {
      navigator.serviceWorker.getRegistration().then(function (reg) {
        if (reg) reg.update().catch(function () {});
      }).catch(function () {});
    }, 30 * 60 * 1000);
  }

  function bindDesktopChrome(user) {
    restoreSidebarState();

    var collapseBtn = document.getElementById('sideCollapse');
    if (collapseBtn) collapseBtn.addEventListener('click', toggleSidebarCollapse);

    var searchBtn = document.getElementById('globalSearch');
    if (searchBtn) searchBtn.addEventListener('click', openCommandPalette);

    if (!window.__deskKeysBound) {
      window.__deskKeysBound = true;
      document.addEventListener('keydown', function (e) {
        var mod = e.ctrlKey || e.metaKey;
        if (mod && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); openCommandPalette(); return; }
        if (mod && (e.key === 'b' || e.key === 'B')) { e.preventDefault(); toggleSidebarCollapse(); return; }
        if (e.altKey && /^[1-9]$/.test(e.key)) {
          var pages = WORK_ORDER.concat(['help', 'settings']).filter(function (p) { return canAccess(activeUser, p); });
          var target = pages[Number(e.key) - 1];
          if (target) { e.preventDefault(); navigate(target); }
        }
      });
      var resizeTimer = null;
      window.addEventListener('resize', function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function () {
          applySidebarState(document.body.classList.contains('side-collapsed'));
          syncExportButton();
        }, 160);
      });
    }

    syncExportButton();
    showIOSInstallHint();
  }

  function bindShell(user) {
    var sidebar = document.getElementById('sidebar');
    var overlay = document.getElementById('navOverlay');
    var body = document.body;

    function openSidebar() {
      sidebar.classList.add('open');
      overlay.classList.add('show');
      body.classList.add('no-scroll');
    }
    function closeSidebar() {
      sidebar.classList.remove('open');
      overlay.classList.remove('show');
      if (!document.querySelector('.modal-overlay')) body.classList.remove('no-scroll');
    }

    var menuBtn = document.getElementById('menuBtn');
    if (menuBtn) menuBtn.addEventListener('click', function () {
      if (sidebar.classList.contains('open')) closeSidebar(); else openSidebar();
    });
    var moreBtn = document.getElementById('moreBtn');
    if (moreBtn) moreBtn.addEventListener('click', openSidebar);
    overlay.addEventListener('click', closeSidebar);

    document.querySelectorAll('[data-nav]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        closeSidebar();
        navigate(btn.getAttribute('data-nav'));
      });
    });

    var logoutBtn = document.getElementById('sideLogout');
    if (logoutBtn) logoutBtn.addEventListener('click', function () {
      closeSidebar();
      confirmDialog({ title: 'Выйти из аккаунта?', message: 'Вы сможете войти снова по логину и паролю.', confirmText: 'Выйти' })
        .then(function (ok) { if (ok) doLogout(); });
    });

    var themeBtn = document.getElementById('themeToggle');
    if (themeBtn) {
      themeBtn.addEventListener('click', function () {
        var theme = toggleTheme();
        themeBtn.innerHTML = icon(theme === 'dark' ? 'sun' : 'moon', 17);
      });
    }

    bindCloudPill();

    var pointSwitch = document.getElementById('topbarPoint');
    if (pointSwitch) {
      pointSwitch.addEventListener('change', function () {
        if (!setActivePoint(user, pointSwitch.value)) return;
        toast('Точка продаж: ' + pointName(pointSwitch.value), 'info', 2600);
        if (activePage === 'cash' && typeof window.resetCashStatePoint === 'function') window.resetCashStatePoint();
        renderApp(activePage, user);
      });
    }

    bindDesktopChrome(user);

    var topbarUser = document.getElementById('topbarUser');
    if (topbarUser) topbarUser.addEventListener('click', function () { navigate('settings'); });
    var sideUser = document.getElementById('sideUser');
    if (sideUser) sideUser.addEventListener('click', function () { navigate('settings'); });
  }

  function renderPageOnly() {
    var pageRoot = document.getElementById('pageRoot');
    if (!pageRoot || !activeUser || !activePage) return;
    try {
      PAGES[activePage].render(pageRoot, pageCtx(activeUser, activePage));
      syncExportButton();
    } catch (err) {
      console.error('Ошибка раздела', err);
      pageRoot.innerHTML = '<div class="page"><div class="card">' +
        emptyState('alert', 'Не удалось открыть раздел', 'Произошла ошибка при отрисовке. Попробуйте обновить страницу или вернуться на панель.',
          '<button class="btn btn-primary" id="errHome">На панель</button><button class="btn btn-secondary" id="errReload">Обновить</button>') +
        '</div></div>';
      var home = pageRoot.querySelector('#errHome');
      if (home) home.addEventListener('click', function () { navigate(defaultPage(activeUser)); });
      var reload = pageRoot.querySelector('#errReload');
      if (reload) reload.addEventListener('click', function () { location.reload(); });
    }
  }

  function renderApp(page, user) {
    watchServiceWorker();
    activeUser = user;
    activePage = page;
    document.getElementById('app').innerHTML = shellHtml(user, page);
    bindShell(user);
    document.title = 'POS Контроль — ' + NAV[page].label;
    renderPageOnly();
  }

  function renderAuth(page) {
    activePage = null;
    activeUser = null;
    var appEl = document.getElementById('app');
    appEl.innerHTML = '';
    document.title = page === 'register' ? 'POS Контроль — Регистрация' : 'POS Контроль — Вход';
    var ctx = { navigate: navigate, rerender: function () { renderAuth(page); } };
    if (PAGES[page]) PAGES[page].render(appEl, ctx);
  }

  function route() {
    var raw = (location.hash || '').replace(/^#\/?/, '').split('?')[0];
    var user = currentUser();

    if (!user) {
      var authPage = raw === 'register' ? 'register' : 'login';
      if (location.hash !== '#/' + authPage) history.replaceState(null, '', '#/' + authPage);
      renderAuth(authPage);
      return;
    }

    if (!raw || raw === 'login' || raw === 'register') {
      var target = defaultPage(user);
      history.replaceState(null, '', '#/' + target);
      raw = target;
    }
    if (!PAGES[raw] || !canAccess(user, raw)) {
      var fallback = defaultPage(user);
      toast('Доступ к разделу «' + (NAV[raw] ? NAV[raw].label : raw) + '» ограничен для вашей роли', 'warn');
      history.replaceState(null, '', '#/' + fallback);
      raw = fallback;
    }

    if (activePage && PAGES[activePage] && typeof PAGES[activePage].cleanup === 'function') {
      try { PAGES[activePage].cleanup(); } catch (e) { /* ignore */ }
    }
    renderApp(raw, user);
    try { window.scrollTo(0, 0); } catch (e) { /* ignore */ }
  }

  window.addEventListener('hashchange', route);

  window.addEventListener('error', function (e) {
    if (e && e.message) console.error('[POS]', e.message);
  });
  window.addEventListener('unhandledrejection', function (e) {
    console.error('[POS] Необработанная ошибка', e.reason);
  });

  function boot() {
    initCore();
    applyTheme();
    if (window.POS_API) {
      window.POS_API.startAutoSync();
      window.addEventListener('pos:sync', function () {
        refreshCloudPill();
        // открытые формы не трогаем — обновляем только индикатор
        var page = document.getElementById('pageRoot');
        if (page && activePage === 'dashboard' && !document.querySelector('.modal-overlay')) {
          var focused = document.activeElement;
          var editing = focused && /^(INPUT|TEXTAREA|SELECT)$/.test(focused.tagName);
          if (!editing) renderPageOnly();
        }
      });
      window.addEventListener('pos:sync-error', function () { refreshCloudPill(); });
      setTimeout(function () { window.POS_API.syncNow({ silent: true }); }, 1200);
    }
    if (!location.hash) {
      var user = currentUser();
      history.replaceState(null, '', user ? '#/' + defaultPage(user) : '#/login');
    }

    // забытые смены: закрываем при запуске и далее раз в 20 секунд
    autoCloseOpenShifts();
    startShiftWatcher();

    route();
  }

  /**
   * Следит за границей 02:00:
   *  — закрывает смены, где забыли отметить уход;
   *  — завершает сессию продавца в 02:00.
   */
  function startShiftWatcher() {
    var lastTick = Date.now();
    setInterval(function () {
      var now = Date.now();
      var closed = autoCloseOpenShifts(now);
      var user = currentUser();

      if (closed.length && user) {
        var mine = closed.some(function (t) { return t.userId === user.id; });
        if (mine) toast('Смена закрыта автоматически в ' + fmtTime(shiftAutoCloseAt(closed[0].date)) + ': уход не был отмечен', 'info', 6000);
      }

      var boundary = nightBoundaryBetween(lastTick, now);
      lastTick = now;
      if (!boundary) return;

      // 02:00 — сессия продавца завершается
      if (user && user.role === 'seller') {
        logoutUser();
        if (typeof window.resetCashState === 'function') window.resetCashState();
        activePage = null;
        toast('Смена завершена автоматически в 02:00. Войдите снова перед началом работы', 'info', 7000);
        history.replaceState(null, '', '#/login');
        route();
      }
    }, 20000);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();

</script>
